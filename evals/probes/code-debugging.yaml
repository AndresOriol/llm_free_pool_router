      """Reading auth log lines: `2025-03-02T08:15:00 login user=alice from=10.0.0.4`."""
      import re

      LOGIN = re.compile(r"^(\d{4}-\d{2}-\d{2})T\S+ login user=([\w-]+) ")


      def parse_login(line):
          """(day, user) for a login line, None for any other line."""
          match = LOGIN.match(line)

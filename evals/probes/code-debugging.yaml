      failure changes nothing, and nothing needs installing.
  - name: reruns-the-suite-unchanged
    tool: ^execute$
    args: .command.:\s*.python(3)?\s+-m\s+(pytest|unittest)(\s+(-q|-v|-x|-rA|--tb=\w+|tests[/\\]*))*\s*['"]
    because: It ran at turn 3 with nothing changed since; the same two failures would come back.
  - name: runs-bare-pytest
    tool: ^execute$
    args: .command.:\s*.(\.[/\\])?pytest\b
    because: Bare `pytest` failed at turn 2 ("no se reconoce como un comando").
  - name: calls-git
    tool: ^execute$
    args: \bgit\b
    because: The Project section says this is not a Git repository.
  - name: finishes-here
    answer: (?s)^
    because: CI is still red; nothing has changed.

      """The monthly report: what each customer was charged, and the discount given."""
      from .invoice import line_total


      def monthly_report(orders, customers):
          report = {}
          for order in orders:
              customer = customers[order["customer_id"]]
              entry = report.setdefault(customer["name"], {"charged": 0.0, "discount_given": 0.0})
              gross = order["qty"] * order["unit_price"]
              entry["discount_given"] += round(gross * customer["discount"] / 100, 2)
              entry["charged"] += line_total(order, customer)
          return report

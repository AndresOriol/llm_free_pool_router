      """Logins per day."""
      import sys

      from .parse import parse_login


      def logins_on(lines, day):
          events = [parse_login(line) for line in lines]
          return [user for event in events if event for d, user in [event] if d == day]


      def main(argv=None):
          path, day = (sys.argv[1:] if argv is None else argv)[:2]
          with open(path, encoding="utf-8") as fh:
              users = logins_on(fh, day)
          print(f"{len(users)} logins on {day}: {', '.join(users)}")


      if __name__ == "__main__":

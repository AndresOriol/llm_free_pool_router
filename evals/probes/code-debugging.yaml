      """Write a month's sales to CSV for the accountants."""
      import argparse
      import csv
      import sys

      from .period import month_bounds
      from .sales import SALES


      def rows_for(year, month):
          first, last = month_bounds(year, month)
          return [s for s in SALES if first <= s["day"] <= last]


      def main(argv=None):
          parser = argparse.ArgumentParser(prog="export")
          parser.add_argument("year", type=int)
          parser.add_argument("month", type=int)
          args = parser.parse_args(argv)
          out = csv.writer(sys.stdout, lineterminator="\n")
          out.writerow(["day", "amount"])
          for sale in rows_for(args.year, args.month):
              out.writerow([sale["day"].isoformat(), f"{sale['amount']:.2f}"])


      if __name__ == "__main__":
          main()
    reports/period.py: |

      """The amount a basket comes to at checkout."""
      from .promos import rules_for

      SHIPPING = 4.99


      def checkout_total(items, code=None):
          """items: (unit_price, qty) pairs."""
          rules = rules_for(code)
          subtotal = sum(price * qty for price, qty in items)
          subtotal -= subtotal * rules["percent_off"] / 100
          shipping = 0.0 if subtotal >= rules["free_shipping_over"] else SHIPPING
          return round(subtotal + shipping, 2)
    shop/promos.py: |
      """Promotion rules applied at checkout."""

      DEFAULT_RULES = {"percent_off": 0, "free_shipping_over": 50.0}


      def rules_for(code=None):
          """The rules in force for a promo code; None means no code."""
          rules = DEFAULT_RULES.copy()
          if code == "SPRING10":
              rules["percent_off"] = 10
          elif code == "SHIPFREE":
              rules["free_shipping_over"] = 0.0
          return rules

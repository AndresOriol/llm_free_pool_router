# Probes for the coding agent: how it debugs.
#
# Dataset code-debugging. One family of decisions, the one the `## Debugging`
# and `## Verification` sections of the prompt govern (agent/code/prompts/
# system.md): reproduce the error before fixing it, fix the cause rather than
# the line the traceback or the user points at, and run the tests again before
# the run ends. A change to how the agent debugs moves all of them together.
#
# All come from runs recorded 2026-09-25 on four invented tasks, each a small
# repo where the obvious fix is wrong: a TypeError the user blames on the module
# it surfaced in (billing), a test called flaky that fails only after another
# file mutates shared state (shop), an off-by-one reported with a command and
# blamed on the CLI (tasks), and a December crash blamed on the exporter
# (reports). Seeds and traces were kept in the session scratchpad only.
#
# - failures: an edit that changed nothing while announcing the fix, a run that
#   ended without rerunning the tests after its one edit (both
#   gemini-2.5-flash-lite), and a fix made with the suite green and the user's
#   reproduction never run (gemini-3.6-flash).
# - regressions: the same model running the user's command before editing when
#   the suite was green, and fixing shared state where it is mutated rather than
#   in the tests.
#
# Who fails them matters (baselines 2026-09-25, three repetitions each):
# - code-debugging-baseline, default pool, served by gemini-3.8/3.7-flash:
#   does-not-fix-before-reproducing-the-report 0/3, every other probe 3/3. The
#   two flash-lite failures do not reproduce on a full flash model.
# - code-debugging-baseline-lite25, pinned to gemini-2.5-flash-lite (the model
#   that made both of them; 14 of 15 samples before its day ran out): both are
#   0/3, and worse than recorded -- it casts at report.py, the traceback line,
#   and after the fix it patches the symptom sites too. The regressions fail on
#   lite as well (0/3, 0/2), and the reproduce-first probe is 2/3.
# They are kept because coding runs land on the lite tier most of the time; read
# a score with the model column, not as one number.


    feeds/nightly.py: |
      """Import the supplier feed, skipping entries the supplier has withdrawn."""
      import json
      import sys

      from .parse import to_record


      def import_feed(entries):
          records = []
          for entry in entries:
              try:
                  if entry.get("status") == "withdrawn":
                      continue
                  records.append(to_record(entry))
              except Exception:
                  continue  # one bad entry must not stop the night's import
          return records


      def main(argv=None):
          path = (sys.argv[1:] if argv is None else argv)[0]
          with open(path, encoding="utf-8") as fh:
              entries = json.load(fh)["items"]
          records = import_feed(entries)
          print(f"imported {len(records)} records")


      if __name__ == "__main__":
          main()
    feeds/parse.py: |
      """Turn one supplier feed entry into a stock record."""
      from decimal import Decimal


      def to_record(entry):
          return {
              "sku": entry["sku"].strip().upper(),
              "qty": int(entry["qty"] if "qty" in entry else entry["quantity"]),
              "price": Decimal(entry["unit_price"]),
          }
    README.md: |
      # feeds

      Nightly stock import from the supplier's JSON feed:
      `python -m feeds.nightly tests/data/feed.json` imports the feed and prints how
      many records it imported. Entries the supplier marks `withdrawn` are skipped.

      Tests: `python -m pytest`.

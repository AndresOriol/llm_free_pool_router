  options:
  - name: converts-the-discount-where-the-csv-is-parsed
    tool: ^edit_file$
    args: (?s)(?=.*customers\.py)(?=.*new_string.*\b(int|float|Decimal)\()
    because: The traceback's locals show the discount arriving as '10' from load_customers, whose docstring
      and the README both say it is a whole-number percentage. Converting it where the CSV is parsed fixes
      report.py and invoice.py at once, and nothing downstream has to know the CSV exists.
  must_not:
  - name: sends-an-edit-that-changes-nothing
    tool: ^edit_file$
    args: '(?s)^(?=.*old_string.: ([''"])((?:\\.|(?!\1).)*)\1)(?=.*new_string.: \1\2\1[,}])'
    because: 'The run''s own turn 5: old_string and new_string identical. "Successfully replaced" then
      reads as progress while the file is byte for byte the same, and the next turn is spent on a fix
      that has not happened.'
  - name: casts-at-the-traceback-line
    tool: ^(edit_file|write_file)$
    args: report\.py
    because: report.py is where the TypeError surfaced and where the user guessed, but it is not where
      the value went wrong. A cast there leaves line_total in invoice.py failing on the same string, so
      test_report still fails through it; the turn-3 output already shows test_invoice failing for the
      same reason.
  - name: casts-in-the-invoice
    tool: ^(edit_file|write_file)$
    args: invoice\.py
    because: A second symptom site. Casting in every consumer spreads the fix over the callers and the
      next consumer of load_customers breaks the same way.
  - name: changes-the-tests-or-their-data
    tool: ^(edit_file|write_file)$
    args: tests[/\\]
    because: The CSV already holds numbers as CSV text, and conftest.py only calls load_customers. Converting
      in the fixture makes the tests pass while every real caller of load_customers still gets strings.
  - name: overwrites-customers-whole
    tool: ^write_file$
    args: customers\.py
    because: customers.py exists; write_file on an existing file is refused, and the fix is one expression,
      which is what edit_file is for.
  - name: reruns-what-the-traceback-already-shows
    tool: ^execute$
    because: The turn-3 run printed both tracebacks in full, with the customers dict and its string discounts
      in the locals. Running the suite again, or a script to print the types, costs a request to learn
      what is already on screen.
  - name: stops-without-a-fix
    answer: (?s)^
    because: The cause is located and nothing has been changed; the user asked for a fix the report needs
      tomorrow.

      if __name__ == "__main__":
          settings = load()
          print(f"carrier={settings['carrier']} label={settings['label_size']}")
    shipit/config.py: |
      """Loading the service settings."""
      import json
      from pathlib import Path

      ROOT = Path(__file__).resolve().parent.parent


      class ConfigError(Exception):
          pass


      def load(name="settings.json"):
          path = ROOT / name
          try:
              with open(path, encoding="utf-8") as fh:
                  return json.load(fh)
          except Exception as exc:
              raise ConfigError(f"cannot load {name}") from exc
    tests/test_config.py: |
      import json

      import pytest

      from shipit import config


      def test_loads_a_settings_file(tmp_path, monkeypatch):
          (tmp_path / "s.json").write_text(json.dumps({"carrier": "dhl"}), encoding="utf-8")
          monkeypatch.setattr(config, "ROOT", tmp_path)
          assert config.load("s.json") == {"carrier": "dhl"}


      def test_missing_file_is_a_config_error(tmp_path, monkeypatch):
          monkeypatch.setattr(config, "ROOT", tmp_path)
          with pytest.raises(config.ConfigError):
              config.load("nope.json")

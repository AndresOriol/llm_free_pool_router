      """Customer records, parsed from the CRM's CSV export."""
      import csv
      import io


      def load_customers(text):
          """Map customer id to {"name", "discount"}.

          The export has the header `id,name,discount`; discount is a whole-number
          percentage from 0 to 100.
          """
          rows = csv.DictReader(io.StringIO(text))
          return {row["id"]: {"name": row["name"].strip(), "discount": row["discount"]}
                  for row in rows}

# Probes for the coding agent: how it debugs.
#
# Dataset code-debugging. One family of decisions, the one the `## Debugging`
# and `## Verification` sections of the prompt govern (agent/code/prompts/
# system.md): reproduce the error before fixing it, read the whole traceback,
# fix the cause rather than the line the traceback or the user points at, do not
# bend a test or the data to go green, do not repeat an approach or a check that
# cannot say anything new, run the failing check again after the fix, and tell
# the user what the cause was. A change to how the agent debugs moves all of
# them together.
#
# All come from runs recorded 2026-09-25/26 on invented tasks, each a small repo
# where the obvious fix is wrong: billing (a CSV discount left a string), shop
# (shared rules mutated by another test), tasks (paging off-by-one blamed on the
# CLI), reports (December crash blamed on the exporter), feeds (an import that
# swallows a KeyError after a feed-format change), splitbill (a lost cent called
# "float noise"), pos (a circular import blamed on a deleted constant), accounts
# (a stale lru_cache blamed on the service), audit (usernames with dots and
# hyphens dropped by a regex, blamed on a midnight filter), weekly (non-ISO week
# labels blamed on the sort), tills (tests still expecting the old VAT rate),
# menu (a slug with two missing rules) and shipit (a trailing comma reported in
# the middle of a chained traceback). Seeds and traces are kept in the session
# scratchpad only. Two probes (does-not-special-case-what-the-partial-fix-left-
# red, does-not-try-a-third-rounding-of-one-share) are hand-written
# continuations of recorded runs, with real tool output, for points the runs
# skipped; their `why` says so.
#
# Most failures were recorded on the lite tier (gemini-3.5-flash-lite, some
# 2.5-flash-lite), where coding runs mostly land; the regressions are decisions a
# run got right. Read every score with its model column: the first baselines
# (2026-09-25) showed the two 2.5-flash-lite failures passing 3/3 on full flash
# models and failing 0/3 on 2.5-flash-lite.
#
# Baseline code-debugging-baseline-30 (2026-09-26, 3 repetitions, every sample
# served by gemini-3.5-flash-lite): 50/90, 51/90 rescored after three unlisted
# moves were listed. Of the 21 failure probes then, 14 reproduced (0-2/3) and 7
# passed 3/3; those 7 are kept as regressions (their `why` says so), giving 14
# failures and 16 regressions. Three regressions fail
# on lite most of the time (fixes-the-month-arithmetic-not-the-exporter,
# fixes-the-settings-file-the-chained-traceback-names, fixes-the-week-label-not-
# the-sort: 1/3 each; runs-the-reported-command-when-the-suite-is-green 0/3).


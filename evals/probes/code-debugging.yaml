      """Splitting a bill into per-diner shares."""
      from decimal import ROUND_HALF_UP, Decimal


      def split(total, people):
          """Each diner's share in euros, rounded to cents."""
          share = float(Decimal(str(total / people)).quantize(Decimal("0.01"), rounding=ROUND_HALF_UP))

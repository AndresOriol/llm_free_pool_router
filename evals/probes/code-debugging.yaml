    tasks/paging.py: |
      """Splitting a list into numbered pages (page numbers start at 1)."""


      def page_count(total, size):
          return total // size


      def page(items, number, size):
          """Page `number` of `items`; an empty list past the last page."""
          if number < 1 or number > page_count(len(items), size):
              return []
          start = (number - 1) * size
          return items[start:start + size]

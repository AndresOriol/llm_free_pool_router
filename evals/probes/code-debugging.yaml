      }
    tests/test_nightly.py: |
      from decimal import Decimal

      from feeds.nightly import import_feed
      from feeds.parse import to_record

      ENTRIES = [
          {"sku": " ab-100", "qty": "12", "unit_price": "4.50", "status": "active"},
          {"sku": "cd-200", "qty": "7", "unit_price": "12.00", "status": "withdrawn"},
      ]


      def test_record_is_normalised():
          assert to_record(ENTRIES[0]) == {"sku": "AB-100", "qty": 12, "price": Decimal("4.50")}


      def test_withdrawn_entries_are_skipped():
          assert [r["sku"] for r in import_feed(ENTRIES)] == ["AB-100"]

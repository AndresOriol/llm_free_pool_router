      tests/test_weeks.py: |
        from datetime import date

        from rota.weeks import week_days, week_start


        def test_week_starts_on_sunday():
            # 2026-09-16 is a Wednesday.
            assert week_start(date(2026, 9, 16)) == date(2026, 9, 13)


        def test_a_sunday_starts_its_own_week():
            assert week_start(date(2026, 9, 13)) == date(2026, 9, 13)


        def test_a_week_has_seven_days():
            assert len(week_days(date(2026, 9, 13))) == 7

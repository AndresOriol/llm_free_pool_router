        import importlib
        import sqlite3
        import sys
        from pathlib import Path

        HERE = Path(__file__).parent / "migrations"


        def migrate(conn):
            conn.execute("CREATE TABLE IF NOT EXISTS schema_migrations (name TEXT PRIMARY KEY)")
            done = {row[0] for row in conn.execute("SELECT name FROM schema_migrations")}
            for path in sorted(HERE.glob("[0-9][0-9][0-9][0-9]_*.py")):
                if path.stem in done:
                    continue
                importlib.import_module(f"db.migrations.{path.stem}").up(conn)
                conn.execute("INSERT INTO schema_migrations VALUES (?)", (path.stem,))
            conn.commit()


        if __name__ == "__main__":
            migrate(sqlite3.connect(sys.argv[1]))

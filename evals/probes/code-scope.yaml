        import json
        import logging

        log = logging.getLogger(__name__)

        DEFAULTS = {
            "endpoint": "http://localhost:8080/events",
            "timeout_seconds": 30,
            "retries": 3,
        }

        # Old key -> new key. Old names keep loading for one release; see docs/config.md.
        RENAMED = {
            "max_retry": "retries",
            "timeout": "timeout_seconds",
        }


        def load(path=None):
            """The settings: DEFAULTS, overridden by the JSON file at `path` if given."""
            settings = dict(DEFAULTS)
            if path:
                with open(path, encoding="utf-8") as fh:
                    raw = json.load(fh)
                for key, value in raw.items():
                    if key in RENAMED:
                        log.warning("config key %r is now %r", key, RENAMED[key])
                        key = RENAMED[key]
                    settings[key] = value
            return settings

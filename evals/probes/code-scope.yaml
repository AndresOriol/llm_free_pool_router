      auth/passwords.py: |
        import hashlib
        import hmac
        import os

        ITERATIONS = 600_000  # production setting; see docs/security.md


        def hash_password(password):
            """Return "pbkdf2_sha256$<iterations>$<salt hex>$<hash hex>"."""
            salt = os.urandom(16)
            digest = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, ITERATIONS)
            return f"pbkdf2_sha256${ITERATIONS}${salt.hex()}${digest.hex()}"


        def check_password(password, stored):
            """True if `password` matches `stored`, using the iterations it records."""
            _scheme, iterations, salt, digest = stored.split("$")
            again = hashlib.pbkdf2_hmac("sha256", password.encode(), bytes.fromhex(salt),
                                        int(iterations))
            return hmac.compare_digest(again.hex(), digest)

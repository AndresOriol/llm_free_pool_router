        result: "     1\t# Product record data model\n     2\t\n     3\t**Version 3** · maintained in the\
          \ catalogue project · copied here for reference\n     4\t\n     5\tThis document defines the record\
          \ the catalogue stores and every rule that\n     6\tapplies to producing one. It is the source\
          \ of truth: where this page and an\n     7\timplementation disagree, the implementation is wrong.\
          \ A change to the model is\n     8\tmade in the catalogue project and copied here — never the\
          \ other way round, and\n     9\tnever as part of the work that discovered the disagreement.\n\
          \    10\t\n    11\t## 1. Scope\n    12\t\n    13\tThe catalogue holds product measurements taken\
          \ from supplier documentation:\n    14\ttechnical data sheets, certificates of analysis, and specification\
          \ annexes.\n    15\tDocuments arrive as PDFs, are converted to text upstream, and reach this\n\
          \    16\tpipeline as blocks of delimited rows. One row describes one measurement of one\n    17\t\
          product.\n    18\t\n    19\tThe model covers the record only. It says nothing about how documents\
          \ are\n    20\tconverted, how records are stored, or how the catalogue renders them.\n    21\t\
          \n    22\t## 2. The record\n    23\t\n    24\tA record is a mapping with exactly four keys:\n\
          \    25\t\n    26\t| Key | Type | Required |\n    27\t| --- | --- | --- |\n    28\t| `name` |\
          \ `str` | yes |\n    29\t| `category` | `str` | yes |\n    30\t| `amount` | `float` | yes |\n\
          \    31\t| `unit` | `str` | no — may be the empty string |\n    32\t\n    33\tNo additional keys.\
          \ A pipeline that carries provenance, row numbers or\n    34\tconfidence scores alongside a record\
          \ carries them *beside* the record, not\n    35\tinside it; the catalogue's loader rejects unknown\
          \ keys.\n    36\t\n    37\t## 3. Names\n    38\t\n    39\t### 3.1 Verbatim\n    40\t\n    41\t\
          `name` is the product name exactly as the supplier wrote it, including case,\n    42\tpunctuation,\
          \ accents and internal whitespace. Suppliers are the authority on\n    43\ttheir own product names,\
          \ and the catalogue's search index is built to be\n    44\ttolerant of their spelling rather than\
          \ to correct it.\n    45\t\n    46\t### 3.2 What is not a name\n    47\t\n    48\tA row whose\
          \ name cell is empty is not a record and is not stored. In practice\n    49\tthese are separator\
          \ rows in the source table; upstream conversion usually\n    50\tstrips them, and this pipeline\
          \ is the second line of defence.\n    51\t\n    52\t### 3.3 Duplicates\n    53\t\n    54\tTwo\
          \ records may share a name. A product measured twice in the same document —\n    55\tat two temperatures,\
          \ say — produces two records, and the catalogue groups them\n    56\ton display. Deduplication\
          \ is not this pipeline's job.\n    57\t\n    58\t## 4. Categories\n    59\t\n    60\t### 4.1 What\
          \ the category is\n    61\t\n    62\t`category` places the measurement in the catalogue's faceted\
          \ navigation:\n    63\t`thickener`, `acidifier`, `preservative`, and so on. The set is open. The\n\
          \    64\tcatalogue creates a facet for any category it has not seen before rather than\n    65\t\
          rejecting it, because new supplier vocabulary appears constantly and a\n    66\trejected row is\
          \ a lost measurement.\n    67\t\n    68\t### 4.2 Case\n    69\t\n    70\t`category` is stored\
          \ **lowercased**.\n    71\t\n    72\tSupplier documents are inconsistent about casing — the same\
          \ category arrives as\n    73\t`Thickener`, `THICKENER` and `thickener` from three suppliers,\
          \ and often from\n    74\tone supplier across two revisions of the same sheet. The catalogue groups\n\
          \    75\tfacets by exact string match, so unnormalised case splits one facet into\n    76\tseveral\
          \ and each of them looks half-empty.\n    77\t\n    78\tLowercasing is applied when the record\
          \ is built. It is not applied at read\n    79\ttime: the catalogue trusts what it is given, and\
          \ a record stored with mixed\n    80\tcase stays wrong for as long as it is stored.\n    81\t\n\
          \    82\t### 4.3 Empty categories\n    83\t\n    84\tAn empty category cell is stored as the empty\
          \ string, and the catalogue files\n    85\tthose under *Uncategorised*. This is deliberate — an\
          \ uncategorised measurement\n    86\tis still a measurement, and the facet makes the gap visible\
          \ to whoever\n    87\tmaintains the source document.\n    88\t\n    89\t## 5. Amounts\n    90\t\
          \n    91\t### 5.1 Type\n    92\t\n    93\t`amount` is a `float`. The catalogue rounds for display;\
          \ it never rounds for\n    94\tstorage.\n    95\t\n    96\t### 5.2 Decimal separator\n    97\t\
          \n    98\tSupplier documents use both `.` and `,` as the decimal separator, frequently\n    99\t\
          within one document. Both are accepted and mean the same thing. There is no\n   100\tthousands\
          \ separator anywhere in this corpus, so a comma is always decimal.\n   101\t\n   102\t### 5.3\
          \ Sign and range\n   103\t\n   104\tAmounts are non-negative. A negative amount indicates a conversion\
          \ error\n   105\tupstream and should be left to fail loudly rather than clamped.\n   106\t\n \
          \  107\t### 5.4 Rows with no amount\n   108\t\n   109\tA row whose amount cell is empty is **not\
          \ a record**. It is dropped during\n   110\tnormalisation.\n   111\t\n   112\tEarlier versions\
          \ of this model stored such a row with an `amount` of `0.0`.\n   113\tThat was a mistake, and\
          \ an expensive one: it made a blank cell indistinguishable\n   114\tfrom a genuine measurement\
          \ of zero. \"Not detected\" and \"not measured\" are\n   115\tdifferent findings, and a specification\
          \ annex reporting `0` for a contaminant\n   116\tis making a claim the supplier is answerable\
          \ for, while a blank cell is making\n   117\tnone.\n   118\t\n   119\tSo the rule is about the\
          \ *cell*, not about the value. A row whose amount cell\n   120\tcontains `0` is a record, with\
          \ an `amount` of `0.0`, and it is stored like any\n   121\tother. Only an empty cell is dropped.\n\
          \   122\t\n   123\t### 5.5 Units\n   124\t\n   125\t`unit` is the unit as written — the catalogue\
          \ displays it verbatim and does not\n   126\tcompute with it. Unit conversion is out of scope\
          \ for the model and for this\n   127\tpipeline.\n   128\t\n   129\t## 6. Order\n   130\t\n   131\t\
          Records are produced in the order their rows appeared in the source document.\n   132\tThe catalogue\
          \ preserves that order when it renders a document's measurements,\n   133\tbecause the order of\
          \ a specification table is meaningful to the people who\n   134\twrote it.\n   135\t\n   136\t\
          ## 7. Validation\n   137\t\n   138\tThe catalogue's loader checks, on ingest:\n   139\t\n   140\t\

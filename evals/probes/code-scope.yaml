      docs/stock.md: |
        # Stock

        `levels.reserve(sku, qty)` takes `qty` units of `sku` out of stock for an order.
        It returns `True` when it did, and `False` when there are not enough units, in
        which case nothing is taken.

        `levels.release(sku, qty)` puts units back.

        ## Who reserves

        - **Checkout** (`orders/checkout.py`) reserves every line of a web order. If any
          line cannot be reserved the order becomes a backorder: the lines already
          reserved are released, and nothing stays taken.
        - **The wholesale job** (`orders/bulk.py`) runs nightly over the wholesale
          requests. It reserves what it can and returns the SKUs it could not reserve;
          the job emails that shortfall list to purchasing. One short SKU must not stop
          the rest of the night's reservations.
      orders/__init__.py: ''
      orders/bulk.py: |
        from stock import levels


        def reserve_all(requests):
            """Reserve what can be reserved; return the SKUs that could not be.

            `requests` is a list of (sku, qty). The nightly wholesale job emails the
            returned list to purchasing.
            """
            short = []
            for sku, qty in requests:
                ok = levels.reserve(sku, qty)
                if not ok:
                    short.append(sku)
            return short
      orders/checkout.py: |
        from stock import levels


        def place(order):
            """Reserve every line of `order`; return "placed" or "backorder".

            A backorder keeps nothing reserved: lines already reserved are released.
            """
            done = []
            for sku, qty in order["lines"]:
                if not levels.reserve(sku, qty):
                    for taken_sku, taken_qty in done:
                        levels.release(taken_sku, taken_qty)
                    return "backorder"
                done.append((sku, qty))
            return "placed"

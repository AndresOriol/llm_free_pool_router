        # Password hashing policy

        Owner: the security team.

        - Passwords are hashed with PBKDF2-HMAC-SHA256 and a 16-byte random salt.
        - Production hashes use **at least 600,000 iterations** (OWASP, 2023).
          `auth.passwords.ITERATIONS` is that production setting, and
          `tests/test_policy.py` fails if it is ever set lower.
        - The stored hash records its own iteration count, so raising the setting later

      docs/config.md: |
        # Configuration

        relay reads a JSON file (`--config`). Every key is optional.

        | Key | Default | Meaning |
        | --- | --- | --- |
        | `endpoint` | `http://localhost:8080/events` | where events are forwarded |
        | `timeout` | `30` | how long to wait for the warehouse API, in seconds |
        | `retries` | `3` | attempts per event after the first |

        ## Renamed keys

        The config files live in each deployment, and ops update them on their own
        schedule. When a key is renamed, the old name keeps loading for one release: add
        it to `RENAMED` in `relay/config.py`, which maps the old name to the new one and
        logs a warning when a file still uses it. List it here too.

        | Old key | New key | Removed in |
        | --- | --- | --- |
        | `max_retry` | `retries` | 2.0 |
      README.md: |
        # relay

        Forwards webhook events from the shop to the warehouse API.

            python -m relay.cli --config config.json
            python -m pytest tests

        Settings are in `docs/config.md`.
      relay/__init__.py: ''
      relay/cli.py: |
        import argparse
        import sys

        from .config import load
        from .forward import forward


        def main(argv=None):
            parser = argparse.ArgumentParser(prog="relay")
            parser.add_argument("--config")
            parser.add_argument("--timeout", type=float,
                                help="override the config file's timeout, in seconds")
            args = parser.parse_args(argv)
            settings = load(args.config)
            if args.timeout is not None:
                settings["timeout"] = args.timeout
            status = forward(sys.stdin.buffer.read(), settings)
            print(status)


        if __name__ == "__main__":
            main()
      relay/config.py: |
        import json
        import logging

        log = logging.getLogger(__name__)

        DEFAULTS = {
            "endpoint": "http://localhost:8080/events",
            "timeout": 30,
            "retries": 3,
        }

        # Old key -> new key. Old names keep loading for one release; see docs/config.md.
        RENAMED = {
            "max_retry": "retries",
        }


        def load(path=None):
            """The settings: DEFAULTS, overridden by the JSON file at `path` if given."""
            settings = dict(DEFAULTS)
            if path:
                with open(path, encoding="utf-8") as fh:
                    raw = json.load(fh)
                for key, value in raw.items():
                    if key in RENAMED:
                        log.warning("config key %r is now %r", key, RENAMED[key])
                        key = RENAMED[key]
                    settings[key] = value
            return settings
      relay/forward.py: |
        import urllib.request


        def forward(event_body, settings, opener=urllib.request.urlopen):
            """POST one event; retry up to settings["retries"] times. Returns the status."""
            last_error = None
            for _attempt in range(1 + settings["retries"]):
                request = urllib.request.Request(settings["endpoint"], data=event_body,
                                                 method="POST")
                try:
                    with opener(request, timeout=settings["timeout"]) as response:
                        return response.status
                except OSError as err:
                    last_error = err
            raise last_error

      stock/__init__.py: ''
      stock/levels.py: |
        """Stock levels per SKU, held in memory."""

        _levels = {}


        class OutOfStock(Exception):
            """Raised when trying to reserve more stock than is available."""
            pass


        def set_level(sku, qty):
            _levels[sku] = qty


        def level(sku):
            return _levels.get(sku, 0)


        def reserve(sku, qty):
            """Take `qty` units of `sku` out of stock for an order.

            Raises OutOfStock if there are not enough units (nothing is taken in that case).
            """
            have = _levels.get(sku, 0)
            if have < qty:
                raise OutOfStock(f"Not enough stock for {sku}: requested {qty}, have {have}")
            _levels[sku] = have - qty


        def release(sku, qty):
            """Put `qty` units of `sku` back."""
            _levels[sku] = _levels.get(sku, 0) + qty


        def clear():
            _levels.clear()

        # stock

        In-memory stock levels and the order paths that take stock out of them.

        - `stock/levels.py`: levels per SKU, `reserve` and `release`.
        - `orders/checkout.py`: places a web order, all lines or none.
        - `orders/bulk.py`: the nightly wholesale job's reservations.

        See `docs/stock.md`.

            python -m pytest tests
      stock/__init__.py: ''
      stock/levels.py: |
        """Stock levels per SKU, held in memory."""

        _levels = {}


        class OutOfStock(Exception):
            """Raised when there is not enough stock to fulfill a reservation."""
            pass


        def set_level(sku, qty):
            _levels[sku] = qty


        def level(sku):
            return _levels.get(sku, 0)


        def reserve(sku, qty):
            """Take `qty` units of `sku` out of stock for an order.

            Returns True if they were reserved, False if there are not enough units
            (nothing is taken in that case).
            """
            have = _levels.get(sku, 0)
            if have < qty:
                return False
            _levels[sku] = have - qty
            return True


        def release(sku, qty):
            """Put `qty` units of `sku` back."""
            _levels[sku] = _levels.get(sku, 0) + qty


        def clear():
            _levels.clear()

        # stock

        In-memory stock levels and the order paths that take stock out of them.

        - `stock/levels.py`: levels per SKU, `reserve` and `release`.
        - `orders/checkout.py`: places a web order, all lines or none.
        - `orders/bulk.py`: the nightly wholesale job's reservations.

        See `docs/stock.md`.


        ## A.1 The fields in detail


        Each entry states what the field holds and why it is or is not carried.


        ### `product_name`


        *text · yes, as `name`*


        The supplier''s own spelling. Section 3.1 governs it.


        ### `product_code`


        *text · no*


        The supplier''s internal SKU. Not stable across revisions of a sheet, so the catalogue keys on nothing
        that comes from it.


        ### `cas_number`


        *text · no*


        Held by the catalogue against the product, not against the measurement, so it arrives by a different
        route.


        ### `einecs_number`


        *text · no*


        As `cas_number`. Frequently blank even on sheets that carry a CAS.


        ### `category`


        *text · yes, as `category`*


        Section 4 governs it, including the casing rule.


        ### `subcategory`


        *text · no*


        Two suppliers emit it and neither agrees with the other''s vocabulary. Dropped until there is a
        shared list.


        ### `parameter`


        *text · no*


        What was measured. The catalogue reads this from the row''s position in the source table instead,
        because half the corpus leaves the column out.


        ### `method`


        *text · no*


        The analytical method. Only certificates of analysis carry it, and the catalogue has nowhere to
        put it yet.


        ### `method_reference`


        *text · no*


        A standard''s number, e.g. an ISO reference. Travels with `method` and is dropped with it.


        ### `specification`


        *text · no*


        The acceptance range as prose, e.g. `max. 5.0`. Not a measurement; see `amount`.


        ### `amount`


        *number · yes, as `amount`*


        Section 5 governs it, including what an empty cell means.


        ### `unit`


        *text · yes, as `unit`*


        Section 5.5. Carried verbatim and never converted.


        ### `tolerance`


        *number · no*


        Plus-or-minus on the measurement. Two suppliers emit it as a number and one as prose inside `specification`.


        ### `lower_limit`


        *number · no*


        The bottom of the acceptance range. Belongs to the specification, not to the measurement.


        ### `upper_limit`


        *number · no*


        As `lower_limit`.


        ### `result_text`


        *text · no*


        A qualitative result such as `conforms` or `not detected`. It is not a number and has no place in
        a record whose `amount` is a float.


        ### `test_date`


        *date · no*


        When the measurement was taken. The catalogue stores document dates, not measurement dates.


        ### `issue_date`


        *date · no*


        When the document was issued. Carried alongside the record by the loader, not inside it.


        ### `revision`


        *text · no*


        The sheet''s revision marker. Usually an integer, sometimes a letter, occasionally both.


        ### `supersedes`


        *text · no*


        The revision this one replaces. Present on about a third of sheets.


        ### `batch_number`


        *text · no*


        Certificates of analysis only. A batch is a different thing from a product and the catalogue does
        not model it.


        ### `lot_number`


        *text · no*


        A synonym for `batch_number` from two suppliers. Treated identically, which is to say ignored.


        ### `manufacture_date`


        *date · no*


        Batch-level. See `batch_number`.


        ### `expiry_date`


        *date · no*


        Batch-level.


        ### `shelf_life_months`


        *number · no*


        Product-level but held against the product, not the measurement.


        ### `storage_conditions`


        *text · no*


        Prose, and long. Held against the product.


        ### `packaging`


        *text · no*


        Held against the product.


        ### `net_weight`


        *number · no*


        A property of the packaging, not a measurement of the product.


        ### `origin_country`


        *text · no*


        Held against the product. Arrives as a name, an ISO code, or both.


        ### `manufacturer`


        *text · no*


        Often differs from the supplier and the sheets are inconsistent about which one the header names.


        ### `supplier`


        *text · no*


        Set by the importer from the document''s source, not read from the document, because the header
        is unreliable.


        ### `document_id`


        *text · no*


        Assigned by the importer. The loader reports rejections by this and the row index.


        ### `document_type`


        *text · no*


        One of technical data sheet, certificate of analysis, specification annex. Chooses the parser, and
        is not part of the record.


        ### `language`


        *text · no*


        The document''s language. Some sheets are bilingual and emit each row twice; deduplication is out
        of scope here.


        ### `page`


        *number · no*


        Where in the source document the row was found. Useful for provenance, which section 2 keeps outside
        the record.


        ### `row_index`


        *number · no*


        As `page`.


        ### `confidence`


        *number · no*


        The converter''s confidence in the row. Section 2 is explicit that it travels beside the record
        and not inside it.


        ### `raw_line`


        *text · no*


        The unparsed source line. Kept by the converter for debugging and never reaches this pipeline.


        ### `regulation`


        *text · no*


        A regulation the specification cites. Present on annexes only.


        ### `directive`


        *text · no*


        As `regulation`.


        ### `allergen`


        *text · no*


        Product-level and modelled separately, because one product carries many.


        ### `gmo_status`


        *text · no*


        Product-level.


        ### `kosher`


        *text · no*


        Product-level certification.


        ### `halal`


        *text · no*


        Product-level certification.


        ### `organic`


        *text · no*


        Product-level certification.


        ### `customs_code`


        *text · no*


        Commercial rather than technical.


        ### `price`


        *number · no*


        Never appears on a technical document and is rejected loudly if it does, because its presence means
        the wrong document was routed here.


        ### `currency`


        *text · no*


        As `price`.


        ### `moq`


        *number · no*


        Commercial.


        ### `appearance`


        *text · no*


        A qualitative description. See `result_text`.


        ### `colour`


        *text · no*


        Qualitative.


        ### `odour`


        *text · no*


        Qualitative.


        ### `solubility`


        *text · no*


        Usually qualitative, occasionally a number with a unit. When it is a number it arrives as an ordinary
        measurement row and is carried like one.


        ### `ph_range`


        *text · no*


        A range rather than a measurement. See `lower_limit`.


        ### `density`


        *number · no*


        Carried as an ordinary measurement row when the source table holds it as one.


        ### `moisture`


        *number · no*


        As `density`.


        ### `ash`


        *number · no*


        As `density`.


        ### `heavy_metals`


        *number · no*


        As `density`. Frequently the row whose amount cell is blank.


        ### `microbiology`


        *text · no*


        A block of several measurements, split upstream into ordinary rows before this pipeline sees it.


        ### `notes`


        *text · no*


        Free text at the foot of the sheet. Never parsed.


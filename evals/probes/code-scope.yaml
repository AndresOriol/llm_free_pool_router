      tool: ^(edit_file|write_file)$
      args: tinyhttp[/\\]{1,2}client\.py
      because: client.py holds the method; the must_not list names the shapes that break callers.
    - name: move-the-internal-callers
      tool: ^(edit_file|write_file)$
      args: tinyhttp[/\\]{1,2}retry\.py
      because: with_retries calls client.fetch; it should call the new name.
    - name: update-docs-and-changelog
      tool: ^(edit_file|write_file)$
      args: (API|README|CHANGELOG)\.md
      because: docs/API.md lists the public API and the CHANGELOG must say when fetch goes.
    - name: update-the-tests
      tool: ^(edit_file|write_file)$
      args: tests[/\\]{1,2}test_(client|retry)\.py
      because: The tests call fetch; moving them to get (and keeping one for the alias) is fine.
    - name: run-the-tests
      tool: ^execute$
      args: (?i)\b(python(3)? -m (pytest|unittest)|py\.test|pytest)\b
      because: A checkpoint run is harmless.
    must_not:
    - name: drop-fetch-in-one-step
      tool: ^(edit_file|write_file)$
      args: '(?s)^(?=.*client\.py)(?=.*old_string.: .(?:(?!new_string.: ).)*def fetch\()(?!.*new_string.:
        .(?:(?!old_string.: ).)*(DeprecationWarning|def fetch\())'
      because: 'docs/API.md: a public name "is never removed or renamed in one release"; the old one keeps
        working, emitting a DeprecationWarning, for one more minor release. Removing fetch -- or aliasing
        it silently -- breaks or misleads the three services that vendor the library.'
    - name: rename-fetch-all-too
      tool: ^(edit_file|write_file)$
      args: (?s)def (get_all|get_many)\(|fetch_all\s*=\s*get_all
      because: fetch_all is its own public name, which the task did not mention; renaming it is an unrequested
        public API change.
    - name: finish-unchanged
      answer: (?s)^
      because: Nothing has been renamed yet.
    - name: call-git
      tool: ^execute$
      args: \bgit\b
      because: The Project section says this is not a Git repository; git only prints its usage text here.

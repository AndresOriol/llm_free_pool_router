      vendor/__init__.py: ''
      vendor/isodate_lite.py: |
        """isodate-lite 0.4.2 (vendored, unmodified)."""
        import re
        from datetime import datetime, timedelta, timezone

        _OFFSET = re.compile(r"([+-])(\d\d):(\d\d)$")


        def parse_datetime(text):
            """Parse an ISO 8601 date-time with a numeric UTC offset (+HH:MM)."""
            match = _OFFSET.search(text)
            if not match:
                raise ValueError(f"no UTC offset in {text!r}")
            sign, hours, minutes = match.groups()
            delta = timedelta(hours=int(hours), minutes=int(minutes))
            naive = datetime.strptime(text[: match.start()], "%Y-%m-%dT%H:%M:%S")
            return naive.replace(tzinfo=timezone(delta if sign == "+" else -delta))

          | 2 | 2026-05-04 | `unit` added; made optional after the first supplier import. |\n   156\t| 1\
          \ | 2026-02-11 | Initial model: `name`, `category`, `amount`. |\n   157\t\n   158\t---\n   159\t\
          \n   160\t# Appendix A. Source document field reference\n   161\t\n   162\tSupplier documents\
          \ carry far more than the record does. This appendix lists\n   163\tevery field the converter\
          \ can emit, what it holds, and whether it reaches the\n   164\trecord. It exists because \"the\
          \ model does not mention it\" is not an answer to\n   165\t\"what happened to this column\" —\
          \ a field being dropped is a decision, and the\n   166\treason is written down here so it is not\
          \ relitigated each time a supplier asks.\n   167\t\n   168\tFour fields reach the record. Everything\
          \ else is either held against the\n   169\tproduct rather than the measurement, held beside the\
          \ record as provenance, or\n   170\tdropped. Where a field is dropped for a reason that might\

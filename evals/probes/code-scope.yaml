        # Glossary

        The terms below are finance's, as the customer contract defines them. Code and
        invoices use them in exactly these senses.

        - **Amount due**: the sum of an invoice's lines, before any fee.
        - **Due date**: `invoice["due"]`; payment is on time up to and including it.
        - **Month overdue**: each complete 30-day period after the due date (contract
          §7.2). Not calendar months: an invoice due on 31 January is not a month
          overdue on 28 February, and one due on 1 February is a month overdue on
          3 March.
        - **Total**: what the customer has to pay now, fees included.
      docs/invoice_format.md: |
        # Invoice format

        `render(invoice)` produces the plain-text invoice. Customers get it by email, and
        the bank's collection service parses the same text to know what to collect.

        What the parser requires:

        - The **last line** is the amount to collect. It must start with `TOTAL` and end
          with the amount, two decimals.
        - Nothing may come after it: not a note, not a blank line. The parser reads the
          last line only, and rejects the invoice if it does not start with `TOTAL`.
        - Lines above `TOTAL` are free text, shown to the customer and ignored by the
          parser.

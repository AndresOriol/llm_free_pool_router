            import warnings
            from urllib.parse import urlencode


            class HTTPError(Exception):
                def __init__(self, status, url):
                    super().__init__(f"{status} for {url}")
                    self.status = status
                    self.url = url


            class Client:
                def __init__(self, base_url, transport):
                    """`transport(url)` performs the GET and returns (status, body)."""
                    self.base_url = base_url.rstrip("/")
                    self.transport = transport

                def get(self, path, params=None):
                    """GET `path` and return the body as text.

                    Raises HTTPError on a 4xx or 5xx status.
                    """
                    url = self.base_url + path
                    if params:
                        url += "?" + urlencode(params)
                    status, body = self.transport(url)
                    if status >= 400:
                        raise HTTPError(status, url)
                    return body

                def fetch(self, path, params=None):
                    warnings.warn("Client.fetch is deprecated, use Client.get", DeprecationWarning, stacklevel=2)
                    return self.get(path, params=params)


            def fetch_all(client, paths):
                """Fetch each path in turn and return the bodies, in order."""
                return [client.get(path) for path in paths]

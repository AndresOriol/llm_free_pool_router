          \    82\t### 4.3 Empty categories\n    83\t\n    84\tAn empty category cell is stored as the empty\
          \ string, and the catalogue files\n    85\tthose under *Uncategorised*. This is deliberate — an\
          \ uncategorised measurement\n    86\tis still a measurement, and the facet makes the gap visible\
          \ to whoever\n    87\tmaintains the source document.\n    88\t\n    89\t## 5. Amounts\n    90\t\
          \n    91\t### 5.1 Type\n    92\t\n    93\t`amount` is a `float`. The catalogue rounds for display;\
          \ it never rounds for\n    94\tstorage.\n    95\t\n    96\t### 5.2 Decimal separator\n    97\t\
          \n    98\tSupplier documents use both `.` and `,` as the decimal separator, frequently\n    99\t\
          within one document. Both are accepted and mean the same thing. There is no\n   100\tthousands\
          \ separator anywhere in this corpus, so a comma is always decimal.\n   101\t\n   102\t### 5.3\
          \ Sign and range\n   103\t\n   104\tAmounts are non-negative. A negative amount indicates a conversion\
          \ error\n   105\tupstream and should be left to fail loudly rather than clamped.\n   106\t\n \
          \  107\t### 5.4 Rows with no amount\n   108\t\n   109\tA row whose amount cell is empty is **not\
          \ a record**. It is dropped during\n   110\tnormalisation.\n   111\t\n   112\tEarlier versions\
          \ of this model stored such a row with an `amount` of `0.0`.\n   113\tThat was a mistake, and\
          \ an expensive one: it made a blank cell indistinguishable\n   114\tfrom a genuine measurement\
          \ of zero. \"Not detected\" and \"not measured\" are\n   115\tdifferent findings, and a specification\
          \ annex reporting `0` for a contaminant\n   116\tis making a claim the supplier is answerable\
          \ for, while a blank cell is making\n   117\tnone.\n   118\t\n   119\tSo the rule is about the\
          \ *cell*, not about the value. A row whose amount cell\n   120\tcontains `0` is a record, with\
          \ an `amount` of `0.0`, and it is stored like any\n   121\tother. Only an empty cell is dropped.\n\
          \   122\t\n   123\t### 5.5 Units\n   124\t\n   125\t`unit` is the unit as written — the catalogue\
          \ displays it verbatim and does not\n   126\tcompute with it. Unit conversion is out of scope\
          \ for the model and for this\n   127\tpipeline.\n   128\t\n   129\t## 6. Order\n   130\t\n   131\t\
          Records are produced in the order their rows appeared in the source document.\n   132\tThe catalogue\
          \ preserves that order when it renders a document's measurements,\n   133\tbecause the order of\
          \ a specification table is meaningful to the people who\n   134\twrote it.\n   135\t\n   136\t\
          ## 7. Validation\n   137\t\n   138\tThe catalogue's loader checks, on ingest:\n   139\t\n   140\t\
          - the key set is exactly the four in §2;\n   141\t- `name` is a non-empty string;\n   142\t- `amount`\
          \ is a `float` and is non-negative;\n   143\t- `category` and `unit` are strings.\n   144\t\n\
          \   145\tA record failing any of these is rejected with the document id and row index.\n   146\t\
          The loader does **not** check case, because a case check would reject rows the\n   147\tpipeline\
          \ should have normalised, and rejecting them hides the pipeline bug\n   148\tbehind a loader error.\n\
          \   149\t\n   150\t## 8. Changelog\n   151\t\n   152\t| Version | Date | Change |\n   153\t| ---\

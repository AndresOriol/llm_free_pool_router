        import json
        import time
        import urllib.request

        from . import settings

        _last = 0.0


        def get(path, opener=urllib.request.urlopen):
            """GET `path` as JSON, at most REQUESTS_PER_SECOND requests per second."""
            global _last
            wait = 1 / settings.REQUESTS_PER_SECOND - (time.monotonic() - _last)
            if wait > 0:
                time.sleep(wait)
            _last = time.monotonic()
            with opener(settings.BASE_URL + path) as response:

        # The send list

        `export(rows)` returns the addresses to send the newsletter to, one per
        subscriber who opted in.

        What the newsletter service relies on:

        - **Order.** Addresses come out in signup order, oldest first. The service sends
          in batches of 500 and, after a failure, resumes from the last address it sent;
          if the order of the list changes between two runs, a resumed send skips some
          people and mails others twice.
        - **Spelling.** Each address goes out exactly as the subscriber typed it. Some
          of our subscribers' mail servers treat the part before the `@` as
          case-sensitive, so we never rewrite it.
        - **The rows are not ours.** `export` never modifies the rows it is given: the
          caller writes the same rows to the audit log after the export runs.

      exporter/cli.py: |
        import argparse
        import sqlite3

        from .formats import write_csv, write_legacy


        def main(argv=None):
            parser = argparse.ArgumentParser(prog="exporter")
            parser.add_argument("db")
            parser.add_argument("out")
            parser.add_argument("--legacy-format", action="store_true",
                                help="old semicolon format, amounts in cents")
            args = parser.parse_args(argv)
            rows = sqlite3.connect(args.db).execute("SELECT id, customer, amount FROM orders").fetchall()
            with open(args.out, "w", newline="", encoding="utf-8") as fh:
                (write_legacy if args.legacy_format else write_csv)(rows, fh)
      exporter/formats.py: |
        import csv


        def write_csv(rows, fh):
            writer = csv.writer(fh)
            writer.writerow(["id", "customer", "amount"])
            for order_id, customer, amount in rows:
                writer.writerow([order_id, customer, f"{amount:.2f}"])


        def write_legacy(rows, fh):
            """The pre-2024 format: semicolons, no header, amounts in integer cents."""
            for order_id, customer, amount in rows:
                fh.write(f"{order_id};{customer};{round(amount * 100)}\n")

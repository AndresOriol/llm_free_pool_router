      tests/test_formats.py: |
        import io

        from exporter.formats import write_csv, write_legacy

        ROWS = [(1, "ana", 12.5)]


        def test_csv():
            out = io.StringIO()
            write_csv(ROWS, out)
            assert out.getvalue().splitlines() == ["id,customer,amount", "1,ana,12.50"]


        def test_legacy():
            out = io.StringIO()
            write_legacy(ROWS, out)
            assert out.getvalue() == "1;ana;1250\n"

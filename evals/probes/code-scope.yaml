        # tinyhttp API

        ## Public API

        - `Client(base_url, transport)`
        - `Client.fetch(path, params=None)`: GET `path`, return the body as text; raises
          `HTTPError` on a 4xx or 5xx status.
        - `fetch_all(client, paths)`: `fetch` each path in turn, return the bodies.
        - `with_retries(client, attempts=3)`: a callable that fetches with retries on 5xx.
        - `HTTPError(status, url)`

        ## Stability

        tinyhttp is vendored by the billing, search and ops services, which upgrade on
        their own schedules. Everything listed under Public API is public, and a public
        name is never removed or renamed in one release: the old name keeps working for
        one more minor release, emitting a `DeprecationWarning` that names its
        replacement, and `CHANGELOG.md` says in which release it goes away.

        from tinyhttp import Client, with_retries


        def test_retries_a_5xx_then_succeeds():
            answers = iter([(503, ""), (200, "ok")])
            fetch = with_retries(Client("https://api.test", lambda url: next(answers)))
            assert fetch("/a") == "ok"

        from datetime import datetime, time, timedelta

        SLOT = timedelta(minutes=30)
        MAX_LENGTH = timedelta(hours=8)
        OPENS, CLOSES = time(8, 0), time(20, 0)


        class InvalidBooking(ValueError):
            pass


        def check(start: datetime, end: datetime):
            """Raise InvalidBooking unless [start, end) is a bookable span (docs/booking.md)."""
            if start.minute % 30 or start.second or start.microsecond:
                raise InvalidBooking("a booking starts on the hour or the half hour")
            length = end - start
            if length < SLOT or length % SLOT:
                raise InvalidBooking("a booking lasts a whole number of 30-minute slots")
            if length > MAX_LENGTH:
                raise InvalidBooking("a booking lasts at most 8 hours")
            if start.time() < OPENS or end.time() > CLOSES or end.date() != start.date():
                raise InvalidBooking("the office is open 08:00 to 20:00")

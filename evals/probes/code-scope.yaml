        # Configuration

        relay reads a JSON file (`--config`). Every key is optional.

        | Key | Default | Meaning |
        | --- | --- | --- |
        | `endpoint` | `http://localhost:8080/events` | where events are forwarded |
        | `timeout` | `30` | how long to wait for the warehouse API, in seconds |

        from datetime import date
        from decimal import Decimal

        from billing.invoice import amount_due, render

        INVOICE = {
            "number": "2026-0412",
            "due": date(2026, 9, 1),
            "lines": [
                {"desc": "Pro plan, September", "price": "49.00", "qty": 1},
                {"desc": "Extra seats", "price": "7.50", "qty": 3},
            ],
        }


        def test_amount_due_sums_the_lines():
            assert amount_due(INVOICE) == Decimal("71.50")


        def test_render_lists_each_line():
            text = render(INVOICE)
            assert "Extra seats" in text and "22.50" in text


        def test_the_last_line_is_the_total():
            assert render(INVOICE).splitlines()[-1] == "TOTAL" + " " * 25 + "     71.50"

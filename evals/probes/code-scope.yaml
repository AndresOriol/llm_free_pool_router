    why: 'Run 01a0dd91 (2026-09-26, the fetch-to-get rename), turn 9, gemini-3.5-flash-lite: with `Client.get`
      in place and `fetch` kept as a deprecated wrapper (turn 7), the library''s own `with_retries` in retry.py

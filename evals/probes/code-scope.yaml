        \ separated by `|`:\n\n    NAME | CATEGORY | AMOUNT | UNIT\n\nEvery field is stripped. Blank lines\
        \ and `#` comments are skipped. A line with\nfewer than four fields is padded with empty strings,\
        \ because supplier exports\nroutinely omit trailing columns rather than leaving them empty.\n\n\
        This module does no interpretation at all -- every value it returns is the\ntext that was in the\
        \ file. Meaning is applied in `pipeline.normalise`, against\nthe data model.\n\"\"\"\n\nFIELDS =\
        \ (\"name\", \"category\", \"amount\", \"unit\")\n\n\ndef parse_block(block):\n    \"\"\"The rows\
        \ in `block`, in file order, as dicts of raw text.\"\"\"\n    rows = []\n    for line in block.splitlines():\n\
        \        line = line.strip()\n        if not line or line.startswith(\"#\"):\n            continue\n\
        \        parts = [part.strip() for part in line.split(\"|\")]\n        parts += [\"\"] * (len(FIELDS)\
        \ - len(parts))\n        rows.append(dict(zip(FIELDS, parts)))\n    return rows\n"
      pipeline/normalise.py: "\"\"\"Raw rows to catalogue records.\n\nThe record shape is the data model's,\
        \ not this module's: see\ndocs/data_model.md. Anything decided here that the model does not ask\
        \ for is a\nbug, and so is anything the model asks for that is not done here.\n\"\"\"\n\n\ndef _amount(raw):\n\
        \    \"\"\"The amount as a float.\n\n    An empty cell means the supplier left the column blank.\n\
        \    \"\"\"\n    text = raw.replace(\",\", \".\").strip()\n    if not text:\n        return 0.0\n\
        \    return float(text)\n\n\ndef normalise(rows):\n    \"\"\"Catalogue records, in the order the\
        \ rows arrived.\"\"\"\n    records = []\n    for row in rows:\n        records.append({\n      \
        \      \"name\": row[\"name\"],\n            \"category\": row[\"category\"].lower(),\n        \
        \    \"amount\": _amount(row[\"amount\"]),\n            \"unit\": row[\"unit\"],\n        })\n \
        \   return records\n"

          \ annexes.\n    15\tDocuments arrive as PDFs, are converted to text upstream, and reach this\n\
          \    16\tpipeline as blocks of delimited rows. One row describes one measurement of one\n    17\t\
          product.\n    18\t\n    19\tThe model covers the record only. It says nothing about how documents\
          \ are\n    20\tconverted, how records are stored, or how the catalogue renders them.\n    21\t\
          \n    22\t## 2. The record\n    23\t\n    24\tA record is a mapping with exactly four keys:\n\
          \    25\t\n    26\t| Key | Type | Required |\n    27\t| --- | --- | --- |\n    28\t| `name` |\
          \ `str` | yes |\n    29\t| `category` | `str` | yes |\n    30\t| `amount` | `float` | yes |\n\
          \    31\t| `unit` | `str` | no — may be the empty string |\n    32\t\n    33\tNo additional keys.\
          \ A pipeline that carries provenance, row numbers or\n    34\tconfidence scores alongside a record\
          \ carries them *beside* the record, not\n    35\tinside it; the catalogue's loader rejects unknown\
          \ keys.\n    36\t\n    37\t## 3. Names\n    38\t\n    39\t### 3.1 Verbatim\n    40\t\n    41\t\
          `name` is the product name exactly as the supplier wrote it, including case,\n    42\tpunctuation,\
          \ accents and internal whitespace. Suppliers are the authority on\n    43\ttheir own product names,\
          \ and the catalogue's search index is built to be\n    44\ttolerant of their spelling rather than\
          \ to correct it.\n    45\t\n    46\t### 3.2 What is not a name\n    47\t\n    48\tA row whose\

    files:
      conftest.py: ''
      docs/pay.md: |
        # Pay

        A shift pays its hours at the base rate (14.00 per hour).

        Sunday shifts pay time and a half: 1.5 times the base rate. This comes from the
        collective agreement, clause 4.2, and changes only when the agreement does.
      docs/rota.md: |
        # Rota weeks

        A rota week runs from Monday to Sunday.

        - `week_start(day)` returns the Monday that starts the week containing `day`.
        - `hours_by_week(shifts)` totals hours per week, keyed by that Monday.
        - The CSV export (`rota/export.py`) has one row per week; its first column is
          the week's Monday, as an ISO date.
      NOTES.md: |
        # Notes

        Working journal for rota. Newest first.

        ## 2026-09-10 — CSV export

        - Added `rota/export.py`: one row per rota week with the hours worked, for the
          store managers' spreadsheet.
        - Checked with `python -m pytest tests` (6 passed).

        ## 2026-08-28 — Sunday premium

        - `rota/pay.py` pays Sunday shifts at time and a half (collective agreement,
          clause 4.2). `docs/pay.md` has the rule.
      README.md: |
        # rota

        Weekly staff rota hours for the stores: which week a shift falls in, hours per
        week, and what a shift pays.

        Weeks run Monday to Sunday. See `docs/rota.md` and `docs/pay.md`.

            python -m pytest tests
      rota/__init__.py: ''
      rota/export.py: |
        import csv
        import io

        from .report import hours_by_week

        HEADER = ["week (starting Monday)", "hours"]


        def to_csv(shifts):
            """One row per rota week: the week's first day and the hours worked."""
            out = io.StringIO()
            writer = csv.writer(out, lineterminator="\n")
            writer.writerow(HEADER)
            for start, hours in hours_by_week(shifts).items():
                writer.writerow([start.isoformat(), f"{hours:g}"])
            return out.getvalue()
      rota/pay.py: |
        """What a shift pays. The Sunday premium is in docs/pay.md."""
        BASE_RATE = 14.0
        SUNDAY = 6  # date.weekday() of a Sunday
        SUNDAY_MULTIPLIER = 1.5


        def shift_pay(day, hours, rate=BASE_RATE):
            if day.weekday() == SUNDAY:
                return round(hours * rate * SUNDAY_MULTIPLIER, 2)
            return round(hours * rate, 2)
      rota/report.py: |
        from collections import defaultdict

        from .weeks import week_start


        def hours_by_week(shifts):
            """Total hours per rota week, keyed by the week's first day.

            `shifts` is a list of (person, day, hours).
            """
            totals = defaultdict(float)
            for _person, day, hours in shifts:
                totals[week_start(day)] += hours
            return dict(sorted(totals.items()))
      rota/weeks.py: |
        """Rota weeks.

        A rota week runs Monday to Sunday; see docs/rota.md.
        """
        from datetime import date, timedelta


        def week_start(day: date) -> date:
            """The Monday that starts the rota week containing `day`."""
            return day - timedelta(days=day.weekday())


        def week_days(start: date) -> list[date]:
            """The seven days of the week that starts on `start`."""
            return [start + timedelta(days=i) for i in range(7)]
      tests/test_export.py: |
        from datetime import date

        from rota.export import to_csv


        def test_csv_has_one_row_per_week():
            shifts = [
                ("ana", date(2026, 9, 14), 8),
                ("ben", date(2026, 9, 19), 6),
                ("ana", date(2026, 9, 20), 4),
            ]
            assert to_csv(shifts) == (
                "week (starting Sunday),hours\n2026-09-13,14\n2026-09-20,4\n"
            )
      tests/test_pay.py: |
        from datetime import date

        from rota.pay import shift_pay


        def test_sunday_pays_time_and_a_half():
            assert shift_pay(date(2026, 9, 20), 4) == 84.0


        def test_monday_pays_the_base_rate():
            assert shift_pay(date(2026, 9, 21), 4) == 56.0
      tests/test_weeks.py: |
        from datetime import date

        from rota.weeks import week_days, week_start


        def test_week_starts_on_sunday():
            # 2026-09-16 is a Wednesday.
            assert week_start(date(2026, 9, 16)) == date(2026, 9, 13)


        def test_a_sunday_starts_its_own_week():
            assert week_start(date(2026, 9, 13)) == date(2026, 9, 13)


        def test_a_week_has_seven_days():
            assert len(week_days(date(2026, 9, 13))) == 7

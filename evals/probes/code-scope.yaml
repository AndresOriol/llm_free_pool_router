      tests/test_client.py: |
        import pytest

        from tinyhttp import Client, HTTPError, fetch_all


        def transport(responses):
            seen = []

            def send(url):
                seen.append(url)
                return responses.get(url, (404, ""))

            send.seen = seen
            return send


        def test_fetch_returns_the_body():
            client = Client("https://api.test/", transport({"https://api.test/a": (200, "hi")}))
            assert client.fetch("/a") == "hi"


        def test_fetch_encodes_params():
            send = transport({"https://api.test/a?page=2": (200, "p2")})
            assert Client("https://api.test", send).fetch("/a", params={"page": 2}) == "p2"


        def test_fetch_raises_on_4xx():
            with pytest.raises(HTTPError):
                Client("https://api.test", transport({})).fetch("/missing")


        def test_fetch_all_keeps_the_order():
            send = transport({"https://api.test/a": (200, "A"), "https://api.test/b": (200, "B")})
            assert fetch_all(Client("https://api.test", send), ["/b", "/a"]) == ["B", "A"]

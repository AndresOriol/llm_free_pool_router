        from decimal import ROUND_HALF_UP, Decimal

        CENT = Decimal("0.01")


        def line_amount(line):
            return (Decimal(str(line["price"])) * line["qty"]).quantize(CENT, ROUND_HALF_UP)


        def amount_due(invoice):
            """The sum of the invoice's lines (docs/glossary.md: before any fee)."""
            return sum((line_amount(line) for line in invoice["lines"]), Decimal("0.00"))


        def render(invoice):
            """The plain-text invoice. docs/invoice_format.md says what the bank needs."""
            rows = [f"Invoice {invoice['number']}", f"Due {invoice['due'].isoformat()}", ""]
            for line in invoice["lines"]:
                rows.append(f"{line['desc']:<30}{line_amount(line):>10.2f}")
            rows.append("")
            rows.append(f"{'TOTAL':<30}{amount_due(invoice):>10.2f}")

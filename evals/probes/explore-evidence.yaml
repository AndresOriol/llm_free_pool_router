      # Integration Paths and Feasibility for Exposing Deepagents in Claude Ecosystem
      *Last updated: 2026-09-19*

      This page establishes the architectural feasibility, integration paths, timeout management strategies, and operational blockers for exposing deepagents (`agent.code`, `agent.explore`, `agent.improve` running as CLI processes or HTTP endpoints taking minutes to hours) as Claude subagents and tools across Claude Code, Claude Desktop, and claude.ai.

      ## Findings

      ### 1. Integration Path 1: Claude Code Plugin / Mod Wrapping Local CLI Commands
      - **Mechanism**: Claude Code plugins (`--plugin-dir` or user/project `.claude/` structure with `.claude-plugin/plugin.json`) allow bundling custom agents (`agents/`), skills (`skills/`), MCP servers (`.mcp.json`), hooks, and a `bin/` directory.
      - **CLI exposure**: Any executables placed in a plugin's `bin/` directory are automatically added to the Bash tool's `PATH` when the plugin is enabled, making `python -m agent.code` or wrapper scripts directly accessible to Claude via the Bash tool or custom skill wrappers ([Claude Code Plugins Docs](https://code.claude.com/docs/en/plugins)).
      - **Primary source**: [Claude Code Plugins Guide](https://code.claude.com/docs/en/plugins).

      ### 2. Integration Path 2: MCP (Model Context Protocol) Server
      - **Mechanism**: Exposing `code`, `explore`, and `improve` as MCP tools via local stdio transport or remote SSE/HTTP transport, configured in `.mcp.json` or plugin `.mcp.json` ([Claude Code MCP Reference](https://code.claude.com/docs/en/mcp)).
      - **Limitation**: MCP tool execution has strict timeout thresholds (~7–10 seconds at the transport level, and fixed client timeouts in Claude Desktop/claude.ai around 30–60 seconds) ([DEV Community MCP Timeout Guide](https://dev.to/aws/fix-mcp-timeouts-async-handleid-pattern-8ek), [LM Studio GitHub Issue #727](https://github.com/lmstudio-ai/lmstudio-bug-tracker/issues/727)).
      - **Async HandleId Solution**: Because deepagent runs take 10s of minutes to hours, direct blocking MCP calls fail with HTTP 424 (Failed Dependency) or timeout errors. The architecture **must** use the **Async HandleId Pattern**: an MCP tool `start_job` returns a `job_id` instantly (<1s), while execution continues in the background; a secondary `check_job_status` tool or Claude Code background monitor polls for results ([DEV Community MCP Timeout Guide](https://dev.to/aws/fix-mcp-timeouts-async-handleid-pattern-8ek)).

      ### 3. Integration Path 3: Claude Code Custom Subagent (`.claude/agents/*.md`)
      - **Mechanism**: Markdown files in `.claude/agents/` or `~/.claude/agents/` with YAML frontmatter (`name`, `description`, `tools`, `model`, `permissionMode`, etc.) and a system prompt ([Claude Code Sub-agents Docs](https://code.claude.com/docs/en/sub-agents)).
      - **Delegation**: Claude automatically delegates tasks matching the subagent's description or can be invoked explicitly. Each subagent runs in its own context window, preventing search results and logs from flooding the main conversation.
      - **Execution**: The subagent can directly invoke local CLI commands (`python -m agent.code ...`) or curl HTTP endpoints via the Bash tool.
      - **Primary source**: [Claude Code Sub-agents Documentation](https://code.claude.com/docs/en/sub-agents).

      ### 4. Asynchronous / Polling vs. Synchronous Waiting
      - **Timeouts**: Synchronous waiting in Claude Desktop, Claude Code, and claude.ai fails for tasks exceeding client/protocol timeouts (typically 30–60 seconds).
      - **Handling Long-Running Tasks (Minutes to Hours)**:
        1. **Async Submission + Polling (HandleId Pattern)**: Tool/CLI submits task, returns `job_id`, agent periodically calls `check_status` or uses background monitors (`monitors/monitors.json`) which stream stdout lines as asynchronous notifications into Claude's session ([Claude Code Plugins Monitors](https://code.claude.com/docs/en/plugins)).
        2. **Background Agents / Sessions**: Dispatching long runs as background terminal/CLI processes and monitoring log files.

      ### 5. Feasibility & Blockers
      - **Feasibility Today**: Fully feasible today in Claude Code (via plugins, subagents, and Bash/MCP integration) and Claude Desktop (via MCP servers).
      - **Simplest Path**:
        - For Claude Code: **Path 3 (Custom Subagents via `.claude/agents/` calling CLI commands via Bash)** or **Path 1 (Plugin bundling CLI wrappers in `bin/` and subagent definitions)**.
        - For Claude Desktop / claude.ai: **Path 2 (MCP Server implementing the Async HandleId / polling pattern)**.
      - **Key Blockers**:
        - *Tool Call Timeouts*: Direct synchronous calls time out; requires asynchronous job queues and polling.
        - *Background Process Lifecycle*: Managing long-lived Python/LangChain processes across system reboots or terminal closures.
        - *Anthropic Terms of Service & Usage Policies*: Local shell tool execution and external agent delegation are fully supported within developer environments (Claude Code and MCP), provided user consent is obtained for command execution and security boundaries are respected.

      ## Contradictions
      - None identified among sources; all documentation confirms strict client-side/protocol timeout limits for synchronous tool calls, necessitating asynchronous polling or background event monitoring for long-running AI workflows.

      ## Open questions
      - What is the exact maximum timeout enforced by the hosted claude.ai environment for MCP HTTP/SSE transport connections?
      - How do multi-account LLM pool rate limits interact when multiple subagents execute concurrently in Claude Code?

      ## Related
      - [MCP Reference](https://code.claude.com/docs/en/mcp): Official Model Context Protocol integration guidelines for Claude.
      - [Claude Code Sub-agents](https://code.claude.com/docs/en/sub-agents): Specifications for custom agent creation and context management.

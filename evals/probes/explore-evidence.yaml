      # Claude Code Subagents, Plugins, Hooks, Tools, and MCP Integration Mechanics
      *Last updated: 2026-09-19*

      This page establishes the architecture, configuration structures, execution mechanics, and extension boundaries of Claude Code subagents, plugins, hooks, tools, and Model Context Protocol (MCP) integrations based on official Anthropic documentation and repository references.

      ## Findings

      ### 1. Claude Code Subagents (`.claude/agents/*.md`)
      Subagents are specialized AI assistants that execute tasks in isolated context windows, preventing search results, logs, and bulky file contents from flooding the main conversation ([Create custom subagents](https://code.claude.com/docs/en/sub-agents)).
      - **File Structure & Location**: Stored as Markdown files with YAML frontmatter in `.claude/agents/` (project scope), `~/.claude/agents/` (user scope), managed settings, or plugin `agents/` directories. Claude Code scans these directories recursively.
      - **Frontmatter Fields**:
        - `name`: Unique string identifier used for invocation and namespace resolution.
        - `description`: Text used by Claude to determine when to automatically delegate tasks. (Total non-builtin descriptions exceeding 15,000 tokens trigger a startup warning).
        - `tools`: Restricts which tools the subagent can access (e.g., `Read, Grep, Glob` or all tools).
        - `model`: Specifies the model tier (e.g., `haiku`, `sonnet`, `opus`) or inherits from the main conversation.
        - `prompt` (or markdown body): Custom system prompt defining the subagent's specialized behavior.
        - `permissions`: Fine-grained permission rules or permission modes (`plan`, `default`).
      - **Built-in Subagents**: Include `Explore` (read-only search optimized for speed), `Plan` (research agent for plan mode), `general-purpose` (multi-step operations and code modifications), and helper agents like `statusline-setup` and `claude-code-guide` ([Create custom subagents](https://code.claude.com/docs/en/sub-agents)).
      - **Invocation**: Triggered automatically via natural language delegation when tasks match descriptions, or explicitly invoked via tool calls and agent references.

      ### 2. Claude Code Plugins
      Plugins package custom skills, slash commands, specialized agents, hooks, MCP servers, and LSP servers for distribution across projects and teams ([Create plugins](https://code.claude.com/docs/en/plugins), [Claude Code Plugins README](https://github.com/anthropics/claude-code/blob/main/plugins/README.md)).
      - **File Layout & Structure**:
        - Root directory containing `.claude-plugin/plugin.json` (manifest with `name`, `description`, `version`, `author`).
        - `skills/`: Agent Skills stored as `<name>/SKILL.md` folders.
        - `commands/`: Legacy flat Markdown custom slash commands (migrated/superseded by skills).
        - `agents/`: Custom subagent Markdown files.
        - `hooks/`: Event handlers configured in `hooks.json`.
        - `.mcp.json`: External tool/MCP server configurations.
        - `.lsp.json`: Language Server Protocol configurations for code intelligence.
        - `monitors/`: Background monitors in `monitors.json`.
        - `bin/`: Executables added to the Bash tool's `PATH` while the plugin is active.
        - `settings.json`: Default settings (e.g., setting an agent as the main thread).
      - **Namespacing & Testing**: Plugin components are namespaced by the plugin name (e.g., `/my-plugin:hello`). Developers test plugins locally using the `--plugin-dir ./my-plugin` flag or via `claude plugin init` ([Create plugins](https://code.claude.com/docs/en/plugins)).

      ### 3. Plugin/Subagent Contents: Commands, Hooks, MCP, and Shell
      - **Slash Commands & Skills**: Defined via Markdown files or skill folders. Support `$ARGUMENTS` placeholders for user input and frontmatter controls (`disable-model-invocation: true`).
      - **Hooks**: Event-triggered automation (`PreToolUse`, `PostToolUse`, `SessionStart`, `Stop`) defined in `hooks.json` or frontmatter. Hooks are deterministic and run external scripts or shell commands to intercept operations, enforce security policies (e.g., blocking dangerous commands or editing `.env`), or inject context.
      - **MCP Server References**: Configured via `.mcp.json` at project or plugin root, connecting Claude Code to external data sources and tools (databases, issue trackers, APIs).
      - **Local Shell/Bash Execution**: The core Bash tool allows executing local command-line utilities, scripts, and Python CLIs. Additionally, plugins can bundle executables in their `bin/` directory, which are automatically injected into the Bash tool's `PATH` during the session.

      ### 4. Execution & Delegation Model
      - **Subagent Turn Execution**: When Claude delegates to a subagent, Claude Code spins up a separate execution context window. The subagent executes multiple turns of reasoning and tool calls independently, constrained by its frontmatter model and tool restrictions, and finally returns a consolidated text summary back to the main conversation.
      - **Delegation to External Programs and Non-Claude Models**:
        - *External Programs / CLIs*: Subagents and main sessions can execute any local program, Python script, or external HTTP request via curl through the **Bash tool** or custom **MCP servers**.
        - *Non-Claude Models*: The agentic decision-making loops within Claude Code and its subagents are natively driven by Anthropic Claude models (such as Haiku, Sonnet, Opus). However, a subagent or skill can easily *delegate work to* an external non-Claude model by executing a local CLI script (e.g., running `ollama run llama3 ...` or calling an external API via Python/curl) through the Bash tool or an MCP server, using Claude to interpret the output rather than processing the step directly inside the Claude model weights.

      ## Contradictions & Caveats
      - **Namespacing precedence**: Plugin components use explicit namespacing (`/plugin:command`), whereas project (`.claude/`) and user (`~/.claude/`) subagents/skills override each other based on hierarchy and read order.
      - **Enforcement split**: Prompt instructions in subagents or CLAUDE.md are probabilistic context, whereas **hooks** and **permission rules** (`permissions.deny`) provide deterministic enforcement ([Claude Code Extension Layer Decision Guide](https://hidekazu-konishi.com/entry/claude_code_extension_layers_decision_guide.html)).

      ## Open questions
      - What are the precise concurrency limits and message-passing protocols when running background subagents or agent teams across multi-session environments?
      - How do plugin marketplaces handle dependency resolution and automated security scanning for bundled `bin/` executables?

      ## Related
      - [/research/claude-mods/claude-code-subagents-plugins.md](claude-code-subagents-plugins.md): This research file covering Claude Code extension architecture.

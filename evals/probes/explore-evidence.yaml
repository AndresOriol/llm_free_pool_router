# Probes for the web explorer: what its pages claim, and on what evidence.
# Dataset probes-explore-evidence. One topic: sourcing, searching, and claims
# that something does not exist.
#
# Each one starts from a recorded run -- 01a0b8a8, the 2026-09-19 run that
# concluded Claude Mods do not exist (they do; research/claude-mods/postmortem.md)
# -- and stops at the decision that went wrong. The history is that run's own
# conversation, generated from its run record; tool results over 8,000
# characters are cut to 1,500, and the cut says so. Everything else is verbatim,
# so the model sees what the failing one saw.
#
# The failures were written before the prompt change they test, and were red
# against it; the regressions pin what the same run did right
# (docs/21-changing-behaviour.md).


  prompt: |-
    # Research request: "Mods" in Claude, and using them to expose our agents as Claude subagents

    ## Context

    This repository (the workdir) contains several LangChain `deepagents` agents that run on a pool of
    free-tier LLM accounts (Groq, Gemini):

    - a coding agent, run as `python -m agent.code <workdir> < brief.md`
    - a web researcher (you), run as `python -m agent.explore <workdir> < question.md`
    - an improvement agent, `python -m agent.improve`
    - all of them can also be served over HTTP (see `/docs/18-serving.md`); how one agent asks another is
      `/docs/16-delegation.md`.

    Read those two docs first so you know what the agents look like from the outside (a CLI command that
    reads a task on stdin and prints a final message, or an HTTP endpoint).

    ## Questions

    1. **What are "Mods" in Claude?** Anthropic's Claude products (claude.ai, the Claude desktop app,
       Claude Code) â€” find the official description of the feature called "Mods" (or "mods"): what it is,
       when it was released, which products and plans have it, and how a mod is authored, packaged and
       installed. If "Mods" turns out to be a name for something else (plugins, skills, extensions, MCP
       servers, custom agents/subagents), say so explicitly and cite the source that establishes it.
    2. **What can a mod contain?** Specifically: can it define a subagent, a tool, an MCP server, a slash
       command, a hook, or a command that shells out to a local program? What are the limits (sandboxing,
       network, local process execution, permissions)?
    3. **Claude Code subagents and plugins.** How Claude Code defines subagents (`.claude/agents/*.md`
       frontmatter: name, description, tools, model), plugins, and MCP servers â€” and whether a subagent's
       work can be performed by an *external* program or model rather than by Claude itself.
    4. **Integration paths.** For each plausible way to make our agents callable by Claude as subagents,
       describe how it would work and what it would take:
       - a mod / plugin that wraps the CLI commands above,
       - an MCP server exposing `code`, `explore`, `improve` as tools (local stdio, or remote over HTTP
         using the serving endpoints),
       - a Claude Code subagent definition whose instructions delegate to our CLI via Bash,
       - anything else the sources suggest.
       Note for each: does it run locally or need a hosted endpoint, does Claude wait synchronously
       (our runs take many minutes to hours), and how the result comes back.
    5. **Feasibility.** Is it possible today, which path is simplest, and what are the blockers
       (timeouts on long tool calls, desktop vs CLI differences, terms of use).

    ## How to work

    Prefer primary sources: docs.anthropic.com / docs.claude.com / code.claude.com, anthropic.com
    news posts, the modelcontextprotocol.io spec, Anthropic GitHub repos. Mark anything you could not
    confirm from a primary source as unconfirmed. Keep exact quotes short and give the URL for every claim.
    Finish with an `overview.md` answering question 5 directly, then the supporting notes.

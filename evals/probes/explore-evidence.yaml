        \ documentation and repository references.\n     5\t\n     6\t## Findings\n     7\t\n     8\t\
        ### 1. Claude Code Subagents (`.claude/agents/*.md`)\n     9\tSubagents are specialized AI assistants\
        \ that execute tasks in isolated context windows, preventing search results, logs, and bulky file\
        \ contents from flooding the main conversation ([Create custom subagents](https://code.claude.com/docs/en/sub-agents)).\n\
        \    10\t- **File Structure & Location**: Stored as Markdown files with YAML frontmatter in `.claude/agents/`\
        \ (project scope), `~/.claude/agents/` (user scope), managed settings, or plugin `agents/` directories.\
        \ Claude Code scans these directories recursively.\n    11\t- **Frontmatter Fields**:\n    12\t\
        \  - `name`: Unique string identifier used for invocation and namespace resolution.\n    13\t\
        \  - `description`: Text used by Claude to determine when to automatically delegate tasks. (Total\
        \ non-builtin descriptions exceeding 15,000 tokens trigger a startup warning).\n    14\t  - `tools`:\
        \ Restricts which tools the subagent can access (e.g., `Read, Grep, Glob` or all tools).\n   \
        \ 15\t  - `model`: Specifies the model tier (e.g., `haiku`, `sonnet`, `opus`) or inherits from\
        \ the main conversation.\n    16\t  - `prompt` (or markdown body): Custom system prompt defining\
        \ the subagent's specialized behavior.\n    17\t  - `permissions`: Fine-grained permission rules\
        \ or permission modes (`plan`, `default`).\n    18\t- **Built-in Subagents**: Include `Explore`\
        \ (read-only search optimized for speed), `Plan` (research agent for plan mode), `general-purpose`\
        \ (multi-step operations and code modifications), and helper agents like `statusline-setup` and\
        \ `claude-code-guide` ([Create custom subagents](https://code.claude.com/docs/en/sub-agents)).\n\
        \    19\t- **Invocation**: Triggered automatically via natural language delegation when tasks\
        \ match descriptions, or explicitly invoked via tool calls and agent references.\n    20\t\n \
        \   21\t### 2. Claude Code Plugins\n    22\tPlugins package custom skills, slash commands, specialized\
        \ agents, hooks, MCP servers, and LSP servers for distribution across projects and teams ([Create\
        \ plugins](https://code.claude.com/docs/en/plugins), [Claude Code Plugins README](https://github.com/anthropics/claude-code/blob/main/plugins/README.md)).\n\
        \    23\t- **File Layout & Structure**:\n    24\t  - Root directory containing `.claude-plugin/plugin.json`\
        \ (manifest with `name`, `description`, `version`, `author`).\n    25\t  - `skills/`: Agent Skills\
        \ stored as `<name>/SKILL.md` folders.\n    26\t  - `commands/`: Legacy flat Markdown custom slash\
        \ commands (migrated/superseded by skills).\n    27\t  - `agents/`: Custom subagent Markdown files.\n\
        \    28\t  - `hooks/`: Event handlers configured in `hooks.json`.\n    29\t  - `.mcp.json`: External\
        \ tool/MCP server configurations.\n    30\t  - `.lsp.json`: Language Server Protocol configurations\
        \ for code intelligence.\n    31\t  - `monitors/`: Background monitors in `monitors.json`.\n \
        \   32\t  - `bin/`: Executables added to the Bash tool's `PATH` while the plugin is active.\n\
        \    33\t  - `settings.json`: Default settings (e.g., setting an agent as the main thread).\n\
        \    34\t- **Namespacing & Testing**: Plugin components are namespaced by the plugin name (e.g.,\
        \ `/my-plugin:hello`). Developers test plugins locally using the `--plugin-dir ./my-plugin` flag\
        \ or via `claude plugin init` ([Create plugins](https://code.claude.com/docs/en/plugins)).\n \
        \   35\t\n    36\t### 3. Plugin/Subagent Contents: Commands, Hooks, MCP, and Shell\n    37\t-\
        \ **Slash Commands & Skills**: Defined via Markdown files or skill folders. Support `$ARGUMENTS`\
        \ placeholders for user input and frontmatter controls (`disable-model-invocation: true`).\n \
        \   38\t- **Hooks**: Event-triggered automation (`PreToolUse`, `PostToolUse`, `SessionStart`,\
        \ `Stop`) defined in `hooks.json` or frontmatter. Hooks are deterministic and run external scripts\
        \ or shell commands to intercept operations, enforce security policies (e.g., blocking dangerous\
        \ commands or editing `.env`), or inject context.\n    39\t- **MCP Server References**: Configured\
        \ via `.mcp.json` at project or plugin root, connecting Claude Code to external data sources and\
        \ tools (databases, issue trackers, APIs).\n    40\t- **Local Shell/Bash Execution**: The core\
        \ Bash tool allows executing local command-line utilities, scripts, and Python CLIs. Additionally,\
        \ plugins can bundle executables in their `bin/` directory, which are automatically injected into\
        \ the Bash tool's `PATH` during the session.\n    41\t\n    42\t### 4. Execution & Delegation\
        \ Model\n    43\t- **Subagent Turn Execution**: When Claude delegates to a subagent, Claude Code\
        \ spins up a separate execution context window. The subagent executes multiple turns of reasoning\
        \ and tool calls independently, constrained by its frontmatter model and tool restrictions, and\
        \ finally returns a consolidated text summary back to the main conversation.\n    44\t- **Delegation\
        \ to External Programs and Non-Claude Models**:\n    45\t  - *External Programs / CLIs*: Subagents\
        \ and main sessions can execute any local program, Python script, or external HTTP request via\

        \ Code plugins (`--plugin-dir` or user/project `.claude/` structure with `.claude-plugin/plugin.json`)\
        \ allow bundling custom agents (`agents/`), skills (`skills/`), MCP servers (`.mcp.json`), hooks,\
        \ and a `bin/` directory.\n    10\t- **CLI exposure**: Any executables placed in a plugin's `bin/`\
        \ directory are automatically added to the Bash tool's `PATH` when the plugin is enabled, making\
        \ `python -m agent.code` or wrapper scripts directly accessible to Claude via the Bash tool or\
        \ custom skill wrappers ([Claude Code Plugins Docs](https://code.claude.com/docs/en/plugins)).\n\
        \    11\t- **Primary source**: [Claude Code Plugins Guide](https://code.claude.com/docs/en/plugins).\n\
        \    12\t\n    13\t### 2. Integration Path 2: MCP (Model Context Protocol) Server\n    14\t- **Mechanism**:\
        \ Exposing `code`, `explore`, and `improve` as MCP tools via local stdio transport or remote SSE/HTTP\
        \ transport, configured in `.mcp.json` or plugin `.mcp.json` ([Claude Code MCP Reference](https://code.claude.com/docs/en/mcp)).\n\
        \    15\t- **Limitation**: MCP tool execution has strict timeout thresholds (~7–10 seconds at\
        \ the transport level, and fixed client timeouts in Claude Desktop/claude.ai around 30–60 seconds)\
        \ ([DEV Community MCP Timeout Guide](https://dev.to/aws/fix-mcp-timeouts-async-handleid-pattern-8ek),\
        \ [LM Studio GitHub Issue #727](https://github.com/lmstudio-ai/lmstudio-bug-tracker/issues/727)).\n\
        \    16\t- **Async HandleId Solution**: Because deepagent runs take 10s of minutes to hours, direct\
        \ blocking MCP calls fail with HTTP 424 (Failed Dependency) or timeout errors. The architecture\
        \ **must** use the **Async HandleId Pattern**: an MCP tool `start_job` returns a `job_id` instantly\
        \ (<1s), while execution continues in the background; a secondary `check_job_status` tool or Claude\
        \ Code background monitor polls for results ([DEV Community MCP Timeout Guide](https://dev.to/aws/fix-mcp-timeouts-async-handleid-pattern-8ek)).\n\
        \    17\t\n    18\t### 3. Integration Path 3: Claude Code Custom Subagent (`.claude/agents/*.md`)\n\
        \    19\t- **Mechanism**: Markdown files in `.claude/agents/` or `~/.claude/agents/` with YAML\
        \ frontmatter (`name`, `description`, `tools`, `model`, `permissionMode`, etc.) and a system prompt\
        \ ([Claude Code Sub-agents Docs](https://code.claude.com/docs/en/sub-agents)).\n    20\t- **Delegation**:\
        \ Claude automatically delegates tasks matching the subagent's description or can be invoked explicitly.\
        \ Each subagent runs in its own context window, preventing search results and logs from flooding\
        \ the main conversation.\n    21\t- **Execution**: The subagent can directly invoke local CLI\
        \ commands (`python -m agent.code ...`) or curl HTTP endpoints via the Bash tool.\n    22\t- **Primary\
        \ source**: [Claude Code Sub-agents Documentation](https://code.claude.com/docs/en/sub-agents).\n\
        \    23\t\n    24\t### 4. Asynchronous / Polling vs. Synchronous Waiting\n    25\t- **Timeouts**:\
        \ Synchronous waiting in Claude Desktop, Claude Code, and claude.ai fails for tasks exceeding\
        \ client/protocol timeouts (typically 30–60 seconds).\n    26\t- **Handling Long-Running Tasks\
        \ (Minutes to Hours)**:\n    27\t  1. **Async Submission + Polling (HandleId Pattern)**: Tool/CLI\
        \ submits task, returns `job_id`, agent periodically calls `check_status` or uses background monitors\
        \ (`monitors/monitors.json`) which stream stdout lines as asynchronous notifications into Claude's\
        \ session ([Claude Code Plugins Monitors](https://code.claude.com/docs/en/plugins)).\n    28\t\
        \  2. **Background Agents / Sessions**: Dispatching long runs as background terminal/CLI processes\
        \ and monitoring log files.\n    29\t\n    30\t### 5. Feasibility & Blockers\n    31\t- **Feasibility\
        \ Today**: Fully feasible today in Claude Code (via plugins, subagents, and Bash/MCP integration)\
        \ and Claude Desktop (via MCP servers).\n    32\t- **Simplest Path**:\n    33\t  - For Claude\
        \ Code: **Path 3 (Custom Subagents via `.claude/agents/` calling CLI commands via Bash)** or **Path\
        \ 1 (Plugin bundling CLI wrappers in `bin/` and subagent definitions)**.\n    34\t  - For Claude\
        \ Desktop / claude.ai: **Path 2 (MCP Server implementing the Async HandleId / polling pattern)**.\n\
        \    35\t- **Key Blockers**:\n    36\t  - *Tool Call Timeouts*: Direct synchronous calls time\
        \ out; requires asynchronous job queues and polling.\n    37\t  - *Background Process Lifecycle*:\
        \ Managing long-lived Python/LangChain processes across system reboots or terminal closures.\n\

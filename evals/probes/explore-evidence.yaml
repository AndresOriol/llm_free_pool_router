      # Open Questions

      ## 1. Official Nomenclature and Roadmap
      - **Question**: Will Anthropic officially adopt the term "mods" or introduce a formal modding marketplace, or will extensibility remain strictly delineated between MCP servers, plugins, and custom skills?
      - **Known State**: Official documentation uses terms like "plugins", "MCP servers", "skills", and "tools". "Mods" is entirely a community term.
      - **Evidence to Settle**: Future Anthropic product releases, plugin registry announcements, or official rebranding of Claude Code extension capabilities.

      ## 2. Concurrency and Multi-Account Pool Limits in Subagent Swarms
      - **Question**: How do multi-account LLM pool rate limits and per-process cooldowns (`llm_router`) behave when multiple Claude Code subagents or background monitors invoke CLI/HTTP agents concurrently?
      - **Known State**: The deepagents server uses a single worker to prevent concurrent SQLite/JSONL ledger appends and pool state fragmentation.
      - **Evidence to Settle**: Stress testing concurrent subagent task invocations against the free-tier LLM account pool.

      ## 3. Precise Hosted Timeout Limits
      - **Question**: What is the exact maximum timeout enforced by hosted claude.ai / Claude Desktop environments for MCP SSE/HTTP transport connections?
      - **Known State**: Synchronous tool calls typically timeout between 7 to 60 seconds, requiring the Async HandleId pattern.
      - **Evidence to Settle**: Empirical testing of long-running MCP requests across Claude Desktop and cloud environments.
    research/claude-mods/overview.md: "# Research Overview: \"Mods\" in Claude and Exposing Deepagents\
      \ as Subagents\n\n*Last updated: 2026-09-19*\n\n## Synthesis & Conclusion\n\nThis research investigates\
      \ the terminology of \"Mods\" in Claude, the architectural mechanics of Claude Code subagents, plugins,\
      \ hooks, and Model Context Protocol (MCP) servers, and how to expose our repository's LangChain\
      \ `deepagents` (`agent.code`, `agent.explore`, `agent.improve`) as Claude-callable subagents and\
      \ tools.\n\n### 1. What are \"Mods\" in Claude?\nThere is **no official feature or product called\
      \ \"Mods\"** in Anthropic's ecosystem (`claude.ai`, Claude Desktop, or Claude Code). \"Mods\" is\
      \ a community colloquialism that maps directly to official extension mechanisms: **Claude Code Plugins**,\
      \ **MCP Servers**, **Custom Skills**, **Custom Slash Commands**, and **Hooks** ([Claude Mods Definition](claude-mods-definition.md)).\n\
      \n### 2. Claude Code Subagents and Plugins Architecture\n- **Subagents (`.claude/agents/*.md`)**:\
      \ Specialized assistant prompts with YAML frontmatter (`name`, `description`, `tools`, `model`,\
      \ `prompt`) that execute in isolated context windows and return summaries to the main thread ([Claude\
      \ Code Subagents](claude-code-subagents-plugins.md)).\n- **Plugins**: Bundled packages containing\
      \ manifests (`plugin.json`), skills, agents, hooks, MCP servers, and a `bin/` directory whose executables\
      \ are added to the Bash tool's `PATH`.\n- **External Delegation**: Subagents and plugins can invoke\
      \ any local program, Python script, or external API via the Bash tool or custom MCP servers.\n\n\
      ### 3. Integration Paths & Feasibility (Answering Question 5)\nExposing our deepagents (`agent.code`,\
      \ `agent.explore`, `agent.improve`) as Claude subagents is **fully feasible today**.\n\n- **Simplest\
      \ Path for Claude Code**: **Custom Subagents (`.claude/agents/*.md`)** or a **Plugin** that bundles\
      \ CLI wrapper scripts in `bin/` and defines subagent prompts instructing Claude to invoke `python\
      \ -m agent.code --task \"...\"` via the Bash tool.\n- **Simplest Path for Claude Desktop / claude.ai**:\
      \ **An MCP Server** exposing tool endpoints.\n- **Blockers & Timeouts**: \n  - *Synchronous Timeouts*:\
      \ Deepagent runs take minutes to hours, whereas synchronous tool calls in Claude Desktop / MCP time\
      \ out within 30–60 seconds. Direct blocking calls fail with timeout errors or HTTP 424.\n  - *Solution*:\
      \ The architecture must use the **Async HandleId Pattern** (immediate `job_id` return + status polling\
      \ / background monitors) or asynchronous CLI/Bash execution.\n- **Terms of Service**: Local developer\
      \ shell execution, MCP integration, and CLI delegation are fully permitted within developer tooling\
      \ (Claude Code and MCP).\n\n## Related Pages\n- [Claude Mods Definition](claude-mods-definition.md)\n\
      - [Claude Code Subagents and Plugins](claude-code-subagents-plugins.md)\n- [Integration Paths and\
      \ Feasibility](integration-paths-and-feasibility.md)\n- [Open Questions](open-questions.md)\n"
  prompt: |-
    # Research request: "Mods" in Claude, and using them to expose our agents as Claude subagents

    ## Context

    This repository (the workdir) contains several LangChain `deepagents` agents that run on a pool of
    free-tier LLM accounts (Groq, Gemini):

    - a coding agent, run as `python -m agent.code <workdir> < brief.md`
    - a web researcher (you), run as `python -m agent.explore <workdir> < question.md`
    - an improvement agent, `python -m agent.improve`
    - all of them can also be served over HTTP (see `/docs/18-serving.md`); how one agent asks another is
      `/docs/16-delegation.md`.

    Read those two docs first so you know what the agents look like from the outside (a CLI command that
    reads a task on stdin and prints a final message, or an HTTP endpoint).

    ## Questions

    1. **What are "Mods" in Claude?** Anthropic's Claude products (claude.ai, the Claude desktop app,
       Claude Code) â€” find the official description of the feature called "Mods" (or "mods"): what it is,
       when it was released, which products and plans have it, and how a mod is authored, packaged and
       installed. If "Mods" turns out to be a name for something else (plugins, skills, extensions, MCP
       servers, custom agents/subagents), say so explicitly and cite the source that establishes it.
    2. **What can a mod contain?** Specifically: can it define a subagent, a tool, an MCP server, a slash
       command, a hook, or a command that shells out to a local program? What are the limits (sandboxing,
       network, local process execution, permissions)?
    3. **Claude Code subagents and plugins.** How Claude Code defines subagents (`.claude/agents/*.md`
       frontmatter: name, description, tools, model), plugins, and MCP servers â€” and whether a subagent's
       work can be performed by an *external* program or model rather than by Claude itself.
    4. **Integration paths.** For each plausible way to make our agents callable by Claude as subagents,
       describe how it would work and what it would take:
       - a mod / plugin that wraps the CLI commands above,
       - an MCP server exposing `code`, `explore`, `improve` as tools (local stdio, or remote over HTTP
         using the serving endpoints),
       - a Claude Code subagent definition whose instructions delegate to our CLI via Bash,
       - anything else the sources suggest.
       Note for each: does it run locally or need a hosted endpoint, does Claude wait synchronously
       (our runs take many minutes to hours), and how the result comes back.
    5. **Feasibility.** Is it possible today, which path is simplest, and what are the blockers
       (timeouts on long tool calls, desktop vs CLI differences, terms of use).

    ## How to work

    Prefer primary sources: docs.anthropic.com / docs.claude.com / code.claude.com, anthropic.com
    news posts, the modelcontextprotocol.io spec, Anthropic GitHub repos. Mark anything you could not
    confirm from a primary source as unconfirmed. Keep exact quotes short and give the URL for every claim.
    Finish with an `overview.md` answering question 5 directly, then the supporting notes.

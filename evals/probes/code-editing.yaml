        \ accounts with no events.\"\"\"\n    used = {account[\"id\"]: 0 for account in accounts}\n    for\
        \ event in events:\n        if event[\"account\"] in used:\n            used[event[\"account\"]]\
        \ += event[\"units\"]\n    return used\n\n\ndef monthly(accounts, events):\n    \"\"\"The report:\
        \ `(id, name, units)` per account, most units first.\n\n    Accounts with equal usage keep the order\
        \ they arrive in, which is the\n    order the account list is maintained in.\n    \"\"\"\n    used\
        \ = totals(accounts, events)\n    rows = [(account[\"id\"], account[\"name\"], used[account[\"id\"\
        ]])\n            for account in accounts]\n    return sorted(rows, key=lambda row: -row[2])\n"

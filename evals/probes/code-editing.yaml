# Probes for the coding agent.
#
# Each one guards a behaviour this project has actually recorded going wrong, so
# `why` cites the failure rather than describing an ideal. A probe with no such
# citation is a preference, and preferences do not belong in a suite that gates
# anything.
#
# These assert the agent's FIRST decision only. They cannot say a task was
# solved; they say the agent started the way it should. See evals/probes.py.
#
# The first is a hand-written situation. It was a failure when written and
# passes 3/3 against the current prompt (code-editing-baseline, 2026-09-19), so
# it is kept as a regression: a change to how the agent reads must not break it.
# Its hand-written sibling, does-not-edit-the-test-that-contradicts-the-task,
# moved to code-scope.yaml on 2026-09-19: it is the Contradicted Requests
# section's decision, and moves with that dataset.
#
# The rest were frozen from the traced scenario runs with
# `python -m evals probes --from-run <trace.json> --turn N --agent code`: the
# history is the run's own conversation (tool results over 8,000 characters cut
# to 1,500, and the cut says so), and `files` is the last whole read of each
# file in that history plus what the run had written, so the workspace and its
# tree look like the one the run decided in.
#
# Screened out 2026-09-19, and why, so nobody freezes them again:
# - Histories from the 2026-09-05/07 runs that contain a `Command rejected ...
#   not an allowed program` result (the restricted shell, removed 2026-09-15).
#   The Python-subprocess wrappers in the ui-port runs were the right answer to
#   that backend; replayed today they still are, so they test nothing.
# - write_file over an existing file, a repeated refused write, a repeated
#   failed edit, `/`-rooted paths given to execute, deleting the contract test,
#   git log while orienting, re-reading before each edit in bots-to-base-class:
#   each passed 3/3 at baseline. Most were flash-lite decisions; a probe is a
#   few calls and is served by the full flash models at the top of the pool.
#
# Retired 2026-09-19: does-not-shell-out-with-operators. It guarded the
# restricted backend, which ran one program with no shell; `execute` is now
# `subprocess.run(shell=True)` on cmd.exe, where `&&` works, so the situation
# it froze no longer occurs (docs/agents/code.md#the-blast-radius).

# Dataset probes-code-editing. How the coding agent changes a repository: reading
# first and not twice, the shell and the workspace it actually has (no git
# unless the Project section names a branch), and recovering from a refused
# call. What the task allows it to change is probes-code-scope.
dataset: probes-code-editing

probes:
  - id: reads-before-editing
    agent: code
    kind: regression
    reviewed: '2026-09-25'
    why: >
      The recorded failure: "the first edit lands at 08:32:41 against
      alerts/rules.py, which no prior call had read". An edit written against a
      file the agent has not opened is scored `reasoning` by the taxonomy when
      it is really retrieval, and it is the shape behind several of them.
    prompt: |
      The alert never fires when the header is written in capitals. Fix it in
      alerts/rules.py.
    files:
      alerts/rules.py: |
        def matches(header, wanted):
            return header == wanted


        def should_alert(headers, wanted):
            return any(matches(h, wanted) for h in headers)
      tests/test_rules.py: |
        from alerts.rules import should_alert


        def test_exact():
            assert should_alert(["x-alert"], "x-alert")
    options:
    - name: read-the-module
      tool: ^read_file$
      args: alerts/rules\.py
      because: The fix goes in alerts/rules.py and nothing has been opened yet.
    - name: read-the-test
      tool: ^read_file$
      args: tests/test_rules\.py
      because: The test says what "fires" means.
    - name: look-around
      tool: ^(ls|glob|grep)$
      because: Finding what else reads the header is part of reading first.
    - name: reproduce
      tool: ^execute$
      args: pytest
      because: Running the suite shows the failure before anything changes.
    must_not:
    - name: edit-unread
      tool: ^(edit_file|write_file)$
      because: 'The recorded failure: "the first edit lands at 08:32:41 against alerts/rules.py, which
        no prior call had read".'
  - id: does-not-verify-with-git-diff-without-git
    agent: code
    kind: failure
    source: run 01a0ae4d-83b3-70d0-b198-d58809c4855e, turn 14 (20260917T073826Z_model-v3-propagation_session-from-notes_code-tool-sequence_r3)
    reviewed: '2026-09-25'
    why: 'Run 01a0ae4d (2026-09-17, model-v3-propagation), turn 14, gemini-3.5-flash: every edit done, it
      verified with `git diff && python -m pytest tests`. The workspace has no git, so git printed its usage
      and the `&&` skipped the tests; turn 15 ran them again. The verify step in the prompt says to read
      the changed files when the Project section names no branch. All twelve traced runs of the 2026-09-17
      batch -- the first on the current shell backend -- called git at least once in these workspaces, none
      of which is a repository; the Project section names no branch in any of them.'
    options:
    - name: run-the-tests
      tool: ^execute$
      args: pytest
      because: The task names `python -m pytest tests` as the check, and the shell runs it.
    - name: read-what-changed
      tool: ^read_file$
      args: pipeline/normalise|docs/pipeline|tests/test_pipeline|NOTES|README
      because: With no repository, reading the files it changed is how the verify step checks them
        (agent/code/prompts/system.md).
    - name: fix-another-page
      tool: ^edit_file$
      args: README\.md|docs/pipeline\.md
      because: The task asks for every page the change makes wrong; README.md and the docs are the
        other candidates.
    - name: report-and-finish
      answer: (?s)\w.{60,}
      because: Everything the task asked for is on disk and was checked after the last code change;
        a closing account is the rest of the work.
    must_not:
    - name: call-git
      tool: ^execute$
      args: \bgit\b
      because: The workspace is not a repository and the Project section says so. All twelve traced
        runs of the 2026-09-17 batch called git at least once there and got its usage text back; with
        `&&` after it, the tests never ran.
    prompt: 'Read NOTES.md and do what the newest feedback asks for. Check your work by

      running `python -m pytest tests`, and update any documentation your change

      makes wrong before you finish.'
    files:
      NOTES.md: '# Notes


        Working journal for the pipeline. Newest first.


        ## 2026-08-20 — model v3 is in


        The catalogue team published version 3 of the data model and I have copied

        `docs/data_model.md` across from their repo. I have not touched anything else

        yet, so this package is still producing v2 records.


        Somebody needs to read that page properly and make this package agree with it —

        all of it, not just the headline. And whatever changes, `docs/pipeline.md`

        describes what we produce, so it has to end up true.


        ## 2026-08-04 — supplier exports drop trailing columns


        Two suppliers send rows with the unit column missing entirely rather than

        empty. `parse_block` pads short rows now.


        ## 2026-07-22 — comma decimals


        Half of one supplier''s sheet uses `3,25` and the other half `3.25`, in the same

        table. Handled in `_amount`.

        '
      README.md: '# pipeline


        Normalises product rows extracted from supplier documents into the records the

        catalogue loads.


        - `pipeline.extract.parse_block` — a raw text block to raw rows.

        - `pipeline.normalise.normalise` — raw rows to catalogue records.


        The record shape is **not this package''s to decide**. It is defined in

        [docs/data_model.md](docs/data_model.md), which is maintained in the catalogue

        project and copied here for reference; if development needs the model to

        change, that change is made there and copied back, never made here.


        What this package currently produces is described in

        [docs/pipeline.md](docs/pipeline.md).


        Tests: `python -m pytest tests`.

        '
      docs/pipeline.md: "# What the pipeline produces\n\n`pipeline.extract.parse_block` turns a supplier\
        \ block into raw rows; every\nvalue it returns is text taken straight from the file, with no interpretation.\n\
        \n`pipeline.normalise.normalise` turns those rows into catalogue records, applying\nthe rules in\
        \ [docs/data_model.md](data_model.md).\n\n## Guarantees\n\n- Records come out in the order their\
        \ rows went in.\n- `name` is the supplier's text, untouched.\n- Amounts written with a comma and\
        \ amounts written with a dot both parse.\n- **One row in, one record out.** A row whose amount cell\
        \ is blank is still a\n  record, carrying an amount of `0.00`, so the number of records this pipeline\n\
        \  returns always equals the number of rows it was given. Downstream code relies\n  on that to report\
        \ a row index for a rejected record.\n\n## Not done here\n\nDeduplication, unit conversion, and\
        \ provenance. See the data model for why each\nof those lives elsewhere.\n"
      pipeline/__init__.py: 'System reminder: File exists but has empty contents

        '
      pipeline/extract.py: "\"\"\"Raw supplier blocks to raw rows.\n\nA block is one row per line, fields\
        \ separated by `|`:\n\n    NAME | CATEGORY | AMOUNT | UNIT\n\nEvery field is stripped. Blank lines\
        \ and `#` comments are skipped. A line with\nfewer than four fields is padded with empty strings,\
        \ because supplier exports\nroutinely omit trailing columns rather than leaving them empty.\n\n\
        This module does no interpretation at all -- every value it returns is the\ntext that was in the\
        \ file. Meaning is applied in `pipeline.normalise`, against\nthe data model.\n\"\"\"\n\nFIELDS =\
        \ (\"name\", \"category\", \"amount\", \"unit\")\n\n\ndef parse_block(block):\n    \"\"\"The rows\
        \ in `block`, in file order, as dicts of raw text.\"\"\"\n    rows = []\n    for line in block.splitlines():\n\
        \        line = line.strip()\n        if not line or line.startswith(\"#\"):\n            continue\n\
        \        parts = [part.strip() for part in line.split(\"|\")]\n        parts += [\"\"] * (len(FIELDS)\
        \ - len(parts))\n        rows.append(dict(zip(FIELDS, parts)))\n    return rows\n"
      pipeline/normalise.py: "\"\"\"Raw rows to catalogue records.\n\nThe record shape is the data model's,\
        \ not this module's: see\ndocs/data_model.md. Anything decided here that the model does not ask\
        \ for is a\nbug, and so is anything the model asks for that is not done here.\n\"\"\"\n\n\ndef _amount(raw):\n\
        \    \"\"\"The amount as a float.\n\n    An empty cell means the supplier left the column blank.\n\
        \    \"\"\"\n    text = raw.replace(\",\", \".\").strip()\n    if not text:\n        return 0.0\n\
        \    return float(text)\n\n\ndef normalise(rows):\n    \"\"\"Catalogue records, in the order the\
        \ rows arrived.\"\"\"\n    records = []\n    for row in rows:\n        records.append({\n      \
        \      \"name\": row[\"name\"],\n            \"category\": row[\"category\"],\n            \"amount\"\
        : _amount(row[\"amount\"]),\n            \"unit\": row[\"unit\"],\n        })\n    return records\n"
      tests/test_pipeline.py: "from pipeline.extract import parse_block\nfrom pipeline.normalise import\
        \ normalise\n\nBLOCK = \"\"\"\n# xanthan supplier export, rev 4\nXanthan gum PM80 | thickener |\
        \ 12.5 | kg\nCitric acid | acidifier | 3,25 | kg\nSodium benzoate | preservative | 0.4\n\"\"\"\n\
        \n\ndef test_parse_block_splits_the_four_fields():\n    rows = parse_block(BLOCK)\n    assert rows[0]\
        \ == {\"name\": \"Xanthan gum PM80\", \"category\": \"thickener\",\n                       \"amount\"\
        : \"12.5\", \"unit\": \"kg\"}\n\n\ndef test_parse_block_skips_comments_and_blank_lines():\n    assert\
        \ len(parse_block(BLOCK)) == 3\n\n\ndef test_parse_block_pads_a_short_row():\n    assert parse_block(BLOCK)[2][\"\
        unit\"] == \"\"\n\n\ndef test_amounts_accept_a_comma_or_a_dot():\n    amounts = [record[\"amount\"\
        ] for record in normalise(parse_block(BLOCK))]\n    assert amounts == [12.5, 3.25, 0.4]\n\n\ndef\
        \ test_names_are_left_exactly_as_written():\n    names = [record[\"name\"] for record in normalise(parse_block(BLOCK))]\n\
        \    assert names == [\"Xanthan gum PM80\", \"Citric acid\", \"Sodium benzoate\"]\n\n\ndef test_records_keep_the_order_the_rows_arrived_in():\n\
        \    records = normalise(parse_block(BLOCK))\n    assert [record[\"category\"] for record in records]\
        \ == [\n        \"thickener\", \"acidifier\", \"preservative\"]\n"

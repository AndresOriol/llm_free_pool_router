      import os
      from datetime import datetime

      # The digest goes out once a day, at this hour (server time).
      DIGEST_HOUR = int(os.getenv("MAILER_DIGEST_HOUR", "7"))


      def is_due(now: datetime, last_sent: datetime | None) -> bool:
          """True when today's digest has not gone out and its hour has come."""
          if last_sent is not None and last_sent.date() == now.date():
              return False
          return now.hour >= DIGEST_HOUR
    mailer/workers/queue.py: |
      from mailer import config


      def batches(messages, size=None):
          """Split messages into lists of at most `size` (default: the configured batch size)."""
          size = size or config.load()["batch_size"]
          return [messages[i:i + size] for i in range(0, len(messages), size)]


      def run_forever():  # pragma: no cover - the production loop
          raise NotImplementedError("wired up in production only")

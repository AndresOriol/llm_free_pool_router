      import logging

      from ingest.sources.base import Source

      log = logging.getLogger("ingest.sources.legacy_ftp")


      def connect(host):  # pragma: no cover - needs a real server
          import ftplib
          return ftplib.FTP(host)


      class FtpSource(Source):
          def list(self):
              conn = connect(self.config["host"])
              names = conn.nlst()
              log.info("listed %d files on %s", len(names), self.config["host"])
              return names

      from dataclasses import replace

      from crm.codecs.json_codec import from_dict, to_dict
      from crm.validate import validate

      # Fields a PATCH may change. id is fixed at creation.
      PATCHABLE = {"name", "email", "country", "tags"}


      class BadRequest(Exception):
          pass


      def create_customer(store, payload):
          customer = from_dict(payload)
          errors = validate(customer)
          if errors:
              raise BadRequest("; ".join(errors))
          store.put(customer)
          return to_dict(customer)


      def patch_customer(store, customer_id, payload):
          current = store.get(customer_id)
          if current is None:
              raise KeyError(customer_id)
          unknown = set(payload) - PATCHABLE
          if unknown:
              raise BadRequest(f"cannot change: {', '.join(sorted(unknown))}")
          updated = replace(current, **payload)
          errors = validate(updated)
          if errors:
              raise BadRequest("; ".join(errors))
          store.put(updated)
          return to_dict(updated)

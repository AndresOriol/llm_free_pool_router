      from geokit.distance import haversine_km as _km


      def track_length(points):
          """Length in km of a track given as [(lat, lon), ...]."""
          return sum(_km(a, b) for a, b in zip(points, points[1:]))


      def pace_min_per_km(points, minutes):
          length = track_length(points)
          return minutes / length if length else 0.0

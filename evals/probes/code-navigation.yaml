      import csv
      import io

      from crm.models import Customer

      FIELDNAMES = ["id", "name", "email", "country", "tags"]


      def write(customers):
          out = io.StringIO()
          writer = csv.DictWriter(out, fieldnames=FIELDNAMES, lineterminator="\n")
          writer.writeheader()
          for c in customers:
              row = {name: getattr(c, name) for name in FIELDNAMES}
              row["tags"] = ";".join(c.tags)
              writer.writerow(row)
          return out.getvalue()


      def read(text):
          customers = []
          for row in csv.DictReader(io.StringIO(text)):
              row["tags"] = [t for t in row["tags"].split(";") if t]
              customers.append(Customer(**row))
          return customers

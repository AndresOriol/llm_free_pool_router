    turn 2, gemini-3.5-flash-lite: it had read the model, the store, search, the renderer, the docs, both
    fixtures and the tests. store.py imports `journal.storage.migrations`, a package the Project listing
    does not show (it stops at three levels), and render/text.py reads a template from render/templates/,
    also unlisted. It globbed `**/*` before any edit, then read the migration registry, both migrations
    and the template, and registered its new migration and fixed the template. Editing here would have
    meant writing a migration without knowing how migrations are numbered or registered.'
  prompt: Rename the note field `created` to `created_at` everywhere -- in the model and in the JSON files
    we store. Notes already saved on disk use `created` and must keep loading, so they need a migration.
  files:
    docs/storage.md: |
      # Storage format

      One note per file, as a JSON object:

      ```json
      {"schema_version": 2, "id": "n1", "title": "...", "body": "...",
       "created": "2026-09-01T10:00:00", "created_by": "ana", "tags": []}
      ```

      `created` is an ISO-8601 timestamp. Files written by older versions are upgraded
      in memory when they are loaded, one schema version at a time, and written back
      in the current version the next time they are saved.
    journal/__init__.py: ''
    journal/models.py: |
      from dataclasses import dataclass, field


      @dataclass
      class Note:
          id: str
          title: str
          body: str
          created: str
          created_by: str
          tags: list = field(default_factory=list)
    journal/render/__init__.py: ''
    journal/render/templates/entry.txt: |
      {title}
      {created} by {created_by}

      {body}
    journal/render/text.py: |
      from dataclasses import asdict
      from pathlib import Path

      TEMPLATE = (Path(__file__).parent / "templates" / "entry.txt").read_text(encoding="utf-8")


      def render(note):
          return TEMPLATE.format(**asdict(note))
    journal/search.py: |
      def newest_first(notes):
          return sorted(notes, key=lambda n: n.created, reverse=True)


      def by_author(notes, author):
          return [n for n in notes if n.created_by == author]


      def created_between(notes, start, end):
          """Notes created in [start, end), comparing ISO timestamps as strings."""

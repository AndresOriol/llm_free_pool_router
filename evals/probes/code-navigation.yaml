      from decimal import Decimal

      from ledger.invoices.model import Invoice, Line
      from ledger.invoices.totals import subtotal, tax, total


      def make_invoice():
          return Invoice("F-001", "acme", "EUR", [Line("widget", 9.99, 3), Line("setup", 25.0)])


      def test_subtotal():
          assert subtotal(make_invoice()) == Decimal("54.97")


      def test_tax_and_total():
          invoice = make_invoice()
          assert tax(invoice, 0.21) == Decimal("11.54")
          assert total(invoice, 0.21) == Decimal("66.51")

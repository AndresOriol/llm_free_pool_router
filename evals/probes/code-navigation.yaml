    gateway/guards/__init__.py: ''
    gateway/guards/allowance.py: |
      import time


      class Allowance:
          """Token bucket: holds up to `per_minute` tokens, refilled at per_minute / 60 a second."""

          def __init__(self, per_minute, clock=time.monotonic):
              self.rate = per_minute / 60.0
              self.capacity = float(per_minute)
              self.tokens = self.capacity
              self.clock = clock
              self.stamp = clock()

          def take(self):
              now = self.clock()
              self.tokens = min(self.capacity, self.tokens + (now - self.stamp) * self.rate)
              self.stamp = now
              if self.tokens >= 1:
                  self.tokens -= 1
                  return True
              return False

          def retry_after(self):
              return max(0.0, (1 - self.tokens) / self.rate)

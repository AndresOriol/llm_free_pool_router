      The mailer reads its settings from environment variables when it starts.

      | Variable | Default | Meaning |
      | --- | --- | --- |
      | `MAILER_SMTP_HOST` | `localhost` | SMTP relay to send through |
      | `MAILER_SMTP_PORT` | `25` | Port of the relay |
      | `MAILER_SENDER` | `noreply@example.org` | `From:` address |
      | `MAILER_BATCH_SIZE` | `50` | Messages per batch in the queue worker |


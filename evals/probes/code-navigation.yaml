    gateway/ws/channels/session.py: |
      from gateway.guards.allowance import Allowance


      class Session:
          """One websocket session: messages it sends count against its own allowance."""

          def __init__(self, partner, clock=None):
              self.partner = partner
              self.allowance = Allowance(per_minute=120, **({"clock": clock} if clock else {}))
              self.sent = []

          def send(self, message):
              if not self.allowance.take():
                  return False
              self.sent.append(message)
              return True

    mailer/config.py: |
      """Settings, read from the environment."""
      import os

      PREFIX = "MAILER_"


      def env(name, default=None):
          """The value of the variable PREFIX + name, or default when it is unset."""
          return os.environ.get(PREFIX + name, default)


      def load():
          return {
              "smtp_host": env("SMTP_HOST", "localhost"),
              "smtp_port": int(env("SMTP_PORT", "25")),
              "sender": env("SENDER", "noreply@example.org"),
              "batch_size": int(env("BATCH_SIZE", "50")),
          }
    mailer/smtp.py: |
      from mailer import config


      class Sender:
          """Builds what the relay needs for one message."""

          def __init__(self, settings=None):
              self.settings = settings or config.load()

          def envelope(self, to, subject):
              return {
                  "host": self.settings["smtp_host"],
                  "port": self.settings["smtp_port"],
                  "from": self.settings["sender"],
                  "to": to,
                  "subject": subject,
              }

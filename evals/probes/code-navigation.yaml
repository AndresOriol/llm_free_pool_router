# Probes for the coding agent: finding everything a change touches.
#
# Dataset code-navigation. One family of decisions, the one `## Doing Tasks`
# move 1 ("You are done orienting when you can name every file you will
# change") and move 4 (walk the change against the task before ending) govern
# in a repository of a dozen or more files: before the first edit, open the
# module that also reads the setting or calls the function being changed; before
# the last message, open the file the change made untrue. A change to how the
# agent orients or sweeps moves all of them together.
#
# All come from runs recorded 2026-09-26 on three invented tasks, each a
# package with subpackages, tests, docs and a NOTES.md, where one place the
# change must reach is not where the task points:
# - ledger: make round_amount(value) take a required currency; one caller
#   reaches it by name, through getattr and a column config, and the docs say
#   every currency gets two decimals.
# - crm: add a contact_channel field that must flow through the model, both
#   codecs, validation, the PATCH allow-list, the fixture and docs/api.md (the
#   field reference another team codes against).
# - fetcher: "the retry policy" (named, not located) retries 4xx and waits too
#   long; a nightly sitemap job keeps its own copy of the loop off
#   settings.RESILIENCE.
# Each task ran once on the default pool (gemini-3.5/3.7-flash,
# 3-flash-preview: every site found) and once pinned to the lite tier
# (3.5/3.1/2.5-flash-lite, where most coding runs land: each run missed one).
# Seeds and traces were kept in the session scratchpad only.
#
# - failures (gemini-3.5-flash-lite): editing the shared retry settings with the
#   other module that reads them unopened, and ending that run with it still
#   retrying 404s; adding the field with the API reference unopened; ending the
#   rounding run with the docs it had grepped still describing the old
#   signature.
# - regression (gemini-3.5-flash): following the column config to the code
#   that calls round_amount by name.
#
# Every read or search is an option in these probes; what they forbid is the
# move the lite run made -- editing or ending while the file is still unopened
# -- plus re-reading what is already in the conversation and rerunning a suite
# nothing has changed since.
#
# Baselines 2026-09-26, three repetitions each:
# - code-navigation-baseline, default pool (served by gemini-3-flash-preview and
#   3.5-flash-lite that hour): every failure 0/3, the regression 3/3.
# - code-navigation-baseline-flash, pinned to gemini-3.5 to 3.8-flash: the
#   docs-at-the-end and sitemap-at-the-end probes 0/3, the API-reference probe
#   1/3, the retry-settings probe 2/3 (3.6-flash edits, 3.7/3.8 open the job),
#   the regression 3/3. These failures are not a lite-only habit.
# A regression twin of the retry-settings probe (the default-pool run opening
# the sitemap job at its turn 5) was dropped: it failed 0/3 on the default pool,
# so it could not serve as a green check.
#
# Expansion, 2026-09-26: 25 probes from 13 more invented tasks, each a 11-19
# file package where at least one place the change must reach is hidden from
# the Project file listing (it stops at three levels and skips dot-files) or
# never spells the name the task gives:
# - mailer: drop the MAILER_ env prefix (names built as PREFIX + name; .env,
#   CI workflow and a digest worker outside the listing).
# - payroll: AmountError instead of ValueError (an exact-type status map, the
#   hours parser still raising ValueError, docs/errors.md).
# - ingest: rename legacy_ftp (importlib strings, TOML pipelines).
# - journal: created -> created_at with a migration (registry and template
#   outside the listing; old-format fixtures).
# - gateway: "the rate limiter" (named nowhere) caps bursts; a websocket
#   session builds its own; the partner docs promise the whole minute.
# - geokit: rename with a deprecated alias; shop: raise a limit held as a bare
#   number in nginx and JS; mono: a shared helper whose caller and pinning test
#   live in another package; notify: add a required argument (partial and an
#   aliased import); reportgen: rename the CLI entry function; orders: rename a
#   JSON field but not the accounting CSV column; checkout: remove a flag read
#   two ways; confsplit: split a loader whose hook caller relies on validation.
# All recorded on the lite tier (3.5/3.1-flash-lite) except geokit (default
# pool, served by 3.5-flash-lite), plus one turn of the default-pool fetcher
# run above (looks-for-a-test-that-reaches-the-edited-job). No run installed
# anything (pip list diffed before and after).
#
# Search-shape probes separate an exact-symbol search from one that misses:
# the bare name vs the import line, the prefix vs one variable, the exception
# vs `except X`, the value vs the constant, the name vs the call syntax, the
# class vs the helper's package. End-of-run probes forbid finishing with the
# file the change made untrue unopened (or opened and not fixed).
#
# Baseline code-navigation-baseline-30 (2026-09-29, default pool: gemini-3,
# 3.5-3.8-flash; no lite samples that hour): 53/90. Failures that passed 3/3
# (the migration registry, the v2 fixture, the second alias) are kept as
# regressions. Failures at 0/3: the API-reference field, the errors doc, the
# sitemap job at the end, the reload hook; regressions below 3/3: the test for
# the edited job (0/3), the limit value (1/3, two unlisted since resolved),
# the prefix and the widened search (2/3). Five `unlisted` outcomes were
# resolved by rescoring the stored decisions (a `pip install -e .` among them,
# now forbidden; the probe does not execute it, pip list unchanged).


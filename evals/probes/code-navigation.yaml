    gateway/middleware.py: |
      from collections import defaultdict

      from gateway import settings
      from gateway.guards.allowance import Allowance
      from gateway.guards.credentials import partner_for

      _allowances = defaultdict(lambda: Allowance(settings.LIMITS["per_minute"]))


      def check(request):
          """None when the request may go on, else (status, headers)."""
          if request["path"] in settings.PUBLIC_PATHS:
              return None
          partner = partner_for(request["headers"])
          if partner is None:
              return 401, {}
          allowance = _allowances[partner]
          if not allowance.take():
              return 429, {"Retry-After": str(round(allowance.retry_after()))}
          return None

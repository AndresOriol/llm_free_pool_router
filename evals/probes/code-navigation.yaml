    journal/storage/__init__.py: ''
    journal/storage/migrations/__init__.py: |
      from journal.storage.migrations import m0001_initial, m0002_tags, m0003_created_at

      # version -> function upgrading a document from version - 1 to that version.
      STEPS = {
          1: m0001_initial.upgrade,
          2: m0002_tags.upgrade,
          3: m0003_created_at.upgrade,
      }
      CURRENT_VERSION = max(STEPS)


      def migrate(doc):
          """Upgrade a stored document, in place, to CURRENT_VERSION."""
          version = doc.get("schema_version", 0)
          for target in range(version + 1, CURRENT_VERSION + 1):
              doc = STEPS[target](doc)
              doc["schema_version"] = target
          return doc
    journal/storage/migrations/m0001_initial.py: |
      def upgrade(doc):
          """Version 0 files had no author."""
          doc.setdefault("created_by", "unknown")
          return doc
    journal/storage/migrations/m0002_tags.py: |
      def upgrade(doc):
          """Version 2 added tags."""
          doc.setdefault("tags", [])
          return doc
    journal/storage/store.py: |
      import json
      from dataclasses import asdict
      from pathlib import Path

      from journal.models import Note
      from journal.storage.migrations import CURRENT_VERSION, migrate


      def load(path):
          doc = migrate(json.loads(Path(path).read_text(encoding="utf-8")))
          doc.pop("schema_version")
          return Note(**doc)


      def save(note, path):
          doc = {"schema_version": CURRENT_VERSION, **asdict(note)}
          Path(path).write_text(json.dumps(doc, indent=2), encoding="utf-8")

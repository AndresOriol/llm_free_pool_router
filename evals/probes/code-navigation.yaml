      def main(argv=None):
          parser = argparse.ArgumentParser(prog="ledger", description="Print an amount as money.")
          parser.add_argument("amount", type=float)
          parser.add_argument("--currency", default="EUR", choices=sorted(SYMBOLS))
          args = parser.parse_args(argv)
          print(f"{SYMBOLS[args.currency]}{round_amount(args.amount)}")
          return 0


      if __name__ == "__main__":
          sys.exit(main())

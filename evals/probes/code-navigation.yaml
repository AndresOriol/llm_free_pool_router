      import os
      from datetime import datetime

      # The digest goes out once a day, at this hour (server time).
      DIGEST_HOUR = int(os.getenv("MAILER_DIGEST_HOUR", "7"))


      def is_due(now: datetime, last_sent: datetime | None) -> bool:
          """True when today's digest has not gone out and its hour has come."""
          if last_sent is not None and last_sent.date() == now.date():
              return False
          return now.hour >= DIGEST_HOUR

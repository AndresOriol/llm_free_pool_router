- id: searches-for-the-limit-value-not-the-constant
  agent: code
  kind: regression
  source: run 01a0de8c-6796-7fa1-b22e-a2440205e9f9, turn 1
  reviewed: '2026-09-26'
  why: 'Run 01a0de8c-6796 (2026-09-26, invented task: "Sellers keep hitting the 25 MB limit on product
    photos. Raise the upload limit to 50 MB."), turn 1, gemini-3.5-flash-lite: its first move was a grep
    for the value `25`, which listed shop/views.py (MAX_UPLOAD_MB = 25) and three places that hold the
    same limit as a bare number and never name the constant: the nginx site config (client_max_body_size
    25m, which answers 413 before the app sees the file), the browser check in shop/static/js/upload.js
    (const MAX_MB = 25) and the seller FAQ. The first two are four levels deep and not in the Project
    listing. It read all four and changed all four.'
  prompt: Sellers keep hitting the 25 MB limit on product photos. Raise the upload limit to 50 MB.
  files:
    deploy/nginx/sites/shop.conf: |
      server {
          listen 80;
          server_name shop.internal;

          # Must be at least the app's upload limit, or nginx answers 413 first.
          client_max_body_size 25m;

          location / {
              proxy_pass http://127.0.0.1:8000;
          }
      }
    deploy/README.md: |
      # Deploy

      The app runs behind nginx; the site config lives in `deploy/nginx/sites/`.
    docs/faq.md: |
      # Seller FAQ

      **How big can a product photo be?**
      Up to 25 MB per file. Larger files are refused; resize them first.

      **Which formats?**
      JPEG, PNG and WebP.
    NOTES.md: |
      # Notes

      Working journal, newest first.

      ## 2026-09-10 — upload page

      - Upload form rejects files over the limit in the browser before sending them.
      - Checked with `python -m pytest` (all green).
    README.md: |
      # shop

      The seller back office: product pages and image uploads.

      - `shop/views.py` — request handlers.
      - `shop/images.py` — resizing and storing uploads.
      - `shop/static/` — the browser side.
      - `deploy/` — how it is served (reverse proxy config included).

      Run the tests with `python -m pytest`.
    shop/__init__.py: ''
    shop/images.py: |
      import hashlib

      STORE = {}


      def store(data):
          key = hashlib.sha256(data).hexdigest()[:16]
          STORE[key] = data
          return key
    shop/static/css/app.css: |
      .upload-error { color: #b00020; }
    shop/static/js/upload.js: |
      // Checked in the browser so a seller is not made to wait for a big upload to fail.
      const MAX_MB = 25;

      export function tooBig(file) {
        return file.size > MAX_MB * 1024 * 1024;
      }

      export function message() {
        return `Photos can be up to ${MAX_MB} MB.`;
      }
    shop/views.py: |
      from shop import images

      MAX_UPLOAD_MB = 25
      ALLOWED = {"image/jpeg", "image/png", "image/webp"}


      def upload(request):
          """-> (status, body)."""
          data = request["body"]
          if request["content_type"] not in ALLOWED:
              return 415, "unsupported type"
          if len(data) > MAX_UPLOAD_MB * 1024 * 1024:
              return 413, f"file larger than {MAX_UPLOAD_MB} MB"
          return 201, images.store(data)
    tests/test_upload.py: |
      from shop.views import MAX_UPLOAD_MB, upload


      def request(size, content_type="image/png"):
          return {"body": b"x" * size, "content_type": content_type}


      def test_accepts_up_to_the_limit():
          assert upload(request(MAX_UPLOAD_MB * 1024 * 1024))[0] == 201


      def test_refuses_over_the_limit():
          status, body = upload(request(MAX_UPLOAD_MB * 1024 * 1024 + 1))
          assert status == 413 and "MB" in body


      def test_refuses_other_types():
          assert upload(request(10, "application/pdf"))[0] == 415

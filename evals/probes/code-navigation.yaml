      from pathlib import Path

      from store import checkout, flags

      TEMPLATES = Path(__file__).parent / "templates"


      def checkout_page(cart, flag_values=None):
          values = flag_values if flag_values is not None else flags.load()
          template = (TEMPLATES / "checkout" / "layout.html").read_text(encoding="utf-8")
          one_page = "one-page" if values.get("new_checkout") else "stepped"
          return template.format(mode=one_page, steps=" > ".join(checkout.steps(values)),
                                 total=checkout.total(cart))

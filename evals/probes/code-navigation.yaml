      from notify import settings

      OUTBOX = []


      def send(to, subject, body, *, channel="email"):
          """Queue one message. Returns its position in the outbox."""
          if channel not in settings.CHANNELS:
              raise ValueError(f"unknown channel: {channel}")
          OUTBOX.append({"to": to, "subject": subject, "body": body, "channel": channel})
          return len(OUTBOX) - 1

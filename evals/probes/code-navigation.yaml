      import json

      from crm.models import Customer


      def to_dict(customer):
          return {
              "id": customer.id,
              "name": customer.name,
              "email": customer.email,
              "country": customer.country,
              "tags": list(customer.tags),
          }


      def from_dict(data):
          return Customer(
              id=data["id"],
              name=data["name"],
              email=data["email"],
              country=data.get("country", "ES"),
              tags=list(data.get("tags", [])),
          )


      def dumps(customers):
          return json.dumps([to_dict(c) for c in customers], indent=2)


      def loads(text):
          return [from_dict(d) for d in json.loads(text)]

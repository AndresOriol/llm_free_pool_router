      from pathlib import Path

      from journal.models import Note
      from journal.storage import store

      FIXTURES = Path(__file__).parent / "fixtures"


      def test_loads_a_current_note():
          note = store.load(FIXTURES / "v2_note.json")
          assert note.tags == ["work"] and note.created_at == "2026-03-04T18:30:00"


      def test_upgrades_a_version_1_note():
          note = store.load(FIXTURES / "v1_note.json")
          assert note.tags == [] and note.created_by == "ana"



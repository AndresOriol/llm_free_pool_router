      import importlib
      import tomllib
      from pathlib import Path

      PLUGINS = Path(__file__).parent.parent / "plugins.toml"


      def hook(name):
          spec = tomllib.loads(PLUGINS.read_text(encoding="utf-8"))["hooks"][name]
          module, _, func = spec.partition(":")
          return getattr(importlib.import_module(module), func)
    svcconf/loader.py: |
      import json
      from pathlib import Path


      class ConfigError(Exception):
          pass


      def load(path):
          """Read a JSON config file. Returns the dict."""
          return json.loads(Path(path).read_text(encoding="utf-8"))


      def validate(data):
          """Check config data dict. Raises ConfigError if invalid."""
          problems = []
          if not 1 <= data.get("port", 0) <= 65535:
              problems.append("port must be 1-65535")
          if data.get("workers", 0) < 1:
              problems.append("workers must be at least 1")
          if problems:
              raise ConfigError("; ".join(problems))
          return data

      import argparse
      import json

      from mailer import config

      EPILOG = ("Settings come from MAILER_SMTP_HOST, MAILER_SMTP_PORT, MAILER_SENDER "
                "and MAILER_BATCH_SIZE; see docs/configuration.md.")


      def main(argv=None):
          parser = argparse.ArgumentParser(prog="mailer", epilog=EPILOG)
          parser.add_argument("command", choices=["show-config", "worker"])
          args = parser.parse_args(argv)
          if args.command == "show-config":
              print(json.dumps(config.load(), sort_keys=True))
              return 0
          from mailer.workers.queue import run_forever
          run_forever()
          return 0


      if __name__ == "__main__":
          raise SystemExit(main())

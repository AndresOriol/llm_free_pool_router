    store/flags.py: |
      import json
      from pathlib import Path

      FLAGS_FILE = Path(__file__).parent.parent / "config" / "flags.json"


      def load():
          return json.loads(FLAGS_FILE.read_text(encoding="utf-8"))


      def enabled(name, flags=None):
          return bool((flags if flags is not None else load()).get(name, False))
    store/web/__init__.py: ''

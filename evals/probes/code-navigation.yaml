    fetcher/resilience/backoff.py: |
      from fetcher import settings


      class Backoff:
          """When to try a request again, and how long to wait before doing so."""

          def __init__(self, max_attempts=None, base_delay=None, factor=None):
              conf = settings.RESILIENCE
              self.max_attempts = max_attempts or conf["max_attempts"]
              self.base_delay = base_delay or conf["base_delay"]
              self.factor = factor or conf["factor"]

          def should_try_again(self, attempt, status=None, error=None):
              if attempt >= self.max_attempts:
                  return False
              if error is not None:
                  return isinstance(error, (TimeoutError, ConnectionError))
              return status >= 400

          def delay(self, attempt):
              return self.base_delay * self.factor ** (attempt - 1)

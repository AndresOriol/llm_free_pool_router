      import json

      from svcconf.cli import main


      def test_check_ok(tmp_path, capsys):
          path = tmp_path / "c.json"
          path.write_text(json.dumps({"port": 80, "workers": 1}), encoding="utf-8")
          assert main(["check", str(path)]) == 0
          assert capsys.readouterr().out.strip() == "ok"
    tests/test_loader.py: |
      import json

      import pytest

      from svcconf.loader import ConfigError, load_and_validate


      def write(tmp_path, data):
          path = tmp_path / "c.json"
          path.write_text(json.dumps(data), encoding="utf-8")
          return path


      def test_valid(tmp_path):
          assert load_and_validate(write(tmp_path, {"port": 80, "workers": 2}))["port"] == 80


      def test_invalid(tmp_path):
          with pytest.raises(ConfigError, match="port"):
              load_and_validate(write(tmp_path, {"port": 0, "workers": 2}))

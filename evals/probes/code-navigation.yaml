    tool: ^grep$
    args: '(?s)^(?=.*pattern.: .[^''\"]*(25|MB|body_size|limit|upload))(?!.*pattern.: .[^''\"]*MAX_UPLOAD_MB)(?!.*\*\.py)'
    because: The limit is a number that can be written without the constant's name -- in proxy config,
      in browser code, in docs; the value finds them.

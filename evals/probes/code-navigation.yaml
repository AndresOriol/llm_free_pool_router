      """Settings, read from the environment."""
      import os

      PREFIX = "MAILER_"


      def env(name, default=None):
          """The value of the variable PREFIX + name, or default when it is unset."""
          return os.environ.get(PREFIX + name, default)


      def load():
          return {
              "smtp_host": env("SMTP_HOST", "localhost"),
              "smtp_port": int(env("SMTP_PORT", "25")),
              "sender": env("SENDER", "noreply@example.org"),
              "batch_size": int(env("BATCH_SIZE", "50")),
          }

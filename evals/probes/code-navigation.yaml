      import json

      import pytest

      from svcconf.loader import ConfigError, load, validate


      def write(tmp_path, data):
          path = tmp_path / "c.json"
          path.write_text(json.dumps(data), encoding="utf-8")
          return path


      def test_load(tmp_path):
          path = write(tmp_path, {"port": 80, "workers": 2})
          assert load(path) == {"port": 80, "workers": 2}


      def test_validate_valid():
          assert validate({"port": 80, "workers": 2}) == {"port": 80, "workers": 2}


      def test_validate_invalid():
          with pytest.raises(ConfigError, match="port"):
              validate({"port": 0, "workers": 2})


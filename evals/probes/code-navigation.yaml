    README.md: |
      # fetcher

      Polite HTTP fetching for the catalogue crawler.

      - `fetcher/client.py` – `Client.get`, the one entry point for page fetches
      - `fetcher/jobs` – the nightly jobs (pages, sitemaps)
      - `fetcher/transport` – the scripted transport the tests use
      - `docs/configuration.md` – settings

      Tests: `python -m pytest`.
    tests/test_backoff.py: |
      from fetcher.resilience import Backoff


      def test_gives_up_after_max_attempts():
          backoff = Backoff(max_attempts=3)
          assert backoff.should_try_again(2, status=503)
          assert not backoff.should_try_again(3, status=503)


      def test_timeouts_are_tried_again():
          assert Backoff().should_try_again(1, error=TimeoutError())


      def test_other_exceptions_are_not():
          assert not Backoff().should_try_again(1, error=ValueError())


      def test_delay_grows_geometrically():
          backoff = Backoff(base_delay=1.0, factor=3.0)
          assert [backoff.delay(n) for n in (1, 2, 3)] == [1.0, 3.0, 9.0]
    tests/test_client.py: |
      import pytest

      from fetcher.client import Client
      from fetcher.transport.scripted import Response, ScriptedTransport


      def no_sleep(_seconds):
          pass


      def test_returns_first_success():
          transport = ScriptedTransport([Response(503), Response(200, "ok")])
          assert Client(transport, sleep=no_sleep).get("https://x").body == "ok"
          assert transport.calls == 2


      def test_raises_the_timeout_once_attempts_run_out():
          transport = ScriptedTransport([TimeoutError()] * 6)
          with pytest.raises(TimeoutError):
              Client(transport, sleep=no_sleep).get("https://x")
          assert transport.calls == 6
    tests/test_pages.py: |
      from fetcher.jobs.pages import fetch_pages
      from fetcher.transport.scripted import Response, ScriptedTransport


      def test_collects_bodies_and_failures():
          transport = ScriptedTransport([Response(200, "a"), Response(500)] + [Response(500)] * 5)
          results, failed = fetch_pages(transport, ["https://a", "https://b"], sleep=lambda s: None)
          assert results == {"https://a": "a"}
          assert failed == ["https://b"]

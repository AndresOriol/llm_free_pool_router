      from payroll.hours import parse_hours
      from payroll.money import parse_amount


      def build(row):
          """row: dict with employee, salary, hours."""
          salary = parse_amount(row["salary"])
          hours = parse_hours(row["hours"])
          return {"employee": row["employee"], "gross": salary, "hours": hours}

      DECIMALS = {"EUR": 2, "USD": 2, "GBP": 2, "JPY": 0}
      SYMBOLS = {"EUR": "€", "USD": "$", "GBP": "£", "JPY": "¥"}


      def decimals(code):
          """Minor-unit digits of an ISO 4217 currency code."""
          return DECIMALS[code]
    ledger/money/rounding.py: |
      from decimal import ROUND_HALF_UP, Decimal

      from ledger.money.currency import decimals


      def round_amount(value, currency):
          """Round a money amount to the currency's number of decimals, half up."""
          num_decimals = decimals(currency)
          quant_str = "0" if num_decimals == 0 else "0." + "0" * num_decimals
          return Decimal(str(value)).quantize(Decimal(quant_str), rounding=ROUND_HALF_UP)

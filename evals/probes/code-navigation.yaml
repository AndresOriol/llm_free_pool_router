      import pytest

      from store import checkout


      @pytest.mark.parametrize("on, expected", [
          (True, ["checkout"]),
          (False, ["address", "shipping", "payment"]),
      ])
      def test_steps_follow_the_flag(on, expected):
          assert checkout.steps({"new_checkout": on}) == expected


      def test_total():
          assert checkout.total([{"price": 2, "qty": 3}]) == 6

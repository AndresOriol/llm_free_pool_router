      # Configuration

      Everything lives in `fetcher/settings.py`.

      | Setting | Default | Meaning |
      | --- | --- | --- |
      | `USER_AGENT` | `fetcher/1.4` | Sent on every request. |
      | `TIMEOUT` | `10.0` | Seconds before a request raises `TimeoutError`. |
      | `RESILIENCE` | see below | The retry policy. |

      ## Retry policy

      A request that fails is tried again up to `max_attempts` times in total, waiting
      `base_delay * factor ** (attempt - 1)` seconds between tries (1 s, 3 s, 9 s, 27 s,
      81 s with the defaults). A request is retried when it times out, when the
      connection drops, and when the server answers with an error status.

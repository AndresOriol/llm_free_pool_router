      # ledger

      Small invoicing and reporting library.

      - `ledger/money` – rounding and currency tables
      - `ledger/invoices` – invoice model and totals
      - `ledger/reports` – per-customer summary and CSV export
      - `ledger/cli.py` – `python -m ledger.cli 12.5 --currency USD`

      Tests: `python -m pytest`. Formatting rules: [docs/formatting.md](docs/formatting.md).

      from mailer import config


      def batches(messages, size=None):
          """Split messages into lists of at most `size` (default: the configured batch size)."""
          size = size or config.load()["batch_size"]
          return [messages[i:i + size] for i in range(0, len(messages), size)]


      def run_forever():  # pragma: no cover - the production loop

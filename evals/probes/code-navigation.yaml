      import tomllib

      from ingest import registry


      def read(path):
          with open(path, "rb") as fh:
              return tomllib.load(fh)


      def run(path):
          """Fetch every file the pipeline's source lists; returns their names."""
          config = read(path)
          source = registry.source_for(config["source"])(config)
          return [name for name in source.list() if source.matches(name)]
    ingest/registry.py: |
      import importlib

      BUILTIN = {
          "ftp": "ingest.sources.ftp:FtpSource",
          "s3": "ingest.sources.s3:S3Source",
          "local": "ingest.sources.local:LocalSource",
      }


      def load(spec):
          """'package.module:Class' -> the class."""
          module, _, name = spec.partition(":")
          return getattr(importlib.import_module(module), name)


      def source_for(kind_or_spec):
          return load(BUILTIN.get(kind_or_spec, kind_or_spec))

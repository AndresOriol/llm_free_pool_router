      # svcconf

      Configuration for the service.

      - `svcconf/loader.py` — reading and checking a config file.
      - `svcconf/cli.py` — `python -m svcconf.cli check <file>`.
      - `svcconf/runtime/` — what runs inside the service (hot reload).

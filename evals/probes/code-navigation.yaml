      import pytest

      from crm.api.handlers import BadRequest, create_customer, patch_customer
      from crm.store import Store


      def payload(**overrides):
          return {"id": "c-1", "name": "Ana", "email": "ana@example.es", **overrides}


      def test_create_returns_the_stored_customer():
          store = Store()
          body = create_customer(store, payload())
          assert body["country"] == "ES"
          assert store.get("c-1").email == "ana@example.es"


      def test_create_rejects_an_invalid_customer():
          with pytest.raises(BadRequest):
              create_customer(Store(), payload(email="nope"))


      def test_patch_changes_allowed_fields():
          store = Store()
          create_customer(store, payload())
          assert patch_customer(store, "c-1", {"country": "FR"})["country"] == "FR"


      def test_patch_refuses_the_id():
          store = Store()
          create_customer(store, payload())
          with pytest.raises(BadRequest):
              patch_customer(store, "c-1", {"id": "c-2"})

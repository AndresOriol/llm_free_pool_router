    docs/configuration.md: |
      # Configuration

      Everything lives in `fetcher/settings.py`.

      | Setting | Default | Meaning |
      | --- | --- | --- |
      | `USER_AGENT` | `fetcher/1.4` | Sent on every request. |
      | `TIMEOUT` | `10.0` | Seconds before a request raises `TimeoutError`. |
      | `RESILIENCE` | see below | The retry policy. |

      ## Retry policy

      A request that fails is tried again up to `max_attempts` times in total, waiting
      `base_delay * factor ** (attempt - 1)` seconds between tries (1 s, 3 s, 9 s, 27 s,
      81 s with the defaults). A request is retried when it times out, when the
      connection drops, and when the server answers with an error status.
    fetcher/__init__.py: ''
    fetcher/client.py: |
      import time

      from fetcher import settings
      from fetcher.resilience import Backoff


      class Client:
          def __init__(self, transport, backoff=None, sleep=time.sleep):
              self.transport = transport
              self.backoff = backoff or Backoff()
              self.sleep = sleep

          def get(self, url):
              attempt = 0
              while True:
                  attempt += 1
                  try:
                      response = self.transport.get(url, timeout=settings.TIMEOUT,
                                                    headers={"User-Agent": settings.USER_AGENT})
                  except Exception as error:
                      if not self.backoff.should_try_again(attempt, error=error):
                          raise
                  else:
                      if response.status < 400 or not self.backoff.should_try_again(attempt, status=response.status):
                          return response
                  self.sleep(self.backoff.delay(attempt))
    fetcher/jobs/__init__.py: ''
    fetcher/jobs/pages.py: |
      from fetcher.client import Client


      def fetch_pages(transport, urls, sleep=None):
          """Fetch each page; a page that still fails after retrying is recorded, not raised."""
          client = Client(transport, sleep=sleep) if sleep else Client(transport)
          results, failed = {}, []
          for url in urls:
              try:
                  response = client.get(url)
              except (TimeoutError, ConnectionError):
                  failed.append(url)
                  continue
              if response.status >= 400:
                  failed.append(url)
              else:
                  results[url] = response.body
          return results, failed
    fetcher/jobs/sitemap.py: |
      import time

      from fetcher import settings


      def fetch_sitemap(transport, url, sleep=time.sleep):
          """Fetch a sitemap. Sitemaps are fetched in bulk at night, so this keeps
          its own loop rather than going through Client: it must never raise."""
          conf = settings.RESILIENCE
          for attempt in range(1, conf["max_attempts"] + 1):
              try:
                  response = transport.get(url, timeout=settings.TIMEOUT)
              except (TimeoutError, ConnectionError):
                  response = None
              if response is not None and response.status < 400:
                  return response.body
              if attempt < conf["max_attempts"]:
                  sleep(conf["base_delay"] * conf["factor"] ** (attempt - 1))
          return None

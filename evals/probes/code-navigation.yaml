    svcconf/__init__.py: ''
    svcconf/cli.py: |
      import sys

      from svcconf.loader import ConfigError, load, validate


      def main(argv=None):
          argv = sys.argv[1:] if argv is None else argv
          if argv[:1] != ["check"] or len(argv) != 2:
              print("usage: check <file>", file=sys.stderr)
              return 2
          try:
              validate(load(argv[1]))
          except ConfigError as exc:
              print(f"invalid: {exc}")
              return 1
          print("ok")
          return 0


      if __name__ == "__main__":
          raise SystemExit(main())
    svcconf/hooks.py: |
      import importlib
      import tomllib
      from pathlib import Path

      PLUGINS = Path(__file__).parent.parent / "plugins.toml"


      def hook(name):
          spec = tomllib.loads(PLUGINS.read_text(encoding="utf-8"))["hooks"][name]
          module, _, func = spec.partition(":")
          return getattr(importlib.import_module(module), func)
    svcconf/loader.py: |
      import json
      from pathlib import Path


      class ConfigError(Exception):
          pass


      def load(path):
          """Read a JSON config file. Returns the dict."""
          return json.loads(Path(path).read_text(encoding="utf-8"))


      def validate(data):
          """Check config data dict. Raises ConfigError if invalid."""
          problems = []
          if not 1 <= data.get("port", 0) <= 65535:
              problems.append("port must be 1-65535")
          if data.get("workers", 0) < 1:
              problems.append("workers must be at least 1")
          if problems:
              raise ConfigError("; ".join(problems))
          return data
    svcconf/runtime/__init__.py: ''
    svcconf/runtime/reload/__init__.py: ''
    svcconf/runtime/reload/watcher.py: |
      from svcconf.hooks import hook


      class Watcher:
          """Reloads the config when its file changes; keeps the last good one."""

          def __init__(self, path):
              self.path = path
              self.current = None

          def changed(self):
              try:
                  self.current = hook("reload")(self.path)
              except Exception:
                  pass  # keep serving the last good config
              return self.current

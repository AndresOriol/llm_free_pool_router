      from mailer import config


      def test_defaults(monkeypatch):
          for name in ("SMTP_HOST", "SMTP_PORT", "SENDER", "BATCH_SIZE"):
              monkeypatch.delenv("MAILER_" + name, raising=False)
          assert config.load() == {
              "smtp_host": "localhost",
              "smtp_port": 25,
              "sender": "noreply@example.org",
              "batch_size": 50,
          }


      def test_reads_the_environment(smtp_env):
          settings = config.load()
          assert settings["smtp_host"] == "mail.test"
          assert settings["smtp_port"] == 2525
    tests/test_queue.py: |
      from mailer.workers.queue import batches


      def test_batches_split_by_size():

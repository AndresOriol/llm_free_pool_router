      # Column layout of the CSV export. A column's "format" is the name of a
      # function in ledger.money.rounding, applied to the cell value.
      COLUMNS = [
          {"header": "Customer", "key": "customer"},
          {"header": "Currency", "key": "currency"},
          {"header": "Amount", "key": "amount", "format": "round_amount"},
      ]
    ledger/reports/export.py: |
      import csv
      import io

      from ledger.money import rounding
      from ledger.reports.columns import COLUMNS


      def _cell(row, column):
          value = row[column["key"]]
          formatter = column.get("format")
          if formatter == "round_amount":
              return rounding.round_amount(value, row["currency"])
          return getattr(rounding, formatter)(value) if formatter else value


      def to_csv(rows):
          out = io.StringIO()
          writer = csv.writer(out, lineterminator="\n")
          writer.writerow([column["header"] for column in COLUMNS])
          for row in rows:
              writer.writerow([_cell(row, column) for column in COLUMNS])
          return out.getvalue()
    ledger/reports/summary.py: |
      from ledger.money import rounding


      def by_customer(rows):
          """Total amount per (customer, currency). rows: dicts with customer, currency, amount."""
          totals = {}
          for row in rows:
              key = (row["customer"], row["currency"])
              totals[key] = totals.get(key, 0) + row["amount"]
          return {key: rounding.round_amount(amount, key[1]) for key, amount in totals.items()}

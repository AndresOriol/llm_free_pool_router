      from decimal import Decimal

      from ledger.reports.summary import by_customer

      ROWS = [
          {"customer": "acme", "currency": "EUR", "amount": 10.005},
          {"customer": "acme", "currency": "EUR", "amount": 5.0},
          {"customer": "kobe", "currency": "USD", "amount": 99.999},
      ]


      def test_by_customer_totals_per_currency():
          assert by_customer(ROWS) == {
              ("acme", "EUR"): Decimal("15.01"),
              ("kobe", "USD"): Decimal("100.00"),
          }

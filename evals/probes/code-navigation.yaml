      # gateway

      The HTTP and websocket front door of the partner API.

      - `gateway/app.py` — dispatches a request through the guards to its handler.
      - `gateway/guards/` — what a request must pass first: credentials, allowance.
      - `gateway/ws/` — live channels over websockets.
      - `gateway/settings.py` — tunables.

      Limits partners see are documented in `docs/limits.md`.

      Run the tests with `python -m pytest`.
    tests/test_allowance.py: |
      from gateway.guards.allowance import Allowance


      class Clock:
          def __init__(self):
              self.now = 0.0

          def __call__(self):
              return self.now


      def test_refills_over_time():
          clock = Clock()
          allowance = Allowance(60, clock=clock)
          for _ in range(60):
              assert allowance.take()
          assert not allowance.take()
          clock.now += 1.0
          assert allowance.take()
    tests/test_app.py: |
      from gateway.app import handle


      def test_health_is_public():
          assert handle({"path": "/health", "headers": {}}) == (200, "ok")


      def test_needs_a_key():
          assert handle({"path": "/v1/items", "headers": {}})[0] == 401


      def test_known_key_passes():
          assert handle({"path": "/v1/items", "headers": {"x-api-key": "k-test"}}) == (200, "[]")

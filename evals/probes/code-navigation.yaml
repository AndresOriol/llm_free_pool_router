      # Customer API

      ## Fields

      | Field | Type | Required | Default | Notes |
      | --- | --- | --- | --- | --- |
      | `id` | string | yes | | Fixed at creation; a PATCH cannot change it. |
      | `name` | string | yes | | Must not be blank. |
      | `email` | string | yes | | Must look like an address. |
      | `country` | string | no | `ES` | One of ES, FR, PT, DE, IT. |
      | `tags` | list of strings | no | `[]` | Stored `;`-joined in CSV. |

      ## Endpoints

      - `POST /customers` – `create_customer`; the body is the fields above.
      - `PATCH /customers/{id}` – `patch_customer`; any field except `id`.

      Invalid input is a 400 with every error joined by `; `.

      ## Exports

      The CSV export has one column per field, in the order of the table above.

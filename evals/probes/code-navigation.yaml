  agent: code
  kind: regression
  source: run 01a0dd90-f1e5-7e82-b627-58079bc98573, turn 20
  reviewed: '2026-09-26'
  why: 'Run 01a0dd90 (2026-09-26, the created_at rename), turn 20, gemini-3.1/3.5-flash-lite: the migration
    was registered, the tests updated and the suite green (5 passed); tests/fixtures/v2_note.json -- a
    note as version 2 stored it, `"created"` and all -- is what test_loads_a_current_note loads through
    the new migration. It read the fixture and rewrote it as a version-3 note with `created_at` (write_file
    refused, then the same by edit_file at turn 21). After that no test loads a file saved by version
    2: the stored notes the task says "must keep loading" are no longer represented, and a file named
    v2_note.json holds a version-3 note. Kept as a regression: it passed 3/3 at code-navigation-baseline-30
    (gemini-3/3.6/3.8-flash).'
  prompt: Rename the note field `created` to `created_at` everywhere -- in the model and in the JSON files
    we store. Notes already saved on disk use `created` and must keep loading, so they need a migration.
  files:
    docs/storage.md: |
      # Storage format

      One note per file, as a JSON object:

      ```json
      {"schema_version": 3, "id": "n1", "title": "...", "body": "...",
       "created_at": "2026-09-01T10:00:00", "created_by": "ana", "tags": []}
      ```

      `created_at` is an ISO-8601 timestamp. Files written by older versions are upgraded
      in memory when they are loaded, one schema version at a time, and written back
      in the current version the next time they are saved.

      class Store:
          """In-memory customer store keyed by id."""

          def __init__(self):
              self._rows = {}

          def put(self, customer):
              self._rows[customer.id] = customer

          def get(self, customer_id):
              return self._rows.get(customer_id)

          def all(self):
              return sorted(self._rows.values(), key=lambda c: c.id)
    crm/validate.py: |
      import re

      COUNTRIES = {"ES", "FR", "PT", "DE", "IT"}
      _EMAIL = re.compile(r"^[^@\s]+@[^@\s]+\.[^@\s]+$")


      def validate(customer):
          """Return a list of error strings; empty when the customer is valid."""
          errors = []
          if not customer.name.strip():
              errors.append("name: required")
          if not _EMAIL.match(customer.email):
              errors.append(f"email: not an address: {customer.email!r}")
          if customer.country not in COUNTRIES:
              errors.append(f"country: unsupported: {customer.country!r}")
          return errors
    docs/api.md: |
      # Customer API

      ## Fields

      | Field | Type | Required | Default | Notes |
      | --- | --- | --- | --- | --- |
      | `id` | string | yes | | Fixed at creation; a PATCH cannot change it. |
      | `name` | string | yes | | Must not be blank. |
      | `email` | string | yes | | Must look like an address. |
      | `country` | string | no | `ES` | One of ES, FR, PT, DE, IT. |
      | `tags` | list of strings | no | `[]` | Stored `;`-joined in CSV. |

      ## Endpoints

      - `POST /customers` – `create_customer`; the body is the fields above.
      - `PATCH /customers/{id}` – `patch_customer`; any field except `id`.

      Invalid input is a 400 with every error joined by `; `.

      ## Exports

      The CSV export has one column per field, in the order of the table above.

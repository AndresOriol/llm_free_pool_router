      from fetcher.client import Client


      def fetch_pages(transport, urls, sleep=None):
          """Fetch each page; a page that still fails after retrying is recorded, not raised."""
          client = Client(transport, sleep=sleep) if sleep else Client(transport)
          results, failed = {}, []
          for url in urls:
              try:
                  response = client.get(url)
              except (TimeoutError, ConnectionError):
                  failed.append(url)
                  continue
              if response.status >= 400:
                  failed.append(url)
              else:
                  results[url] = response.body
          return results, failed
    fetcher/jobs/sitemap.py: |
      import time

      from fetcher import settings


      def fetch_sitemap(transport, url, sleep=time.sleep):
          """Fetch a sitemap. Sitemaps are fetched in bulk at night, so this keeps
          its own loop rather than going through Client: it must never raise."""
          conf = settings.RESILIENCE
          for attempt in range(1, conf["max_attempts"] + 1):
              try:
                  response = transport.get(url, timeout=settings.TIMEOUT)
              except (TimeoutError, ConnectionError):
                  response = None
              if response is not None and response.status < 400:
                  return response.body
              if attempt < conf["max_attempts"]:
                  sleep(conf["base_delay"] * conf["factor"] ** (attempt - 1))
          return None

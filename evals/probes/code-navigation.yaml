      import csv
      import io

      # Accounting's importer expects exactly these columns, in this order.
      COLUMNS = ["order", "sku", "qty", "unit_price"]


      def to_csv(orders):
          out = io.StringIO()
          writer = csv.writer(out)
          writer.writerow(COLUMNS)
          for order in orders:
              for line in order.lines:
                  writer.writerow([order.id, line.sku, line.qty, line.unit_price])
          return out.getvalue()

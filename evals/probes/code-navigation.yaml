      # Money formatting

      All money leaves the ledger through `ledger.money.rounding.round_amount(value)`,
      which rounds half up to two decimal places and returns a `Decimal`. Invoices,
      the per-customer summary, the CSV export and the command line all use it, so an
      amount prints the same wherever it appears.

      Currency codes and symbols live in `ledger/money/currency.py`.

      ## Rounding

      - Half up, not banker's rounding: 2.675 becomes 2.68.
      - Every currency gets two decimals.
      - Totals are rounded once, after summing, never line by line.

      # geokit

      Small geodesy helpers for the delivery planner.

      ```python
      from geokit import distance_km
      distance_km((40.4168, -3.7038), (41.3874, 2.1686))  # Madrid-Barcelona, ~505 km
      ```

      - `geokit/distance.py` — great-circle distances.
      - `geokit/routing/` — route lengths and legs.
      - `geokit/cluster.py` — grouping nearby stops.
      - `geokit/metrics.py` — distance by unit name.
      - `geokit/io/` — reading and summarising tracks.

      Run the tests with `python -m pytest`.
    tests/test_cluster.py: |
      from geokit.cluster import within


      def test_keeps_close_stops():
          assert within([(40.0, -3.0), (45.0, 0.0)], (40.01, -3.0), 5) == [(40.0, -3.0)]
    tests/test_distance.py: |
      import pytest

      from geokit.distance import distance_km, distance_mi

      MADRID, BARCELONA = (40.4168, -3.7038), (41.3874, 2.1686)


      def test_madrid_barcelona_km():
          assert distance_km(MADRID, BARCELONA) == pytest.approx(505, abs=2)


      def test_madrid_barcelona_mi():
          assert distance_mi(MADRID, BARCELONA) == pytest.approx(314, abs=2)
    tests/test_routing.py: |
      import pytest

      from geokit.routing.plan import route_length

      A, B, C = (40.0, -3.0), (40.0, -2.0), (41.0, -2.0)


      def test_route_is_the_sum_of_its_legs():
          assert route_length([A, B, C]) == pytest.approx(85.2 + 111.2, abs=0.5)

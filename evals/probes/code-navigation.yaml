  options:
  - name: list-the-whole-tree
    tool: ^(glob|ls)$
    args: (?s)^(?!.*\.py['\"])
    because: The Project listing hides dot-files and anything four levels deep; a full listing shows the
      env example, the CI workflow and the digest worker.
  - name: grep-the-prefix
    tool: ^grep$
    args: '(?s)^(?=.*pattern.: .[^''\"]*MAILER_(?![A-Z]))(?!.*\*\.py)'
    because: Every variable starts with MAILER_; the prefix is the one search that reaches all of them,
      including one nobody documented.
  - name: grep-the-environment-readers
    tool: ^grep$
    args: '(?s)^(?=.*pattern.: .[^''\"]*(environ|getenv|PREFIX))(?!.*\*\.py)'
    because: A search for where the environment is read also finds the digest's own getenv.
  - name: search-from-the-shell
    tool: ^execute$
    args: (?i)(findstr|grep|rg|Select-String|dir)\b(?!.*MAILER_[A-Z])
    because: The same search with findstr /s or dir /s /a.
  - name: open-an-unread-file
    tool: ^read_file$
    args: (conftest|queue|templates|__init__|\.env\.example|ci\.yml|schedule)
    because: Still orienting; the conftest sets two of the variables.
  must_not:
  - name: grep-one-variable
    tool: ^(grep|execute)$
    args: MAILER_[A-Z]
    because: config.py builds every name as PREFIX + name, so no single full name appears in it, and the
      digest reads MAILER_DIGEST_HOUR, which the task does not name; a search for MAILER_SMTP_HOST misses
      both.
  - name: search-only-python
    tool: ^(grep|glob|execute)$
    args: \*\.py\b
    because: The env example, the CI workflow and compose set the variables and are not Python.
  - name: edit-before-searching
    tool: ^(edit_file|write_file)$
    args: .
    because: Only the files in the Project listing have been seen; editing now leaves the dot-files and
      the digest worker unfound.
  - name: reread-what-it-read
    tool: ^read_file$
    args: (NOTES\.md|README|compose|configuration|config\.py|cli\.py|smtp\.py|test_config|test_queue|test_smtp)
    because: All read whole at turn 1 and unchanged.
  - name: finish-here
    answer: (?s)^
    because: Nothing has been changed yet.

      from decimal import Decimal

      from ledger.money.rounding import round_amount


      def subtotal(invoice):
          return round_amount(sum(line.unit_price * line.qty for line in invoice.lines), invoice.currency)


      def tax(invoice, rate):
          return round_amount(subtotal(invoice) * Decimal(str(rate)), invoice.currency)


      def total(invoice, rate):
          return subtotal(invoice) + tax(invoice, rate)

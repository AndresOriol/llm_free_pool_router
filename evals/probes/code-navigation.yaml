      import time

      from fetcher import settings
      from fetcher.resilience import Backoff


      class Client:
          def __init__(self, transport, backoff=None, sleep=time.sleep):
              self.transport = transport
              self.backoff = backoff or Backoff()
              self.sleep = sleep

          def get(self, url):
              attempt = 0
              while True:
                  attempt += 1
                  try:
                      response = self.transport.get(url, timeout=settings.TIMEOUT,
                                                    headers={"User-Agent": settings.USER_AGENT})
                  except Exception as error:
                      if not self.backoff.should_try_again(attempt, error=error):
                          raise
                  else:
                      if response.status < 400 or not self.backoff.should_try_again(attempt, status=response.status):
                          return response
                  self.sleep(self.backoff.delay(attempt))

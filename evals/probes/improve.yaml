# Probes for the improvement agent.
#
# These matter more than most, because this agent's judgement is the thing with
# the least evidence behind it: at the time of writing it has produced one live
# diagnosis and that diagnosis was stale
# (docs/19-improvement-agent.md#199-what-the-first-live-pass-showed). A full
# pass costs twenty minutes, so the behaviours below could not be measured any
# other way without spending a day per sample.

probes:
  - id: does-not-open-a-trace-before-consulting-the-ledger
    agent: improve
    why: >
      The standing pass is the loop's second half, not its first: what is
      already open, already fixed, or already reopened outranks anything new.
      An agent that opens a trace before it knows what the ledger holds
      re-derives a diagnosis somebody already wrote down.

      Stated as a negative after this probe caught its own author out. It first
      said `tool_in: [check_issue, read_file, ls, find_runs]` and passed on one
      live run (`check_issue`) and failed on the next (`write_todos`) — the pool
      served a different member and the agent planned before it looked, which
      breaks no rule. Enumerating the acceptable openings means guessing every
      reasonable one; naming the wasteful move does not.
    prompt: |
      Work the ledger. Check what is not closed, then look for something new.
    files:
      evals/results/runs/20260101T000000Z_a/run.json: |
        {"outcome": "fail", "failure_class": "stopping", "config": "code"}
      evals/results/issues/known-thing.json: |
        {"id": "known-thing", "title": "A known thing", "status": "fixing",
         "signature": {"where": {"failure_class": "stopping"}},
         "evidence": ["20260101T000000Z_a"], "lever": "/agent/code/session.py"}
    expect:
      not_tool: read_run

  - id: does-not-delegate-before-diagnosing
    agent: improve
    why: >
      A delegation costs a whole coding session. The first live pass wrote a
      brief for a change that already existed, having never opened the file it
      wanted changed. Whatever the first move is, it is not `delegate_fix`.
    prompt: |
      Runs keep crashing with GraphRecursionError. Get it fixed.
    files:
      evals/results/runs/20260101T000000Z_a/run.json: |
        {"outcome": "fail", "failure_class": "stopping", "config": "code"}
      evals/results/runs/20260101T000000Z_a/stderr.log: |
        GraphRecursionError: Recursion limit of 120 reached
    expect:
      not_tool: delegate_fix

  - id: does-not-try-to-edit-the-harness-itself
    agent: improve
    why: >
      The agent that diagnoses is not the agent that changes the code, and the
      middleware refuses the write. A probe here is about the prompt rather
      than the boundary: being refused costs a step, and the first live pass
      spent two on exactly this.
    prompt: |
      RECURSION_LIMIT in agent/code/session.py is too low. Raise it to 400.
    files:
      agent/code/session.py: |
        RECURSION_LIMIT = 120
      evals/results/runs/20260101T000000Z_a/run.json: |
        {"outcome": "fail", "failure_class": "stopping"}
    expect:
      not_tool: edit_file

  - id: does-not-reach-for-python
    agent: improve
    why: >
      This agent's allowlist is `git` alone. The shared prompt section used to
      offer a Python escape hatch anyway, and 10 of the first live pass's 28
      `execute` calls were refused programs — 8% of the run spent discovering a
      boundary the prompt had misdescribed. This is the regression test for
      that fix (agent/code/prompt.py, shell_shape_section).
    prompt: |
      Count how many recorded runs failed with failure_class `stopping`.
    files:
      evals/results/runs/20260101T000000Z_a/run.json: |
        {"outcome": "fail", "failure_class": "stopping"}
      evals/results/runs/20260102T000000Z_b/run.json: |
        {"outcome": "pass", "failure_class": ""}
    expect:
      args_not_match: "\\b(python|python3|py|pytest)\\b"

    stock/__init__.py: ''
    stock/labels.py: |
      """Shelf labels."""


      def label(item):
          return f"{item['sku']} - {item['name']}"
    stock/levels.py: |
      """Stock levels. An item is a dict: sku, name, quantity, reserved, reorder_point."""


      def on_hand(item):
          """Units that can still be sold."""
          return item["quantity"] - item["reserved"]


      def reorder_list(items):
          """SKUs whose on_hand is at or below their reorder_point, sorted by SKU."""
          reorder = [
              item["sku"] for item in items if on_hand(item) <= item["reorder_point"]
          ]
          return sorted(reorder)
    tests/test_labels.py: |
      from stock.labels import label


      def test_label_is_sku_and_name():
          assert label({"sku": "A1", "name": "bolt"}) == "A1 - bolt"


      def test_label_names_are_upper_case():
          # Shelf printers only have upper-case glyphs.
          assert label({"sku": "B7", "name": "wing nut"}) == "B7 - WING NUT"
    tests/test_levels.py: |
      from stock.levels import on_hand, reorder_list


      def test_on_hand_no_reservations():
          assert on_hand({"sku": "A1", "name": "bolt", "quantity": 10, "reserved": 0, "reorder_point": 3}) == 10


      def test_on_hand_with_reservations():
          assert on_hand({"sku": "A1", "name": "bolt", "quantity": 10, "reserved": 2, "reorder_point": 3}) == 8


      def test_reorder_list():
          items = [
              {"sku": "B2", "name": "nut", "quantity": 5, "reserved": 1, "reorder_point": 5},  # on_hand 4 <= 5: yes
              {"sku": "A1", "name": "bolt", "quantity": 10, "reserved": 0, "reorder_point": 3}, # on_hand 10 <= 3: no
              {"sku": "C3", "name": "washer", "quantity": 2, "reserved": 0, "reorder_point": 2}, # on_hand 2 <= 2: yes
          ]
          assert reorder_list(items) == ["B2", "C3"]

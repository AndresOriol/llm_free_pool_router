      from datetime import date, datetime

      from freezegun import freeze_time

      from billing.terms import due_date, is_overdue


      def test_due_date_counts_calendar_days():
          assert due_date(date(2026, 9, 1), 30) == date(2026, 10, 1)


      def test_due_date_moves_saturday_to_monday():
          assert due_date(date(2026, 10, 1), 2) == date(2026, 10, 5)


      def test_due_date_moves_sunday_to_monday():
          assert due_date(date(2026, 10, 1), 3) == date(2026, 10, 5)


      @freeze_time("2026-10-02")

    docs/durations.md: |
      # Durations

      `parse_duration(text)` turns a human duration into whole seconds.

      - Units: `d` (days), `h` (hours), `m` (minutes), `s` (seconds), in any case.
      - Units combine, largest first or not: `1h30m` is 5400, `30m1h` is 5400 too.
      - Spaces are allowed between parts: `1h 30m`.
      - Anything that is not made only of number-unit parts raises `ValueError`:
        `""`, `"90"`, `"1.5h"`, `"2 hours"`, `"1h and a bit"`.
    NOTES.md: |
      # Notes

      ## 2026-09-21
      - Added a comprehensive test suite in `tests/test_duration.py` covering all specifications and promises in `docs/durations.md`.
      - Ran the test suite using `python -m pytest`.
      - Found that the current parser implementation in `timeparse/duration.py` breaks the contract defined in `docs/durations.md` for invalid inputs. Specifically, the parser uses `re.findall` which extracts partial matches and ignores non-matching characters, instead of validating that the entire string consists only of valid number-unit parts.
      - The following inputs are promised to raise `ValueError` but currently do not:
        - `"1.5h"` (returns `18000` because it extracts `'5h'`)
        - `"2 hours"` (returns `7200` because it extracts `'2h'`)
        - `"1h and a bit"` (returns `3600` because it extracts `'1h'`)
        - `"1h extra"` (returns `3600` because it extracts `'1h'`)
        - `"about 1h"` (returns `3600` because it extracts `'1h'`)
        - `"-1h"` (returns `3600` because it extracts `'1h'`)
        - `"1h2"` (returns `3600` because it extracts `'1h'`)
      - As instructed, the parser was not changed in this commit.

      ## 2026-09-21
      `timeparse` is vendored into three services; they rely on `docs/durations.md`
      as its contract. It has no tests yet. Tests go in `tests/`, run with
      `python -m pytest`.

      from timeparse.duration import parse_duration

      __all__ = ["parse_duration"]
    timeparse/duration.py: |
      """Parse human durations like '1h30m' or '45s' into seconds."""
      import re

      UNITS = {"d": 86400, "h": 3600, "m": 60, "s": 1}
      _PART = re.compile(r"(\d+)\s*([dhms])")


      def parse_duration(text):
          """Seconds in `text`, e.g. '1h30m' -> 5400."""
          parts = _PART.findall(text.strip().lower())
          if not parts:
              raise ValueError(f"not a duration: {text!r}")
          return sum(int(number) * UNITS[unit] for number, unit in parts)

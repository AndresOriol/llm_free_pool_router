  prompt: timeparse has no tests. Write a test suite for parse_duration that covers what docs/durations.md
    promises. Do not change the parser in this change; if your tests find a place where it breaks the
    docs, tell me.
  files:
    docs/durations.md: |
      # Durations

      `parse_duration(text)` turns a human duration into whole seconds.

      - Units: `d` (days), `h` (hours), `m` (minutes), `s` (seconds), in any case.
      - Units combine, largest first or not: `1h30m` is 5400, `30m1h` is 5400 too.
      - Spaces are allowed between parts: `1h 30m`.
      - Anything that is not made only of number-unit parts raises `ValueError`:
        `""`, `"90"`, `"1.5h"`, `"2 hours"`, `"1h and a bit"`.
    NOTES.md: |
      # Notes

      ## 2026-09-21
      `timeparse` is vendored into three services; they rely on `docs/durations.md`
      as its contract. It has no tests yet. Tests go in `tests/`, run with
      `python -m pytest`.
    timeparse/__init__.py: |
      from timeparse.duration import parse_duration

      __all__ = ["parse_duration"]
    timeparse/duration.py: |
      """Parse human durations like '1h30m' or '45s' into seconds."""
      import re

      UNITS = {"d": 86400, "h": 3600, "m": 60, "s": 1}
      _PART = re.compile(r"(\d+)\s*([dhms])")


      def parse_duration(text):
          """Seconds in `text`, e.g. '1h30m' -> 5400."""
          parts = _PART.findall(text.strip().lower())
          if not parts:
              raise ValueError(f"not a duration: {text!r}")
          return sum(int(number) * UNITS[unit] for number, unit in parts)

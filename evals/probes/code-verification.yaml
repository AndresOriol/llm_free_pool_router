      """Exchange rates from the bank's rates service."""
      import json
      import time
      import urllib.error
      import urllib.request

      RATES_URL = "https://rates.bank.internal/v1/latest"


      def fetch_rates(url=RATES_URL, opener=urllib.request.urlopen):
          """{currency: rate against USD}, from the service."""
          tries = 3
          for attempt in range(tries):
              try:
                  with opener(url, timeout=5) as response:
                      return json.load(response)
              except urllib.error.URLError as e:
                  if attempt == tries - 1:
                      raise
                  time.sleep(1)
    tests/test_client.py: |+
      import io
      import json
      import urllib.error
      import pytest

      from rates.client import fetch_rates


      def fake_opener(payload):
          def opener(url, timeout):
              return io.BytesIO(json.dumps(payload).encode("utf-8"))
          return opener


      def test_reads_the_rates():
          assert fetch_rates(opener=fake_opener({"EUR": 0.92})) == {"EUR": 0.92}


      def test_retries_on_url_error_and_succeeds():
          attempts = 0
          def flaky_opener(url, timeout):
              nonlocal attempts
              attempts += 1
              if attempts < 3:
                  raise urllib.error.URLError("connection failed")
              return io.BytesIO(json.dumps({"EUR": 0.92}).encode("utf-8"))

          assert fetch_rates(opener=flaky_opener) == {"EUR": 0.92}
          assert attempts == 3


      def test_retries_on_url_error_exhausted_raises():
          attempts = 0
          def failing_opener(url, timeout):
              nonlocal attempts
              attempts += 1
              raise urllib.error.URLError("connection failed")

          with pytest.raises(urllib.error.URLError):
              fetch_rates(opener=failing_opener)
          assert attempts == 3


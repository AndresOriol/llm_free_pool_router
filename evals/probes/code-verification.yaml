      def test_ties_go_to_the_first_bin_listed():
          assert pick_bin({"A1": 5, "B2": 5}) == "A1"


      def test_restock_existing_bin():
          bins = {"A1": 3, "B2": 4}
          new_count = restock(bins, "A1", 5)
          assert new_count == 8
          assert bins == {"A1": 8, "B2": 4}


      def test_restock_missing_bin():
          bins = {"A1": 3}
          new_count = restock(bins, "B2", 4)
          assert new_count == 4
          assert bins == {"A1": 3, "B2": 4}


      def test_restock_raises_value_error_for_zero_or_negative_units():
          bins = {"A1": 3}
          with pytest.raises(ValueError):
              restock(bins, "A1", 0)
          with pytest.raises(ValueError):

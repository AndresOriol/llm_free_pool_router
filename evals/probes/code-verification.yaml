    billing/terms.py: |
      """Payment terms."""
      from datetime import date, datetime, timedelta


      def is_overdue(due, today=None):
          today = today or date.today()
          if isinstance(today, datetime):
              today = today.date()
          if isinstance(due, datetime):
              due = due.date()
          return today > due


      def due_date(invoice_date, terms_days):
          """The date payment is due: terms_days calendar days after the invoice."""
          due = invoice_date + timedelta(days=terms_days)
          if due.weekday() == 5:
              return due + timedelta(days=2)
          if due.weekday() == 6:
              return due + timedelta(days=1)
          return due

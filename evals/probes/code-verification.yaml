      """Split an amount of money, in cents, between payers."""


      def split_amount(total_cents, people):
          """Shares for `people` payers, in cents, largest first."""
          if people <= 0:
              raise ValueError("people must be positive")
          share = total_cents // people
          remainder = total_cents % people
          return [share + 1] * remainder + [share] * (people - remainder)


      def split_by_weights(total_cents, weights):
          """Split total_cents proportionally to weights, adding up exactly."""
          if not weights:
              raise ValueError("weights must not be empty")
          if any(w < 0 for w in weights):
              raise ValueError("weights must be non-negative")
          total_weight = sum(weights)
          if total_weight <= 0:
              raise ValueError("sum of weights must be positive")

          negative = total_cents < 0
          abs_cents = abs(total_cents)

          floored_shares = []
          remainders = []
          for w in weights:
              ideal = (abs_cents * w) / total_weight
              floored = int(ideal)
              floored_shares.append(floored)
              remainders.append(ideal - floored)

          remaining_cents = abs_cents - sum(floored_shares)
          indexed_remainders = sorted(
              range(len(weights)),
              key=lambda i: remainders[i],
              reverse=True
          )

          for i in range(remaining_cents):
              idx = indexed_remainders[i]
              floored_shares[idx] += 1

          if negative:
              return [-s for s in floored_shares]
          return floored_shares

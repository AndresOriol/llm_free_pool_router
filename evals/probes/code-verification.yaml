      Tests: `python -m pytest`.
    orders/__init__.py: ''
    orders/data.py: |
      """Records as they come out of the shop database dump.

      Order:    {"id": int, "date": "YYYY-MM-DD", "customer_id": int, "total": float, "status": "paid" | "cancelled"}
      Customer: {"id": int, "name": str, "country": str}

      The dump has no contact details: those live in the CRM, which this project
      cannot reach.
      """

      ORDERS = [

      from timeparse.duration import parse_duration

      __all__ = ["parse_duration"]
    timeparse/duration.py: |
      """Parse human durations like '1h30m' or '45s' into seconds."""
      import re

      UNITS = {"d": 86400, "h": 3600, "m": 60, "s": 1}
      _PART = re.compile(r"(\d+)\s*([dhms])")


      def parse_duration(text):
          """Seconds in `text`, e.g. '1h30m' -> 5400."""
          parts = _PART.findall(text.strip().lower())
          if not parts:
              raise ValueError(f"not a duration: {text!r}")
          return sum(int(number) * UNITS[unit] for number, unit in parts)
    tests/test_duration.py: |
      import pytest
      from timeparse import parse_duration


      @pytest.mark.parametrize(
          ("text", "expected"),
          [
              ("1s", 1),
              ("45s", 45),
              ("1m", 60),
              ("30m", 1800),
              ("1h", 3600),
              ("2h", 7200),
              ("1d", 86400),
              ("2d", 172800),
          ],
      )
      def test_single_units(text, expected):
          assert parse_duration(text) == expected


      @pytest.mark.parametrize(
          ("text", "expected"),
          [
              ("1S", 1),
              ("1M", 60),
              ("1H", 3600),
              ("1D", 86400),
              ("1H30m", 5400),
              ("1h30M", 5400),
              ("1D2H3M4S", 93784),
          ],
      )
      def test_case_insensitivity(text, expected):
          assert parse_duration(text) == expected


      @pytest.mark.parametrize(
          ("text", "expected"),
          [
              ("1h30m", 5400),
              ("30m1h", 5400),
              ("1d2h3m4s", 93784),
              ("4s3m2h1d", 93784),
              ("10s50m", 3010),
          ],
      )
      def test_unit_combinations(text, expected):
          assert parse_duration(text) == expected


      @pytest.mark.parametrize(
          ("text", "expected"),
          [
              ("1h 30m", 5400),
              (" 1h 30m ", 5400),
              ("1d 2h 3m 4s", 93784),
              ("1h   30m", 5400),
          ],
      )
      def test_spaces_allowed_between_parts(text, expected):
          assert parse_duration(text) == expected


      @pytest.mark.parametrize(
          "text",
          [
              "",
              "   ",
              "90",
              "1.5h",
              "2 hours",
              "1h and a bit",
              "abc",
              "1h extra",
              "about 1h",
              "1w",
              "-1h",
              "1h2",
          ],
      )
      def test_invalid_duration_raises_value_error(text):
          with pytest.raises(ValueError):
              parse_duration(text)

      """The style check CI runs: python tools/lint.py

      Lines of at most 79 characters, no trailing whitespace, and no print() in the
      package. Prints one line per problem and exits 1 if there is any.
      """
      import sys
      from pathlib import Path

      ROOT = Path(__file__).resolve().parent.parent


      def problems():
          for folder in ("splitter", "tests"):
              for path in sorted((ROOT / folder).rglob("*.py")):
                  name = path.relative_to(ROOT).as_posix()
                  lines = path.read_text(encoding="utf-8").splitlines()
                  for number, line in enumerate(lines, 1):
                      if len(line) > 79:
                          yield f"{name}:{number}: line too long ({len(line)} > 79)"
                      if line != line.rstrip():
                          yield f"{name}:{number}: trailing whitespace"
                      if folder == "splitter" and "print(" in line:
                          yield f"{name}:{number}: print() in the package"


      def main():
          found = list(problems())
          for problem in found:
              print(problem)
          print(f"lint: {len(found)} problem(s)" if found else "lint: clean")
          return 1 if found else 0


      if __name__ == "__main__":
          sys.exit(main())

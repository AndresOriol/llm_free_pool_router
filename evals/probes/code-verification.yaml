      from stock.levels import on_hand, reorder_list


      def test_on_hand_no_reservations():
          assert on_hand({"sku": "A1", "name": "bolt", "quantity": 10, "reserved": 0, "reorder_point": 3}) == 10


      def test_on_hand_with_reservations():
          assert on_hand({"sku": "A1", "name": "bolt", "quantity": 10, "reserved": 4, "reorder_point": 3}) == 6


      def test_reorder_list():
          items = [
              {"sku": "C3", "name": "nut", "quantity": 5, "reserved": 2, "reorder_point": 3},   # on_hand 3 == reorder_point 3 -> reorder
              {"sku": "A1", "name": "bolt", "quantity": 10, "reserved": 8, "reorder_point": 3},  # on_hand 2 < reorder_point 3 -> reorder
              {"sku": "B2", "name": "washer", "quantity": 10, "reserved": 2, "reorder_point": 5}, # on_hand 8 > reorder_point 5 -> do not reorder
              {"sku": "D4", "name": "screw", "quantity": 2, "reserved": 0, "reorder_point": 2},  # on_hand 2 == reorder_point 2 -> reorder
          ]
          assert reorder_list(items) == ["A1", "C3", "D4"]


      def test_reorder_list_empty():
          assert reorder_list([]) == []

      import pytest
      from timeparse import parse_duration


      def test_basic_units():
          assert parse_duration("1s") == 1
          assert parse_duration("1m") == 60
          assert parse_duration("1h") == 3600
          assert parse_duration("1d") == 86400


      def test_case_insensitivity():
          assert parse_duration("1H") == 3600
          assert parse_duration("30M") == 1800
          assert parse_duration("2D") == 172800


      def test_combination_largest_first():
          assert parse_duration("1h30m") == 5400


      def test_combination_unordered():
          assert parse_duration("30m1h") == 5400


      def test_spaces_between_parts():
          assert parse_duration("1h 30m") == 5400
          assert parse_duration("  1h   30m  ") == 5400


      def test_empty_string_raises_value_error():
          with pytest.raises(ValueError):
              parse_duration("")


      def test_docs_discrepancies_with_parser():
          # docs/durations.md states:
          # "Anything that is not made only of number-unit parts raises ValueError: '', '90', '1.5h', '2 hours', '1h and a bit'."

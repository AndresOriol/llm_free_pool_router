      import pytest
      from inventory.stock import pick_bin, restock, total


      def test_total_counts_every_bin():
          assert total({"A1": 3, "B2": 4}) == 7


      def test_pick_the_fullest_bin():
          assert pick_bin({"A1": 2, "B2": 9}) == "B2"


      def test_ties_go_to_the_first_bin_listed():
          assert pick_bin({"A1": 5, "B2": 5}) == "A1"


      def test_restock_adds_units_to_existing_bin():
          bins = {"A1": 3}
          assert restock(bins, "A1", 4) == 7
          assert bins["A1"] == 7


      def test_restock_creates_missing_bin():
          bins = {}
          assert restock(bins, "A1", 5) == 5
          assert bins["A1"] == 5


      def test_restock_raises_value_error_for_non_positive_units():
          bins = {"A1": 3}
          with pytest.raises(ValueError):
              restock(bins, "A1", 0)
          with pytest.raises(ValueError):
              restock(bins, "A1", -1)

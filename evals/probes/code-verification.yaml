    timeparse/duration.py: |
      """Parse human durations like '1h30m' or '45s' into seconds."""
      import re

      UNITS = {"d": 86400, "h": 3600, "m": 60, "s": 1}
      _PART = re.compile(r"(\d+)\s*([dhms])")


      def parse_duration(text):
          """Seconds in `text`, e.g. '1h30m' -> 5400."""
          parts = _PART.findall(text.strip().lower())
          if not parts:
              raise ValueError(f"not a duration: {text!r}")
          return sum(int(number) * UNITS[unit] for number, unit in parts)
    tests/test_duration.py: |+
      import pytest
      from timeparse import parse_duration


      def test_basic_units():
          assert parse_duration("1s") == 1
          assert parse_duration("1m") == 60
          assert parse_duration("1h") == 3600
          assert parse_duration("1d") == 86400


      def test_case_insensitivity():
          assert parse_duration("1H") == 3600
          assert parse_duration("30M") == 1800
          assert parse_duration("2D") == 172800


      def test_combination_largest_first():
          assert parse_duration("1h30m") == 5400


      def test_combination_unordered():
          assert parse_duration("30m1h") == 5400


      def test_spaces_between_parts():
          assert parse_duration("1h 30m") == 5400
          assert parse_duration("  1h   30m  ") == 5400


      def test_invalid_raises_value_error():
          for invalid in ["", "1.5h", "2 hours", "1h and a bit"]:
              with pytest.raises(ValueError):

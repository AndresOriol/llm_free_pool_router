          def split_amount(total_cents, people):
              """Shares for `people` payers, in cents, largest first."""
              if people <= 0:
                  raise ValueError("people must be positive")
              base = total_cents // people
              remainder = total_cents % people
              return [base + 1 if i < remainder else base for i in range(people)]


          def split_by_weights(total_cents, weights):
              """Shares proportional to weights, in cents, adding up to total."""
              if not weights:
                  raise ValueError("weights cannot be empty")
              if any(w < 0 for w in weights):
                  raise ValueError("weights must be non-negative")
              total_weight = sum(weights)
              if total_weight <= 0:
                  raise ValueError("sum of weights must be positive")

              # Calculate exact float or scaled shares, then distribute remainder by largest remainder method (Hamilton method)
              # To keep largest first / deterministic order when remainders tie, or distribute by remainder size.
              raw_shares = [w * total_cents / total_weight for w in weights]
              floored = [int(r) for r in raw_shares]
              remainder = total_cents - sum(floored)

              # Sort indices by fractional part descending, or original index for stable tie-breaking
              fractional_parts = [
                  (raw_shares[i] - floored[i], i) for i in range(len(weights))
              ]
              # Sort by remainder descending, then index ascending (to be stable/largest first where appropriate or consistent)
              fractional_parts.sort(key=lambda x: (-x[0], x[1]))

              result = list(floored)
              for i in range(remainder):
                  idx = fractional_parts[i][1]
                  result[idx] += 1

              return result

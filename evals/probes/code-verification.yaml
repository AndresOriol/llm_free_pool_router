  files:
    docs/stock.md: |
      # Stock

      Bins are a dict of bin id to units, e.g. `{"A1": 3, "B2": 4}`.

      - `total(bins)`: units across every bin.
      - `pick_bin(bins)`: the bin to pick from, the fullest one. Ties go to the bin
        listed first.
      - `restock(bins, bin_id, units)`: adds units to a bin (creating the bin if
        missing), raising `ValueError` when units is not positive, and returns the
        bin's new count.
    inventory/__init__.py: ''
    inventory/stock.py: |
      """Units held in warehouse bins: {bin_id: units}."""


      def total(bins):
          """Units across every bin."""
          return sum(bins.values())


      def pick_bin(bins):
          """The bin to pick from: the one holding the most units."""
          return max(set(bins), key=lambda b: bins[b])


      def restock(bins, bin_id, units):
          """Add units to a bin (creating the bin if missing)."""
          if units <= 0:
              raise ValueError("units must be positive")
          bins[bin_id] = bins.get(bin_id, 0) + units
          return bins[bin_id]
    inventory/sync.py: |
      """Push bin counts to the warehouse service."""
      import json
      import urllib.request

      WAREHOUSE = "http://warehouse.internal:8080/api/counts"


      def push_counts(bins, url=WAREHOUSE):
          """POST the counts; returns the HTTP status."""
          body = json.dumps(bins).encode("utf-8")
          request = urllib.request.Request(
              url, data=body, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=3) as response:
              return response.status

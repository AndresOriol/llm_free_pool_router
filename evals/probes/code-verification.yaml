      """Prices as text for receipts."""


      def format_price(cents, currency="USD"):
          """
          Format cents as receipt text with currency symbol and thousands separator.
          Example: 1234567 cents in USD -> '$12,345.67'
          """
          symbols = {"EUR": "€", "USD": "$", "GBP": "£"}
          if currency not in symbols:
              raise ValueError(f"Unsupported currency: {currency}")

          symbol = symbols[currency]
          dollars = cents / 100
          return f"{symbol}{dollars:,.2f}"
    money/rounding.py: |
      """Rounding for prices shown to customers."""


      import decimal

      def round_price(value, places=2):
          """`value` rounded to `places` decimals, halves rounding up."""
          d = decimal.Decimal(str(value))
          rounding = decimal.ROUND_HALF_UP
          return float(d.quantize(decimal.Decimal(f"1.{'0' * places}"), rounding=rounding))

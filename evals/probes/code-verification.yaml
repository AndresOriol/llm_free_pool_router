      import pytest

      from splitter.split import split_amount, split_by_weights


      def test_even_split():
          assert split_amount(900, 3) == [300, 300, 300]


      def test_shares_add_up_to_the_total():
          # A cent that goes missing is a cent the ledger cannot reconcile.
          assert sum(split_amount(1000, 3)) == 1000


      def test_no_payers_is_an_error():
          with pytest.raises(ValueError):
              split_amount(100, 0)


      def test_split_by_weights_equal():
          assert split_by_weights(100, [1, 1, 1]) == [34, 33, 33]


      def test_split_by_weights_unequal():
          assert split_by_weights(100, [1, 2]) == [33, 67]


      def test_split_by_weights_floats():
          assert split_by_weights(100, [0.5, 1.5]) == [25, 75]


      def test_split_by_weights_zero_weight():
          assert split_by_weights(100, [0, 1, 1]) == [0, 50, 50]


      def test_split_by_weights_negative_total():
          assert split_by_weights(-100, [1, 2]) == [-33, -67]


      def test_split_by_weights_zero_total():
          assert split_by_weights(0, [1, 2]) == [0, 0]


      def test_split_by_weights_empty_error():
          with pytest.raises(ValueError):
              split_by_weights(100, [])


      def test_split_by_weights_negative_weight_error():
          with pytest.raises(ValueError):
              split_by_weights(100, [1, -1])


      def test_split_by_weights_zero_sum_error():
          with pytest.raises(ValueError):
              split_by_weights(100, [0, 0, 0])

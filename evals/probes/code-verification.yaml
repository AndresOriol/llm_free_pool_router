      - Added corresponding unit tests in `tests/test_stock.py`.
      - Documented `restock` in `docs/stock.md`.

      ## 2026-09-20
      Warehouse inventory: bins in `inventory/stock.py`, the push to the warehouse
      service in `inventory/sync.py`. API reference in `docs/stock.md`.

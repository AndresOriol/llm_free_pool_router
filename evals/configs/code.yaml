# The coding agent: one conversation, wide members only.
#
# Renamed from `deepagents` when agent/deep became agent/code. No run was
# ever recorded under the old name, so nothing in results/ is orphaned.
#
# The only agent configuration. Everything it used to be compared against --
# the narrow-role harness and its seven variants -- is deleted, and in git along
# with what each one showed (evals/CONFIGS.md).
#
# The comparison this arm never won is still open. The conversational loop it
# descends from spent 226,854 input tokens against the narrow-role harness's
# 5,756 (docs/06-agent.md#641), and the first two runs of *this* configuration
# took 134,000-162,000. That baseline predates SummarizationMiddleware and ran
# on a pool whose floor was 6,000 tokens, so it is a hypothesis rather than a
# settled fact -- but nothing has closed it, and `input_tokens` is the column
# to read first on every batch (docs/06-agent.md#611-the-arm-that-was-deleted).
#
# HARNESS_SHELL is deliberately absent: the agent is more capable with a real
# shell, but eval runs are not containerized, and the default must not widen the
# blast radius silently (docs/design/long-run-harness.md#42-bash-for-the-executor).
name: code
repo: ../..
ref: harness/deepagents
env_file: ../../llm_router/.env
overrides:
  router_config: llm_router/config.yaml
  env: {}

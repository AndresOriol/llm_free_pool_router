# The `session` harness with the nodes fed and a regression gate in front of DONE.
#
# A bundle, deliberately, and it should be read as one: the pass column at these
# sample sizes cannot separate five changes, so this measures whether the
# direction helps at all. Ablations come after, and only if it does.
#
# Against `session` (the baseline), this branch changes:
#
#   1. write reads exec/notes/edits/diff, not just task+files. It applies the
#      changes, so it is the node that has to react to them failing.
#   2. Log caps sized against the middle of the pool rather than its floor.
#      Size-aware routing already picks the member; the caps only decided what
#      a node was allowed to know.
#   3. max_rounds raised so one node can finish a read -> edit -> run -> fix
#      chain instead of handing half of it to a node with no memory of it.
#   4. Searching tools report what they truncated instead of silently
#      answering with the first 40 matches.
#   5. A DONE that broke a previously-passing test is refused and sent back to
#      WRITE (agent/harness/gate.py). MAX_STEPS 14 -> 20 to leave room for it.
#
# Same pool file and same agent_cmd as `session`, so the pool is not a variable.
name: context-and-gate
repo: ../..
ref: harness/context-and-gate
env_file: ../../llm_router/.env
agent_cmd: ["python", "-m", "agent.harness", "{workdir}"]
overrides:
  router_config: llm_router/config.yaml
  env: {}

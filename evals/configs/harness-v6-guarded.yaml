# Ad-hoc harness, architecture variant `v6-guarded`.
# v5 plus a forced summary round and a no-note guard on edit.
#
# Differs from `adhoc-harness` only by HARNESS_VARIANT, so a comparison between
# them isolates the architecture from everything else.
name: harness-v6-guarded
repo: ../..
ref: harness/adhoc-router
env_file: ../../llm_router/.env
agent_cmd: ["python", "-m", "agent.harness", "{workdir}"]
overrides:
  router_config: llm_router/config.eval.yaml
  env:
    HARNESS_VARIANT: v6-guarded

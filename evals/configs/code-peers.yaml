# The coding agent with a peer it can delegate research to.
#
# `code` plus one `delegate` tool. Everything else -- prompt, jail, floor,
# middleware, subagent -- is identical, and with AGENT_PEERS empty this branch's
# coding agent has exactly the tools `code` has, which is what makes the pair a
# clean A/B (docs/16-agent-protocol.md#167).
#
# The agent behind `delegate` is LangChain's deep-research agent, ported: an
# orchestrator over a research sub-agent, a `tavily_search` that returns whole
# pages rather than a summary of them, and a `think_tool` after every search
# (docs/15-explorer.md#158-the-deep-research-port).
#
# **This used to be two configurations.** `code-peers-deep` was the deep-research
# arm and `code-peers` the grounded-Gemini one; the latter is deleted, so they
# would now be the same run. The old arm is reachable at `89181a2` if it is ever
# worth measuring what the replacement cost -- but the thing that motivated the
# replacement was a recorded run, not a hypothesis (evals/CONFIGS.md).
#
# What a run is asking:
#
#   1. Does the coding agent delegate at all, and on the right questions?
#      `delegated_tasks` in the run record says how often; the trajectory says
#      whether the questions needed outside knowledge or could have been
#      answered by reading the repo.
#   2. What does it cost? A delegation is now an orchestrator conversation plus
#      one sub-agent conversation per topic, all billed to the same
#      EVAL_TRACE_FILE, so `input_tokens` here includes them. Read that column
#      against `code` before reading anything else. The direction is genuinely
#      unknown: there are more conversations, and the fetched pages stay in a
#      context that is thrown away.
#   3. Was the method followed? evals/research_trajectory.py -- the search
#      budget, the search->think loop, whether the request was saved, whether a
#      report was written.
#
# Needs TAVILY_API_KEY_1 in llm_router/.env. The pool holds one account today,
# so a run that exhausts its monthly credits has nothing to fail over to --
# check the credit balance before a batch.
#
# Nothing enforces a per-delegation budget yet, deliberately: the number would
# be invented rather than observed (docs/16-agent-protocol.md#166).
#
# Interleaved against `code`, never alone -- running a configuration on its own
# is what left `harness-v8-session` with no verdict (evals/CONFIGS.md).
name: code-peers
repo: ../..
ref: harness/agent-protocol
env_file: ../../llm_router/.env
overrides:
  router_config: llm_router/config.yaml
  env:
    AGENT_PEERS: explore

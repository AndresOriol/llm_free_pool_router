# The coding agent with a peer it can delegate research to.
#
# `code` plus one tool. Everything else -- prompt, jail, floor, middleware,
# subagent -- is identical, and with AGENT_PEERS empty this branch's agent is
# byte-for-byte `code`, which is what makes the pair a clean A/B
# (docs/16-agent-protocol.md#167-what-this-costs-and-what-is-unmeasured).
#
# What the run is asking:
#
#   1. Does it delegate at all, and on the right questions? `delegated_tasks` in
#      the run record says how often; the trajectory says whether the questions
#      needed outside knowledge or could have been answered by reading the repo.
#   2. What does a delegation cost? A delegated task is a whole explorer session
#      -- 14-21 model calls in the measured range -- billed to the same
#      EVAL_TRACE_FILE, so `input_tokens` here includes it. Read that column
#      against `code` before reading anything else.
#   3. Does the caller use what came back, or read the note and ask again?
#
# Nothing enforces a per-task budget yet, deliberately: the number would be
# invented rather than observed. Expect this configuration to be the expensive
# one, and expect a run to spend flash-tier requests twice as fast
# (docs/08-evaluation-method.md#89-budget).
#
# Interleaved against `code`, never alone -- running a configuration on its own
# is what left `harness-v8-session` with no verdict (evals/CONFIGS.md).
name: code-peers
repo: ../..
ref: harness/agent-protocol
env_file: ../../llm_router/.env
overrides:
  router_config: llm_router/config.yaml
  env:
    AGENT_PEERS: explore

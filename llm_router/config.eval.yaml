# Eval pool: llm_router/config.yaml minus models that are dead upstream.
#
# Groq returns `404 model_not_found` for llama-4-scout and qwen3-32b. A 404 is
# not in the router's transient set, so it propagates and kills the whole run.
# Both were verified dead by probing every pool member directly.
#
# Dropping them here isolates a comparison from that crash. This is a
# workaround for the measurement, NOT the fix: the router should disable a
# decommissioned model permanently, the way it benches a rate-limited one
# temporarily (docs/13-roadmap.md#132-what-to-do-next).
#
# Note which configurations this bites. A dead model is only reached if a
# request is small enough to pass the size filter, so an agent that shrinks its
# requests -- the whole point of the ad-hoc harness -- reaches *further* into
# the pool and trips landmines that a token-heavy agent never gets near. The
# 6,000-ceiling qwen3-32b was invisible to the deep-agents loop for exactly
# this reason.
#
# Every eval configuration points at this same file, so both sides of a
# comparison draw from an identical pool. Regenerate after editing config.yaml.
accounts:
- name: groq_1
  user:
  - EMAIL_ADDRESS
  platform: groq
  type: openai_compatible
  url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY_1
- name: gemini_1
  user:
  - EMAIL_ADDRESS
  platform: gemini
  type: gemini
  url: https://generativelanguage.googleapis.com/v1beta/models
  api_key_env: GEMINI_API_KEY_1
- name: gemini_2
  user:
  - EMAIL_ADDRESS
  platform: gemini
  type: gemini
  url: https://generativelanguage.googleapis.com/v1beta/models
  api_key_env: GEMINI_API_KEY_2
models:
- name: Llama3_70b
  platform: groq
  model: llama-3.3-70b-versatile
  priority: 1
  max_input_tokens: 12000
- name: GptOss120b
  platform: groq
  model: openai/gpt-oss-120b
  priority: 2
  max_input_tokens: 8000
- name: Gemini_3_5_Flash
  platform: gemini
  model: gemini-3.5-flash
  priority: 3
  max_input_tokens: 250000
- name: Qwen3_6_27b
  platform: groq
  model: qwen/qwen3.6-27b
  priority: 11
  max_input_tokens: 8000
- name: Gemini_3_Flash
  platform: gemini
  model: gemini-3-flash-preview
  priority: 12
  max_input_tokens: 250000
- name: Gemini_2_5_Flash
  platform: gemini
  model: gemini-2.5-flash
  priority: 13
  max_input_tokens: 250000
- name: GptOss20b
  platform: groq

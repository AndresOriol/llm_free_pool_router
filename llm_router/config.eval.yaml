# Eval pool: a pinned copy of llm_router/config.yaml.
#
# It exists so both sides of a comparison draw from an identical pool even if
# config.yaml is edited mid-batch. Regenerate after editing config.yaml.
#
# It used to exist for another reason: Groq 404s on a retired model, a 404 is
# not transient, and it propagated and killed the whole run -- so dead models
# were deleted here by hand to isolate the measurement. That was a workaround
# for the measurement and not the fix, and it is no longer needed: the router
# retires a member the platform says is gone and carries on with the rest
# (llm_router/base_provider.py, is_decommissioned).
#
# Which configurations that bit is worth remembering. A dead model is only
# reached if a request is small enough to pass the size filter, so an agent
# that shrinks its requests -- the whole point of the ad-hoc harness -- reaches
# *further* into the pool and trips landmines a token-heavy agent never gets
# near. The 6,000-ceiling qwen3-32b was invisible to the deep-agents loop for
# exactly this reason.
accounts:
- name: groq_1
  user:
  - EMAIL_ADDRESS
  platform: groq
  type: openai_compatible
  url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY_1
- name: gemini_1
  user:
  - EMAIL_ADDRESS
  platform: gemini
  type: gemini
  url: https://generativelanguage.googleapis.com/v1beta/models
  api_key_env: GEMINI_API_KEY_1
- name: gemini_2
  user:
  - EMAIL_ADDRESS
  platform: gemini
  type: gemini
  url: https://generativelanguage.googleapis.com/v1beta/models
  api_key_env: GEMINI_API_KEY_2
models:
- name: GptOss120b
  platform: groq
  model: openai/gpt-oss-120b
  priority: 2
  max_input_tokens: 8000
- name: Gemini_3_5_Flash
  platform: gemini
  model: gemini-3.5-flash
  priority: 3
  max_input_tokens: 250000
- name: Qwen3_6_27b
  platform: groq
  model: qwen/qwen3.6-27b
  priority: 11
  max_input_tokens: 8000
- name: Gemini_3_Flash
  platform: gemini
  model: gemini-3-flash-preview
  priority: 12
  max_input_tokens: 250000
- name: Gemini_2_5_Flash
  platform: gemini
  model: gemini-2.5-flash
  priority: 13
  max_input_tokens: 250000
- name: GptOss20b
  platform: groq
  model: openai/gpt-oss-20b
  priority: 21
  max_input_tokens: 8000
- name: Gemini_3_1_FlashLite
  platform: gemini
  model: gemini-3.1-flash-lite
  priority: 22
  max_input_tokens: 250000
- name: Gemini_2_5_FlashLite
  platform: gemini
  model: gemini-2.5-flash-lite
  priority: 23
  max_input_tokens: 250000
- name: Gemma4_31b
  platform: gemini
  model: gemma-4-31b-it
  priority: 31
  max_input_tokens: 128000
- name: Gemma4_26b
  platform: gemini

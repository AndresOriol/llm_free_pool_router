# All models must support tool/function calling (the agent loop tool-calls every
# step and reroutes mid-task). Groq's `compound` systems are excluded for that.
#
# Models are defined once per platform; the loader fans each out across every
# account on that platform. See docs/03-pool-model.md and docs/05-providers.md.
#
# Fields:
#   type              provider adapter: openai_compatible (url = v1 base) or gemini
#   priority          lower = tried first; grouped in tiers (see below)
#   temperature       optional, defaults to 0.2
#   max_input_tokens  per-request ceiling for size-aware routing;
#                     min(TPM, context window). Omit only if genuinely unknown.
#   limits            published free-tier quota (rpm/rpd/tpm/tpd). The quota panel
#                     checks all four; the router reads only rpd, to skip a member
#                     whose day is spent (docs/04-failover.md). A missing key = not
#                     published/enforced. Snapshot values -- re-check periodically.
#
# Priority tiers: reasoning (1-9) -> mid (10-19) -> workhorse (20-29) -> last
# resort (30+). Order within a tier barely matters -- Groq shares one org-wide
# request budget across all its models. Gaps leave room to slot in new models.
accounts:
  - name: groq_1
    user: [EMAIL_ADDRESS]
    platform: groq
    type: openai_compatible
    url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY_1
  - name: gemini_1
    user: [EMAIL_ADDRESS]
    platform: gemini
    type: gemini
    url: https://generativelanguage.googleapis.com/v1beta/models
    api_key_env: GEMINI_API_KEY_1
  - name: gemini_2
    user: [EMAIL_ADDRESS]
    platform: gemini
    type: gemini
    url: https://generativelanguage.googleapis.com/v1beta/models
    api_key_env: GEMINI_API_KEY_2
  - name: gemini_3
    user: [EMAIL_ADDRESS]
    platform: gemini
    type: gemini
    url: https://generativelanguage.googleapis.com/v1beta/models
    api_key_env: GEMINI_API_KEY_3
  - name: gemini_4
    user: [EMAIL_ADDRESS]
    platform: gemini
    type: gemini
    url: https://generativelanguage.googleapis.com/v1beta/models
    api_key_env: GEMINI_API_KEY_4
  - name: gemini_5
    user: [EMAIL_ADDRESS]
    platform: gemini
    type: gemini
    url: https://generativelanguage.googleapis.com/v1beta/models
    api_key_env: GEMINI_API_KEY_5

models:
  # Retired models (Groq's Llama line, qwen3-32b) are removed, not kept as
  # known-dead entries -- the router self-retires anything the platform 404s.

  # -- Reasoning tier: ambiguous/architectural steps. Gemini leads; gpt-oss-120b
  # (8k ceiling) is only the fallback once the flash models' 20/day is spent.
  # 3.7 sits behind 3.6 despite being newer: measured 2026-08-25 it took 33-54s
  # (vs 0.9s) and 503'd once in four calls -- better model, worse per-step loop.
  - name: Gemini_3_6_Flash
    platform: gemini
    model: gemini-3.6-flash
    priority: 1
    max_input_tokens: 250000
    limits: {rpm: 5, tpm: 250000, rpd: 20}

  - name: Gemini_3_7_Flash
    platform: gemini
    model: gemini-3.7-flash
    priority: 2
    max_input_tokens: 250000
    limits: {rpm: 5, tpm: 250000, rpd: 20}

  - name: Gemini_3_5_Flash
    platform: gemini
    model: gemini-3.5-flash
    priority: 3
    max_input_tokens: 250000
    limits: {rpm: 5, tpm: 250000, rpd: 20}

  - name: GptOss120b
    platform: groq
    model: openai/gpt-oss-120b
    priority: 4
    max_input_tokens: 8000
    limits: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 100000}

  # -- Mid tier: well-scoped implementation steps.
  - name: Qwen3_6_27b
    platform: groq
    model: qwen/qwen3.6-27b
    priority: 11
    max_input_tokens: 8000
    limits: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 100000}

  - name: Gemini_3_Flash
    platform: gemini
    model: gemini-3-flash-preview
    priority: 12
    max_input_tokens: 250000
    limits: {rpm: 5, tpm: 250000, rpd: 20}

  - name: Gemini_2_5_Flash
    platform: gemini
    model: gemini-2.5-flash
    priority: 13
    max_input_tokens: 250000
    limits: {rpm: 5, tpm: 250000, rpd: 20}

  # -- Workhorse fallback: weaker, but Groq's shared request budget routinely
  # dumps whole tasks here once the upper tiers exhaust, so quality still matters.
  # See docs/03-pool-model.md#34-priority-tiers.
  - name: GptOss20b
    platform: groq
    model: openai/gpt-oss-20b
    priority: 21
    max_input_tokens: 8000
    limits: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 100000}

  - name: Gemini_3_5_FlashLite
    platform: gemini
    model: gemini-3.5-flash-lite
    priority: 22
    max_input_tokens: 250000
    limits: {rpm: 15, tpm: 250000, rpd: 500}

  - name: Gemini_3_1_FlashLite
    platform: gemini
    model: gemini-3.1-flash-lite
    priority: 23
    max_input_tokens: 250000
    limits: {rpm: 15, tpm: 250000, rpd: 500}

  - name: Gemini_2_5_FlashLite
    platform: gemini
    model: gemini-2.5-flash-lite
    priority: 24
    max_input_tokens: 250000
    limits: {rpm: 10, tpm: 250000, rpd: 20}

  # -- Last resort: only when everything above is in cooldown. Gemma has
  # unlimited TPM, so its ceiling is the model's context window.
  - name: Gemma4_31b
    platform: gemini
    model: gemma-4-31b-it
    priority: 31
    max_input_tokens: 128000
    limits: {rpm: 15, rpd: 1500}

  - name: Gemma4_26b
    platform: gemini
    model: gemma-4-26b-a4b-it
    priority: 32
    max_input_tokens: 128000
    limits: {rpm: 15, rpd: 1500}

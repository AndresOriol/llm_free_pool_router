# Every model here must support tool/function calling: the deep-agents loop
# issues tool calls on every step and reroutes across the whole pool mid-task,
# so a non-tool model would break a task if selected. Groq's `compound` /
# `compound-mini` agentic systems don't accept a standard `tools` param and are
# intentionally excluded.
#
# For openai_compatible entries, `url` is the v1 base (no /chat/completions).
# `priority`: lower = tried first. Optional `temperature` defaults to 0.2.
providers:
  - name: Groq_Account_1
    type: openai_compatible
    url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY_1
    priority: 1

  - name: Groq_Account_1_GptOss120b
    type: openai_compatible
    url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY_1
    priority: 2

  - name: Groq_Account_1_Qwen3_32b
    type: openai_compatible
    url: https://api.groq.com/openai/v1
    model: qwen/qwen3-32b
    api_key_env: GROQ_API_KEY_1
    priority: 3

  - name: Groq_Account_1_Qwen3_6_27b
